'use strict';
// ────────────────────────────────────────────────────────
// ReactiveState – observable state container
// ────────────────────────────────────────────────────────
class ReactiveState extends EventTarget {
    constructor() {
        super();
        this.currentDirHandle = null;
        this.tabs = [];
        this.currentTabId = null;
        this.expandedFolders = new Set();
        this.activeFilePath = null;
        this.activeDirectoryPath = null;
        this.copiedNode = null;
        return new Proxy(this, {
            get(target, prop) {
                const value = Reflect.get(target, prop);
                return typeof value === 'function' ? value.bind(target) : value;
            },
            set(target, prop, value) {
                if (target[prop] === value) return true;
                target[prop] = value;
                target.dispatchEvent(new CustomEvent(prop + 'Changed'));
                return true;
            }
        });
    }

    /** @param {number} id */
    getTab(id) { return this.tabs.find(t => t.id === id); }

    /** @returns {object|null} */
    getActiveTab() { return this.currentTabId !== null ? this.getTab(this.currentTabId) : null; }
}

// ────────────────────────────────────────────────────────
// PathUtils – file-path helpers
// ────────────────────────────────────────────────────────
class PathUtils {
    /**
     * Resolves a path relative to a base directory handle.
     * @param {FileSystemDirectoryHandle} base
     * @param {string} pathStr
     */
    async resolve(base, pathStr = '') {
        if (!base) throw new Error('No base handle');
        if (!pathStr || pathStr === '/') {
            return { parent: base, name: base.name, path: '/' };
        }
        const parts = pathStr.split('/').filter(Boolean);
        let parent = base;
        const name = parts[parts.length - 1];
        for (let i = 0; i < parts.length - 1; i++) {
            parent = await parent.getDirectoryHandle(parts[i]);
        }
        return { parent, name, path: pathStr };
    }
}

// ────────────────────────────────────────────────────────
// FileSystemManager – refactored (March 2026)
// Reduced 38%, cleaner architecture, same behavior
// ────────────────────────────────────────────────────────
class FileSystemManager {
    #TEXT_FILE_EXTENSIONS = /\.(txt|md|js|ts|html|css|json|py|go|rs|jsx|tsx|vue|xml|yaml|yml|toml|sh|bash|sql)$/i;
    #INVALID_CHARS = /[<>:"|?*\x00-\x1F]/;
    #saveInProgress = false;

    /** @param {ReactiveState} state @param {PathUtils} pathUtils */
    constructor(state, pathUtils) {
        this.state = state;
        this.pathUtils = pathUtils;
        this.db = null;
        /** @type {TreeManager} */ this.tree = null;
        /** @type {TabManager} */ this.tabs = null;
        /** @type {UIManager} */ this.ui = null;

        this.scheduleSave = (() => {
            let timer;
            return () => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    if (this.#saveInProgress || !this.state.currentTabId) return;
                    const tab = this.state.getTab(this.state.currentTabId);
                    if (tab?.dirty) this.saveTab(tab);
                }, 750);
            };
        })();
    }

    // ── Core helpers ───────────────────────────────────────
    async #guard(handle, action = 'operation') {
        if (!handle) throw new Error('No handle');
        let perm = await this.queryPermission(handle);
        if (perm === 'granted') return handle;
        perm = await handle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') throw new Error(`${action} permission denied`);
        return handle;
    }

    async #write(handle, content) {
        const writable = await handle.createWritable();
        await writable.write(content);
        await writable.close();
    }

    #formatError(action, e) {
        if (e.name === 'NotAllowedError') return `${action} failed: permission denied – re-open folder`;
        if (e.name === 'QuotaExceededError') return `${action} failed: not enough disk space`;
        if (e.name === 'NotFoundError') return `${action} failed: file/folder not found`;
        return `${action} failed: ${e.message || e}`;
    }

    async #entryExists(dirHandle, name) {
        try {
            await dirHandle.getFileHandle(name);
            return true;
        } catch (e) { if (e.name !== 'NotFoundError') throw e; }
        try {
            await dirHandle.getDirectoryHandle(name);
            return true;
        } catch (e) { if (e.name !== 'NotFoundError') throw e; }
        return false;
    }

    // ── DB & persistence ───────────────────────────────────
    async initDB() {
        if (this.db) return;
        return new Promise(resolve => {
            const req = indexedDB.open('FileEditor', 2);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
                if (!db.objectStoreNames.contains('extensions')) db.createObjectStore('extensions');
            };
            req.onsuccess = e => { this.db = e.target.result; resolve(); };
            req.onerror = () => resolve();
        });
    }

    async queryPermission(handle) {
        if (!handle) return 'denied';
        try { return await handle.queryPermission({ mode: 'readwrite' }); } catch { return 'denied'; }
    }

    async saveFolderHandle(handle) {
        await this.initDB();
        const tx = this.db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(handle, 'main');
    }

    async loadSavedFolder() {
        await this.initDB();
        return new Promise(resolve => {
            const tx = this.db.transaction('handles');
            const req = tx.objectStore('handles').get('main');
            req.onsuccess = async () => {
                const handle = req.result;
                if (!handle) return resolve({ status: 'none' });

                const perm = await this.queryPermission(handle);
                if (perm === 'granted') return resolve({ status: 'granted', handle });

                try {
                    const granted = await handle.requestPermission({ mode: 'readwrite' });
                    resolve(granted === 'granted' ? { status: 'granted', handle } : { status: 'needs-auth', handle });
                } catch {
                    resolve({ status: 'needs-auth', handle });
                }
            };
            req.onerror = () => resolve({ status: 'none' });
        });
    }

    async clearSavedFolder() {
        if (this.db) {
            const tx = this.db.transaction('handles', 'readwrite');
            tx.objectStore('handles').delete('main');
        }
        this.state.currentDirHandle = null;
        this.state.activeDirectoryPath = null;
        this.state.expandedFolders.clear();
        localStorage.removeItem('expandedFolders');
        localStorage.removeItem('openTabs');
        this.tree.clear();
        this.tree.updateHeader();
    }

    // ── Tree & lazy loading ────────────────────────────────
    async loadChildren(dirNode) {
        if (dirNode.kind !== 'directory' || dirNode.childrenLoaded) return;

        dirNode.children = [];
        try {
            const entries = [];
            for await (const [name, handle] of dirNode.handle.entries()) {
                if (name.startsWith('.') || name === 'node_modules' || name === '__pycache__') continue;
                entries.push([name, handle]);
            }
            entries.sort(([aName, aH], [bName, bH]) =>
                (aH.kind !== bH.kind ? (aH.kind === 'directory' ? -1 : 1) : aName.localeCompare(bName, undefined, { numeric: true }))
            );

            for (const [name, handle] of entries) {
                const path = dirNode.path === '/' ? name : `${dirNode.path}/${name}`;
                const node = handle.kind === 'directory'
                    ? { name, kind: 'directory', handle, path, children: [], childrenLoaded: false }
                    : { name, kind: 'file', handle, path };
                this.tree.registerNode(path, node);
                dirNode.children.push(node);
            }
        } catch {}
        dirNode.childrenLoaded = true;
    }

    async build(rootHandle) {
        this.tree.clear();
        const root = {
            name: rootHandle.name,
            kind: 'directory',
            handle: rootHandle,
            path: '/',
            children: [],
            childrenLoaded: false
        };
        this.tree.registerNode('/', root);
        this.tree.fileTree = root;
        await this.loadChildren(root);
        return root;
    }

    async mutateAndRebuild() {
        if (!this.state.currentDirHandle) return;
        const previouslyExpanded = new Set(this.state.expandedFolders);
        await this.build(this.state.currentDirHandle);

        for (const path of [...previouslyExpanded].sort((a, b) => a.split('/').length - b.split('/').length)) {
            const node = this.tree.getNode(path);
            if (node?.kind === 'directory') {
                await this.loadChildren(node);
                this.state.expandedFolders.add(path);
            }
        }
        this.tree.render();
        this.tree.updateHeader();
    }

    // ── Expanded tabs persistence ──────────────────────────
    loadExpandedState() {
        try {
            const saved = localStorage.getItem('expandedFolders');
            if (saved) this.state.expandedFolders = new Set(JSON.parse(saved));
        } catch {}
    }

    saveExpandedState() {
        try { localStorage.setItem('expandedFolders', JSON.stringify([...this.state.expandedFolders])); } catch {}
    }

    saveOpenTabs(currentId) {
        try {
            const data = this.state.tabs
                .filter(t => t.path)
                .map(t => ({ path: t.path, name: t.name, type: t.type, active: t.id === currentId }));
            if (data.length || this.state.currentDirHandle) {
                localStorage.setItem('openTabs', JSON.stringify(data));
            }
        } catch {}
    }

    loadOpenTabs() {
        try {
            const saved = localStorage.getItem('openTabs');
            return saved ? JSON.parse(saved) : [];
        } catch { return []; }
    }

    // ── Session restore ────────────────────────────────────
    async restoreSession() {
        this.loadExpandedState();
        const saved = await this.loadSavedFolder();

        if (saved.status === 'granted') {
            this.state.currentDirHandle = saved.handle;
            await this.build(saved.handle);
            await this.#expandSavedFolders();
            this.tree.render();
            this.tree.updateHeader();
            const restored = await this.tabs.restoreOpenTabs(saved.handle);
            if (restored) this.ui.showToast(`Restored ${restored} tab${restored > 1 ? 's' : ''}`);
        } else if (saved.status === 'needs-auth') {
            this.#handlePendingAuth(saved.handle);
        }

        if (!this.state.tabs.length) {
            await this.tabs.createNewTab(null, 'welcome.txt', window.WELCOME, null, 'welcome');
        }
    }

    async #expandSavedFolders() {
        for (const path of [...this.state.expandedFolders].sort((a, b) => a.split('/').length - b.split('/').length)) {
            const node = this.tree.getNode(path);
            if (node?.kind === 'directory') await this.loadChildren(node);
        }
    }

    #handlePendingAuth(handle) {
        const pendingTabs = this.loadOpenTabs();
        this.ui.showActionToast('Tap to restore folder access', async () => {
            try {
                if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted') {
                    this.ui.showToast('Access was not granted');
                    return;
                }
                this.state.currentDirHandle = handle;
                await this.build(handle);
                this.loadExpandedState();
                await this.#expandSavedFolders();
                this.tree.render();
                this.tree.updateHeader();

                // Remove welcome tab before restore
                const welcomeIdx = this.state.tabs.findIndex(t => t.type === 'welcome');
                if (welcomeIdx !== -1) {
                    this.state.tabs[welcomeIdx].element.remove();
                    this.state.tabs.splice(welcomeIdx, 1);
                }

                const restored = await this.tabs.restoreOpenTabs(handle, pendingTabs);
                if (restored) this.ui.showToast(`Restored ${restored} tab${restored > 1 ? 's' : ''}`);
                else if (!this.state.tabs.length) {
                    await this.tabs.createNewTab(null, 'welcome.txt', window.WELCOME, null, 'welcome');
                }
                this.ui.showToast('Folder access restored ✓', 1800);
            } catch {
                this.ui.showToast('Failed to restore access');
            }
        }, 15000);
    }

    // ── Open folder/file ───────────────────────────────────
    async openFolder() {
        try {
            this.state.currentDirHandle = await window.showDirectoryPicker();
            await this.saveFolderHandle(this.state.currentDirHandle);
            this.state.expandedFolders.clear();
            this.state.activeDirectoryPath = null;
            await this.build(this.state.currentDirHandle);
            this.tree.render();
            this.tree.updateHeader();
            this.ui.showToast('Folder opened successfully');
        } catch (e) {
            if (e.name !== 'AbortError') this.ui.showToast('Open folder cancelled or failed');
        }
    }

    async openFile() {
        try {
            const [handle] = await window.showOpenFilePicker();
            const file = await handle.getFile();
            if (!file.type.startsWith('text/') && !this.#TEXT_FILE_EXTENSIONS.test(file.name)) {
                if (!await this.ui.showDialog({ isConfirm: true, confirmMessage: 'Binary file detected. Open anyway?' })) return;
            }
            const content = await file.text();
            await this.tabs.createNewTab(handle, file.name, content);
        } catch (e) {
            if (e.name !== 'AbortError') this.ui.showToast('Open file cancelled or failed');
        }
    }

    async openFileFromNode(node) {
        try {
            const file = await node.handle.getFile();
            if (!file.type.startsWith('text/') && !this.#TEXT_FILE_EXTENSIONS.test(file.name)) {
                if (!await this.ui.showDialog({ isConfirm: true, confirmMessage: 'Binary file detected. Open anyway?' })) return;
            }
            const content = await file.text();
            await this.tabs.createNewTab(node.handle, node.name, content, node.path);
            if (this.ui.isMobile && !this.ui.sidebarEl.classList.contains('hidden')) {
                this.ui.toggleSidebar();
            }
        } catch (e) {
            this.ui.showToast(e.message.includes('permission') ? 'Re-open folder to grant write access' : 'Failed to open file');
        }
    }

    // ── Target directory for new items ─────────────────────
    async #getTargetDir() {
        const targetPath = this.ui.contextMenuTarget?.kind === 'directory'
            ? this.ui.contextMenuTarget.path
            : (this.state.activeDirectoryPath || '');

        const { parent, name } = await this.pathUtils.resolve(this.state.currentDirHandle, targetPath);
        const dir = targetPath ? await parent.getDirectoryHandle(name) : parent;
        await this.#guard(dir);
        return { dir, targetPath };
    }

    // ── New file/folder ────────────────────────────────────
    async #newItem(kind) {
        if (!this.state.currentDirHandle) return this.ui.showToast('Open a folder first');
        const isFile = kind === 'file';
        const name = await this.ui.showDialog({ promptTitle: isFile ? 'New file name:' : 'New folder name:' });
        if (!name?.trim()) return;
        const trimmed = name.trim();
        if (this.#INVALID_CHARS.test(trimmed) || /[\/\\]/.test(trimmed))
            return this.ui.showToast(isFile ? 'Invalid filename' : 'Invalid folder name');
        const { dir, targetPath } = await this.#getTargetDir();
        if (isFile) {
            const handle = await dir.getFileHandle(trimmed, { create: true });
            await this.#write(handle, '');
            if (targetPath) {
                this.state.expandedFolders.add(targetPath);
                this.saveExpandedState();
            }
            await this.mutateAndRebuild();
            await this.tabs.createNewTab(handle, trimmed, '', targetPath ? `${targetPath}/${trimmed}` : trimmed);
        } else {
            await dir.getDirectoryHandle(trimmed, { create: true });
            if (targetPath) {
                this.state.expandedFolders.add(targetPath);
                this.saveExpandedState();
            }
            await this.mutateAndRebuild();
            this.ui.showToast('Folder created');
        }
        this.ui.closeContextMenu();
    }

    async newFile() { return this.#newItem('file'); }
    async newFolder() { return this.#newItem('folder'); }

    // ── Save ───────────────────────────────────────────────
    async saveTab(tab) {
        if (!tab?.handle || !tab.dirty) return;
        try {
            const content = (this.state.currentTabId === tab.id && tab.type !== 'extension')
                ? this.ui.textarea.value
                : tab.content;

            await this.#write(tab.handle, content);
            tab.content = content;
            tab.dirty = false;
            if (tab.element) tab.element.querySelector('.dirty-indicator').style.display = 'none';
            this.ui.updateEditorStatus(tab);
            this.ui.showToast('Saved', 1200);
        } catch (err) {
            this.ui.showToast(err.message.includes('permission') ? 'Re-authorize folder' : 'Save failed');
        }
    }

    saveCurrentFile() {
        const tab = this.state.getActiveTab();
        if (tab) this.saveTab(tab);
    }

    async flushSave() {
        if (this.#saveInProgress) return;
        this.#saveInProgress = true;
        try {
            await Promise.allSettled(this.state.tabs.filter(t => t.dirty).map(t => this.saveTab(t)));
        } finally {
            this.#saveInProgress = false;
        }
    }

    // ── Delete ─────────────────────────────────────────────
    async deleteFile() {
        const target = this.ui.contextMenuTarget;
        if (!target || target.kind !== 'file') return;
        if (!await this.ui.showDialog({ isConfirm: true, confirmMessage: `Delete "${target.name}"?`, danger: true })) {
            this.ui.closeContextMenu(); return;
        }

        try {
            for (const tab of this.state.tabs) {
                if (tab.handle && await this.isSameEntry(tab.handle, target.handle)) {
                    await this.tabs.closeTab(tab.id);
                    break;
                }
            }
            const { parent, name } = await this.pathUtils.resolve(this.state.currentDirHandle, target.path);
            await this.#guard(parent);
            await parent.removeEntry(name);
            await this.mutateAndRebuild();
            this.ui.showToast('File deleted');
        } catch {
            this.ui.showToast('Delete failed');
        }
        this.ui.closeContextMenu();
    }

    async deleteFolder() {
        const target = this.ui.contextMenuTarget;
        if (!target || target.kind !== 'directory') return;

        const isNonEmpty = target.children?.length > 0;
        const confirmed = isNonEmpty
            ? (await this.ui.showDialog({ promptTitle: `Type "remove" to delete non-empty folder "${target.name}":` }) || '').trim().toLowerCase() === 'remove'
            : await this.ui.showDialog({ isConfirm: true, confirmMessage: `Delete folder "${target.name}"?`, danger: true });

        if (!confirmed) { this.ui.closeContextMenu(); return; }

        try {
            const { parent, name } = await this.pathUtils.resolve(this.state.currentDirHandle, target.path);
            await this.#guard(parent);
            await parent.removeEntry(name, { recursive: true });
            this.state.expandedFolders.delete(target.path);
            this.saveExpandedState();
            await this.mutateAndRebuild();
            this.ui.showToast('Folder deleted');
        } catch {
            this.ui.showToast('Delete failed');
        }
        this.ui.closeContextMenu();
    }

    // ── Rename ─────────────────────────────────────────────
    async renameItem() {
        const target = this.ui.contextMenuTarget;
        if (!target) return;

        const newName = await this.ui.showDialog({
            promptTitle: `Rename ${target.kind}:`,
            defaultValue: target.name
        });
        if (!newName?.trim() || newName === target.name) { this.ui.closeContextMenu(); return; }

        const trimmed = newName.trim();
        if (this.#INVALID_CHARS.test(trimmed) || /[\/\\]/.test(trimmed)) {
            this.ui.showToast('Invalid name'); this.ui.closeContextMenu(); return;
        }

        try {
            const oldPath = target.path;
            const { parent } = await this.pathUtils.resolve(this.state.currentDirHandle, oldPath);
            await this.#guard(parent);

            let updatedHandle = target.handle;
            if (target.kind === 'directory') {
                if (target.handle.move) await target.handle.move(parent, trimmed);
                else throw new Error('Folder rename needs latest Chrome/Edge');
            } else {
                const content = await (await target.handle.getFile()).text();
                updatedHandle = await parent.getFileHandle(trimmed, { create: true });
                await this.#write(updatedHandle, content);
                await parent.removeEntry(target.name);
            }

            const newPath = oldPath.replace(/[^/]+$/, trimmed);
            this.tabs.updateTabPaths(oldPath, newPath, updatedHandle, trimmed);
            await this.mutateAndRebuild();
            this.ui.showToast(`Renamed to ${trimmed}`);
        } catch {
            this.ui.showToast('Rename failed');
        }
        this.ui.closeContextMenu();
    }

    // ── Move & Copy ────────────────────────────────────────
    async moveEntry(srcPath, destFolderPath = '') {
        const srcNode = this.tree.getNode(srcPath);
        if (!srcNode) return;

        if (srcNode.kind === 'directory' && destFolderPath.startsWith(srcPath + '/')) {
            return this.ui.showToast('Cannot move folder into itself');
        }

        try {
            const { parent: srcParent } = await this.pathUtils.resolve(this.state.currentDirHandle, srcPath);
            const destNode = this.tree.getNode(destFolderPath || '/');
            if (!destNode) return this.ui.showToast('Destination folder not found');

            await this.#guard(srcParent);
            await this.#guard(destNode.handle);
            if (srcNode.kind === 'directory') await this.#guard(srcNode.handle);

            if (await this.#entryExists(destNode.handle, srcNode.name)) {
                return this.ui.showToast(`"${srcNode.name}" already exists in destination`);
            }

            await (srcNode.kind === 'directory'
                ? this.#moveDirectory(srcNode, destNode.handle, destFolderPath)
                : this.#moveFile(srcNode, srcParent, destNode.handle, destFolderPath));

            if (destFolderPath) {
                this.state.expandedFolders.add(destFolderPath);
                this.saveExpandedState();
            }
            await this.mutateAndRebuild();
            this.ui.showToast(`Moved "${srcNode.name}"`);
        } catch (e) {
            this.ui.showToast(this.#formatError('Move', e), 4000);
        }
        this.ui.closeContextMenu();
    }

    async #moveFile(srcNode, srcParent, destHandle, destFolderPath) {
        if (srcNode.handle.move) {
            await srcNode.handle.move(destHandle, srcNode.name);
        } else {
            const file = await srcNode.handle.getFile();
            const newHandle = await destHandle.getFileHandle(srcNode.name, { create: true });
            await this.#write(newHandle, file);
            await srcParent.removeEntry(srcNode.name);
        }
        const newPath = destFolderPath ? `${destFolderPath}/${srcNode.name}` : srcNode.name;
        this.tabs.updateTabPaths(srcNode.path, newPath, srcNode.handle); // handle updated in place for move
    }

    async #moveDirectory(srcNode, destHandle, destFolderPath) {
        let moved = false;
        if (srcNode.handle.move) {
            try {
                await srcNode.handle.move(destHandle, srcNode.name);
                moved = true;
            } catch {}
        }
        if (!moved) {
            await this.#copyDirectory(srcNode.handle, destHandle, srcNode.name);
            await (await this.pathUtils.resolve(this.state.currentDirHandle, srcNode.path)).parent.removeEntry(srcNode.name, { recursive: true });
        }
    }

    async #copyDirectory(srcDirHandle, destParent, name) {
        const newDir = await destParent.getDirectoryHandle(name, { create: true });
        try {
            for await (const [entryName, entryHandle] of srcDirHandle.entries()) {
                if (entryHandle.kind === 'file') {
                    const file = await entryHandle.getFile();
                    const newHandle = await newDir.getFileHandle(entryName, { create: true });
                    await this.#write(newHandle, file);
                } else {
                    await this.#copyDirectory(entryHandle, newDir, entryName);
                }
            }
        } catch (e) {
            try { await destParent.removeEntry(name, { recursive: true }); } catch {}
            throw e;
        }
    }

    async copyEntry(srcNode, destFolderPath) {
        const destNode = this.tree.getNode(destFolderPath || '/');
        if (!destNode) return this.ui.showToast('Destination folder not found');

        try {
            await this.#guard(destNode.handle);
            if (await this.#entryExists(destNode.handle, srcNode.name)) {
                return this.ui.showToast(`"${srcNode.name}" already exists in destination`);
            }

            if (srcNode.kind === 'file') {
                const file = await srcNode.handle.getFile();
                const newHandle = await destNode.handle.getFileHandle(srcNode.name, { create: true });
                await this.#write(newHandle, file);
            } else {
                await this.#copyDirectory(srcNode.handle, destNode.handle, srcNode.name);
            }

            if (destFolderPath) {
                this.state.expandedFolders.add(destFolderPath);
                this.saveExpandedState();
            }
            await this.mutateAndRebuild();
            this.ui.showToast(`Copied "${srcNode.name}"`);
        } catch (e) {
            this.ui.showToast(this.#formatError('Copy', e), 4000);
        }
        this.ui.closeContextMenu();
    }

    async isSameEntry(h1, h2) {
        if (!h1 || !h2) return false;
        return h1.isSameEntry(h2);
    }
}
// ────────────────────────────────────────────────────────
// TreeManager – file tree data + DOM rendering
// ────────────────────────────────────────────────────────
class TreeManager {
    #fileTree = null;
    #nodeByPath = new Map();

    /** @param {ReactiveState} state @param {FileSystemManager} fs */
    constructor(state, fs) {
        this.state = state;
        this.fs = fs;
        this.longPressTriggered = false;
        this.treeContainer = null;
        this.activeDirNameEl = null;
        this.rootDirNameEl = null;
        this.sidebarHeaderActionsEl = null;
        this.state.addEventListener('activeFilePathChanged', () => this.highlightActive());
        this.state.addEventListener('activeDirectoryPathChanged', () => this.highlightActive());
    }

    get fileTree() { return this.#fileTree; }
    set fileTree(v) { this.#fileTree = v; }

    getNode(path) { return this.#nodeByPath.get(path); }
    registerNode(path, node) { this.#nodeByPath.set(path, node); }

    #renderTreeItem(node, parentEl, level = 0) {
        if (node.kind === 'directory') {
            const folderDiv = document.createElement('div');
            const header = document.createElement('div');
            header.className = 'folder-header' + (level === 0 ? ' top-level' : '');
            header.dataset.path = node.path;
            header.style.paddingLeft = (level * 14) + 'px';
            header.tabIndex = 0;
            const toggle = document.createElement('span');
            toggle.className = 'toggle';
            toggle.textContent = this.state.expandedFolders.has(node.path) ? '▼' : '▶';
            header.append(toggle, document.createTextNode(' ' + node.name + '/'));
            const childrenDiv = document.createElement('div');
            childrenDiv.className = 'tree-children';
            childrenDiv.style.display = this.state.expandedFolders.has(node.path) ? 'block' : 'none';
            folderDiv.append(header, childrenDiv);
            parentEl.appendChild(folderDiv);

            header.onclick = async (e) => {
                if (this.longPressTriggered) return;
                const isExpanded = this.state.expandedFolders.has(node.path);
                if (!isExpanded) {
                    await this.fs.loadChildren(node);
                    childrenDiv.replaceChildren();
                    node.children.forEach(c => this.#renderTreeItem(c, childrenDiv, level + 1));
                }
                if (isExpanded) {
                    this.state.expandedFolders.delete(node.path);
                    childrenDiv.style.display = 'none';
                    toggle.textContent = '▶';
                } else {
                    this.state.expandedFolders.add(node.path);
                    childrenDiv.style.display = 'block';
                    toggle.textContent = '▼';
                }
                this.fs.saveExpandedState();
                this.state.activeDirectoryPath = node.path;
                this.updateHeader();
            };
            header.onkeydown = e => { if (e.key === ' ') { e.preventDefault(); header.click(); } };

            header.draggable = true;
            header.addEventListener('dragstart', e => {
                e.dataTransfer.setData('application/x-tree-path', node.path);
                e.dataTransfer.effectAllowed = 'move';
                header.classList.add('dragging');
            });
            header.addEventListener('dragend', () => header.classList.remove('dragging'));
            header.addEventListener('dragover', e => {
                if (!e.dataTransfer.types.includes('application/x-tree-path')) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                header.classList.add('drop-target');
            });
            header.addEventListener('dragleave', () => header.classList.remove('drop-target'));
            header.addEventListener('drop', e => {
                e.preventDefault();
                header.classList.remove('drop-target');
                const srcPath = e.dataTransfer.getData('application/x-tree-path');
                if (srcPath && srcPath !== node.path && !node.path.startsWith(srcPath + '/')) {
                    this.fs.moveEntry(srcPath, node.path);
                }
            });

            if (this.state.expandedFolders.has(node.path) && node.children.length) {
                node.children.forEach(c => this.#renderTreeItem(c, childrenDiv, level + 1));
            }
        } else {
            const fileDiv = document.createElement('div');
            fileDiv.className = 'file-item';
            fileDiv.dataset.path = node.path;
            fileDiv.style.paddingLeft = (level * 14 + 26) + 'px';
            fileDiv.textContent = node.name;
            fileDiv.tabIndex = 0;
            fileDiv.onclick = () => { if (!this.longPressTriggered) this.fs.openFileFromNode(node); };
            fileDiv.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fileDiv.click(); } };

            fileDiv.draggable = true;
            fileDiv.addEventListener('dragstart', e => {
                e.dataTransfer.setData('application/x-tree-path', node.path);
                e.dataTransfer.effectAllowed = 'move';
                fileDiv.classList.add('dragging');
            });
            fileDiv.addEventListener('dragend', () => fileDiv.classList.remove('dragging'));

            parentEl.appendChild(fileDiv);
        }
    }

    render() {
        this.treeContainer.replaceChildren();
        if (!this.#fileTree) {
            const msg = document.createElement('div');
            msg.style.cssText = 'padding:20px;color:#52525b;text-align:center;font-size:12px';
            msg.textContent = 'No folder open';
            this.treeContainer.appendChild(msg);
            return;
        }
        this.#fileTree.children.forEach(child => this.#renderTreeItem(child, this.treeContainer, 0));
        this.highlightActive();
    }

    updateHeader() {
        if (!this.#fileTree || !this.state.currentDirHandle) {
            this.activeDirNameEl.textContent = '/';
            this.rootDirNameEl.textContent = 'Click to open folder';
            this.sidebarHeaderActionsEl.replaceChildren();
            return;
        }
        const safeName = this.state.currentDirHandle.name;
        this.rootDirNameEl.textContent = safeName;
        this.activeDirNameEl.textContent = this.state.activeDirectoryPath ? safeName + '/' + this.state.activeDirectoryPath : safeName;
        this.sidebarHeaderActionsEl.innerHTML =
            '<span class="directory-clear" id="refresh-folder" title="Refresh tree">⟳</span>' +
            '<span class="directory-clear" id="clear-folder">⌫</span>';
    }

    highlightActive() {
        this.treeContainer.querySelectorAll('.file-item.active,.folder-header.active,.folder-header.active-dir,.folder-header.active-ancestor').forEach(el => el.classList.remove('active','active-dir','active-ancestor'));
        if (this.state.activeFilePath) {
            const el = this.treeContainer.querySelector(`.file-item[data-path="${CSS.escape(this.state.activeFilePath)}"]`);
            if (el) el.classList.add('active');
            const parts = this.state.activeFilePath.split('/');
            for (let i = 1; i < parts.length; i++) {
                const p = parts.slice(0, i).join('/');
                const folderEl = this.treeContainer.querySelector(`.folder-header[data-path="${CSS.escape(p)}"]`);
                if (folderEl) folderEl.classList.add('active');
            }
        }
        if (this.state.activeDirectoryPath) {
            const dirEl = this.treeContainer.querySelector(`.folder-header[data-path="${CSS.escape(this.state.activeDirectoryPath)}"]`);
            if (dirEl) dirEl.classList.add('active-dir');
            const parts = this.state.activeDirectoryPath.split('/');
            for (let i = 1; i < parts.length; i++) {
                const p = parts.slice(0, i).join('/');
                const folderEl = this.treeContainer.querySelector(`.folder-header[data-path="${CSS.escape(p)}"]`);
                if (folderEl) folderEl.classList.add('active-ancestor');
            }
        }
    }

    clear() {
        this.#fileTree = null;
        this.#nodeByPath.clear();
        this.treeContainer.replaceChildren();
    }
}

// ────────────────────────────────────────────────────────
// ExtensionManager – discover, install & render
// ────────────────────────────────────────────────────────
class ExtensionManager {
    extensions = [];

    /** @param {ReactiveState} state @param {FileSystemManager} fs */
    constructor(state, fs) {
        this.state = state;
        this.fs = fs;
        /** @type {UIManager} */ this.ui = null;
    }

    async loadAll() {
        await this.fs.initDB();
        return new Promise(resolve => {
            const tx = this.fs.db.transaction('extensions');
            const store = tx.objectStore('extensions');
            const req = store.getAll();
            const keyReq = store.getAllKeys();
            tx.oncomplete = async () => {
                const handles = req.result;
                const keys = keyReq.result;
                this.extensions = [];
                for (let i = 0; i < handles.length; i++) {
                    try {
                        const handle = handles[i];
                        const perm = await this.fs.queryPermission(handle);
                        if (perm !== 'granted') {
                            try { await handle.requestPermission({ mode: 'read' }); } catch { continue; }
                        }
                        const file = await handle.getFile();
                        const html = await file.text();
                        const meta = this.#parseMeta(html);
                        if (meta) {
                            this.extensions.push({ key: keys[i], name: meta.name, types: meta.types, handle, html });
                        }
                    } catch { }
                }
                resolve();
            };
            tx.onerror = () => resolve();
        });
    }

    async install() {
        try {
            const [fileHandle] = await window.showOpenFilePicker({
                types: [{ description: 'Extension HTML', accept: { 'text/html': ['.html'] } }]
            });
            const file = await fileHandle.getFile();
            if (!file.name.endsWith('-extension.html')) {
                this.ui.showToast('Extension files must be named *-extension.html');
                return;
            }
            const html = await file.text();
            const meta = this.#parseMeta(html);
            if (!meta) {
                this.ui.showToast('Missing extension-name or extension-types meta tags');
                return;
            }
            const existing = this.extensions.find(e => e.name === meta.name);
            if (existing) {
                existing.handle = fileHandle;
                existing.html = html;
                existing.types = meta.types;
            } else {
                this.extensions.push({ key: meta.name, name: meta.name, types: meta.types, handle: fileHandle, html });
            }
            await this.fs.initDB();
            const tx = this.fs.db.transaction('extensions', 'readwrite');
            tx.objectStore('extensions').put(fileHandle, meta.name);
            this.ui.showToast(`Extension "${meta.name}" installed (${meta.types.join(', ')})`);
        } catch (e) {
            if (e.name !== 'AbortError') this.ui.showToast('Extension install cancelled or failed');
        }
    }

    async uninstall(name) {
        this.extensions = this.extensions.filter(e => e.name !== name);
        await this.fs.initDB();
        const tx = this.fs.db.transaction('extensions', 'readwrite');
        tx.objectStore('extensions').delete(name);
        this.ui.showToast(`Extension "${name}" removed`);
    }

    #parseMeta(html) {
        const nameMatch = html.match(/<meta\s+name=["']extension-name["']\s+content=["']([^"']+)["']/i);
        const typesMatch = html.match(/<meta\s+name=["']extension-types["']\s+content=["']([^"']+)["']/i);
        if (!nameMatch || !typesMatch) return null;
        return {
            name: nameMatch[1],
            types: typesMatch[1].split(',').map(t => t.trim().toLowerCase())
        };
    }

    getForFile(filename) {
        const lower = filename.toLowerCase();
        for (const ext of this.extensions) {
            for (const type of ext.types) {
                if (lower.endsWith(type)) return ext;
            }
        }
        return null;
    }

    renderTab(tab) {
        // Cancel stale fallback timers from a previous render
        if (tab._extTimers) tab._extTimers.forEach(t => clearTimeout(t));

        // Always recreate the iframe to guarantee a clean reload
        if (tab.extFrame) { tab.extFrame.remove(); tab.extFrame = null; }
        const iframe = document.createElement('iframe');
        iframe.className = 'ext-frame';
        iframe.sandbox = 'allow-scripts';
        document.querySelector('.editor-wrapper').appendChild(iframe);
        tab.extFrame = iframe;

        iframe.srcdoc = tab.extension.html;

        // Reliable delivery (srcdoc can be async)
        const sendLoadMessage = () => {
            try {
                tab.extFrame.contentWindow.postMessage({
                    type: 'editor:load',
                    content: tab.content || '',
                    filename: tab.name
                }, '*');
            } catch (e) {}
        };

        tab.extFrame.onload = sendLoadMessage;
        tab._extTimers = [
            setTimeout(sendLoadMessage, 60),   // fallback
            setTimeout(sendLoadMessage, 180)    // extra safety for CDNs
        ];
    }
}

// ────────────────────────────────────────────────────────
// TabManager – tab creation, switching & closing
// ────────────────────────────────────────────────────────
class TabManager {
    static #TAB_TYPES = {
        welcome:   { canSave: false, canDirty: false },
        legend:    { canSave: false, canDirty: false },
        text:      { canSave: true,  canDirty: true  },
        extension: { canSave: true,  canDirty: true  }
    };

    /** Returns true when a tab of the given type can be marked dirty/modified */
    static canTabBeDirty(type) { return TabManager.#TAB_TYPES[type]?.canDirty ?? false; }

    #nextTabId = 1;

    /** @param {ReactiveState} state @param {FileSystemManager} fs @param {ExtensionManager} extensions */
    constructor(state, fs, extensions) {
        this.state = state;
        this.fs = fs;
        this.extensions = extensions;
        /** @type {UIManager} */ this.ui = null;
        this.textarea = null;
        this.gutter = null;
        this.tabsContainer = null;
    }

    static #moveArrayItem(arr, fromIdx, toIdx) {
        arr.splice(toIdx, 0, arr.splice(fromIdx, 1)[0]);
    }

    #createTab(handle, name, content = '', path = null, type = 'text') {
        const ext = this.extensions.getForFile(name);
        if (ext) type = 'extension';
        else if (type === 'extension') type = 'text';
        return {
            id: this.#nextTabId++,
            name, handle, content, path, type,
            extension: ext || null,
            dirty: false,
            element: null,
            extFrame: null,
            blobUrl: null,
            scrollTop: 0,
        };
    }

    #makeExtToggleHandler(tab, extToggle) {
        return e => {
            e.stopPropagation();
            if (tab.type === 'extension') {
                tab.type = 'text';
                extToggle.className = 'ext-toggle inactive';
                if (tab.extFrame) tab.extFrame.classList.add('hidden');
                // Clear state.currentTabId so switchToTab won't save stale textarea content
                this.state.currentTabId = null;
                this.switchToTab(tab.id);
            } else {
                if (this.state.currentTabId === tab.id) tab.content = this.textarea.value;
                tab.type = 'extension';
                extToggle.className = 'ext-toggle active';
                this.state.currentTabId = null;
                this.switchToTab(tab.id);
            }
        };
    }

    #createExtToggle(tab, ext) {
        const extToggle = document.createElement('span');
        if (ext) {
            extToggle.className = 'ext-toggle active';
            extToggle.title = 'Toggle extension: ' + ext.name;
            extToggle.textContent = ext.name;
            let longPressTimer = null;
            let longPressTriggered = false;
            extToggle.addEventListener('pointerdown', () => {
                longPressTriggered = false;
                longPressTimer = setTimeout(async () => {
                    longPressTriggered = true;
                    if (!await this.ui.showDialog({isConfirm: true, confirmMessage: `Uninstall extension "${ext.name}"?`, danger: true})) return;
                    await this.extensions.uninstall(ext.name);
                    const currentTabId = this.state.currentTabId;
                    let currentTabWasExtension = false;
                    for (const t of this.state.tabs) {
                        if (t.extension && t.extension.name === ext.name) {
                            if (t.type === 'extension' && t.id === currentTabId) currentTabWasExtension = true;
                            t.extension = null;
                            if (t.type === 'extension') t.type = 'text';
                            if (t.element) {
                                const toggle = t.element.querySelector('.ext-toggle');
                                if (toggle) toggle.replaceWith(this.#createExtToggle(t, null));
                            }
                        }
                    }
                    if (currentTabWasExtension) {
                        this.state.currentTabId = null;
                        this.switchToTab(currentTabId);
                    } else {
                        this.fs.saveOpenTabs(this.state.currentTabId);
                    }
                }, 600);
            });
            extToggle.addEventListener('pointerup', () => clearTimeout(longPressTimer));
            extToggle.addEventListener('pointercancel', () => clearTimeout(longPressTimer));
            const toggleHandler = this.#makeExtToggleHandler(tab, extToggle);
            extToggle.onclick = e => { if (longPressTriggered) { longPressTriggered = false; return; } toggleHandler(e); };
        } else {
            extToggle.className = 'ext-toggle inactive';
            extToggle.title = 'No extension installed – click to install';
            extToggle.textContent = 'ext';
            extToggle.onclick = async e => {
                e.stopPropagation();
                await this.extensions.install();
                const newExt = this.extensions.getForFile(tab.name);
                if (newExt) {
                    tab.extension = newExt;
                    if (this.state.currentTabId === tab.id) tab.content = this.textarea.value;
                    tab.type = 'extension';
                    extToggle.textContent = newExt.name;
                    extToggle.title = 'Toggle extension: ' + newExt.name;
                    extToggle.className = 'ext-toggle active';
                    extToggle.onclick = this.#makeExtToggleHandler(tab, extToggle);
                    this.state.currentTabId = null;
                    this.switchToTab(tab.id);
                }
            };
        }
        return extToggle;
    }

    /** Updates tab paths after a file/folder rename or move. */
    updateTabPaths(oldPath, newPath, updatedHandle, newName = null) {
        for (const tab of this.state.tabs) {
            if (tab.path === oldPath) {
                tab.path = newPath;
                tab.handle = updatedHandle;
                if (newName != null) {
                    tab.name = newName;
                    if (tab.element) tab.element.querySelector('.tab-name').textContent = newName;
                    if (tab.type === 'text' || tab.type === 'extension') {
                        const ext = this.extensions.getForFile(newName);
                        const newType = ext ? 'extension' : 'text';
                        if (newType !== tab.type) {
                            tab.type = newType;
                            tab.extension = ext || null;
                            if (tab.extFrame && newType === 'text') {
                                tab.extFrame.remove();
                                tab.extFrame = null;
                            }
                            if (tab.element) {
                                const existingToggle = tab.element.querySelector('.ext-toggle');
                                if (existingToggle) existingToggle.remove();
                                const extToggle = this.#createExtToggle(tab, ext || null);
                                tab.element.insertBefore(extToggle, tab.element.querySelector('.tab-name'));
                            }
                        }
                    }
                }
            } else if (tab.path && tab.path.startsWith(oldPath + '/')) {
                tab.path = newPath + tab.path.substring(oldPath.length);
            }
        }
        if (this.state.activeFilePath === oldPath) this.state.activeFilePath = newPath;
        else if (this.state.activeFilePath && this.state.activeFilePath.startsWith(oldPath + '/')) {
            this.state.activeFilePath = newPath + this.state.activeFilePath.substring(oldPath.length);
        }
    }

    handleTabDrop(e, targetTabId) {
        e.preventDefault();
        e.stopPropagation();
        const targetEl = e.currentTarget;
        targetEl.classList.remove('drag-over');
        const draggedId = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (draggedId === targetTabId || isNaN(draggedId)) return;
        const fromIdx = this.state.tabs.findIndex(t => t.id === draggedId);
        const toIdx = this.state.tabs.findIndex(t => t.id === targetTabId);
        if (fromIdx === -1 || toIdx === -1) return;
        const rect = targetEl.getBoundingClientRect();
        const insertBefore = e.clientX < rect.left + rect.width / 2;
        const adjustedToIdx = fromIdx < toIdx ? toIdx - 1 : toIdx;
        TabManager.#moveArrayItem(this.state.tabs, fromIdx, insertBefore ? adjustedToIdx : adjustedToIdx + 1);
        this.state.tabs.forEach(tab => this.tabsContainer.appendChild(tab.element));
        this.fs.saveOpenTabs(this.state.currentTabId);
    }

    async createNewTab(handle, name, content = '', path = null, type = 'text') {
        if (handle) {
            for (const t of this.state.tabs) {
                if (t.handle && await this.fs.isSameEntry(t.handle, handle)) {
                    this.switchToTab(t.id);
                    return;
                }
            }
        }
        const tab = this.#createTab(handle, name, content, path, type);
        this.state.tabs.push(tab);
        const tabEl = document.createElement('div');
        tabEl.className = 'tab';
        tabEl.dataset.id = tab.id;
        tabEl.draggable = true;
        const tabName = document.createElement('span');
        tabName.className = 'tab-name';
        tabName.textContent = name;
        const dirtyInd = document.createElement('span');
        dirtyInd.className = 'dirty-indicator';
        dirtyInd.style.display = 'none';
        dirtyInd.textContent = ' *';
        const closeBtn = document.createElement('span');
        closeBtn.className = 'close';
        closeBtn.textContent = '×';
        if (tab.type === 'extension') {
            const extToggle = this.#createExtToggle(tab, tab.extension);
            tabEl.append(extToggle, tabName, dirtyInd, closeBtn);
        } else if (tab.type === 'text') {
            const extToggle = this.#createExtToggle(tab, null);
            tabEl.append(extToggle, tabName, dirtyInd, closeBtn);
        } else {
            tabEl.append(tabName, dirtyInd, closeBtn);
        }
        tabEl.onclick = () => this.switchToTab(tab.id);
        closeBtn.onclick = e => { e.stopPropagation(); this.closeTab(tab.id); };
        tabEl.addEventListener('dragstart', e => {
            e.dataTransfer.setData('text/plain', String(tab.id));
            e.dataTransfer.effectAllowed = 'move';
        });
        tabEl.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            tabEl.classList.add('drag-over');
        });
        tabEl.addEventListener('dragleave', () => tabEl.classList.remove('drag-over'));
        tabEl.addEventListener('mouseenter', () => {
            if (!tab.path) {
                tabEl.title = tab.name;
                return;
            }
            const prefix = this.state.activeDirectoryPath ? this.state.activeDirectoryPath + '/' : null;
            if (prefix && tab.path.startsWith(prefix)) {
                tabEl.title = tab.path.slice(prefix.length);
            } else {
                tabEl.title = tab.path;
            }
        });
        tabEl.addEventListener('drop', e => this.handleTabDrop(e, tab.id));
        this.tabsContainer.appendChild(tabEl);
        tab.element = tabEl;
        this.switchToTab(tab.id);
        return tab;
    }

    switchToTab(id) {
        if (this.state.currentTabId !== null) {
            const cur = this.state.tabs.find(t => t.id === this.state.currentTabId);
            if (cur) {
                if (cur.type !== 'extension') {
                    cur.content = this.textarea.value;
                    cur.scrollTop = this.textarea.scrollTop;
                }
                if (cur.dirty) this.fs.saveTab(cur);
            }
        }
        // Hide all per-tab extension iframes
        this.state.tabs.forEach(t => { if (t.extFrame) t.extFrame.classList.add('hidden'); });
        this.state.currentTabId = id;
        const tab = this.state.tabs.find(t => t.id === id);
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.element.classList.add('active');
        const gutterUserHidden = localStorage.getItem('gutterVisible') === 'false';
        if (tab.type === 'extension') {
            this.textarea.style.display = 'none';
            if (!gutterUserHidden) this.gutter.style.display = 'none';
            this.extensions.renderTab(tab);
        } else {
            this.textarea.style.display = '';
            if (!gutterUserHidden) this.gutter.style.display = '';
            this.textarea.value = tab.content || '';
            this.textarea.readOnly = !TabManager.#TAB_TYPES[tab.type]?.canDirty;
        }
        this.ui.updateLineNumbers(true);
        if (tab.scrollTop !== undefined) {
            this.textarea.scrollTop = tab.scrollTop;
            this.gutter.scrollTop = tab.scrollTop;
        }
        this.ui.updateEditorStatus(tab);
        if (tab.path) {
            this.state.activeFilePath = tab.path;
        }
        this.fs.saveOpenTabs(id);
    }

    async closeTab(id) {
        const idx = this.state.tabs.findIndex(t => t.id === id);
        if (idx === -1) return;
        const tab = this.state.tabs[idx];
        if (tab.dirty && !await this.ui.showDialog({isConfirm: true, confirmMessage: `"${tab.name}" has unsaved changes. Close anyway?`})) return;
        if (tab.extFrame) {
            tab.extFrame.remove();
            tab.extFrame = null;
        }
        this.state.tabs.splice(idx, 1);
        tab.element.remove();
        if (this.state.tabs.length === 0) {
            this.state.currentTabId = null;
            this.textarea.value = '';
            this.gutter.replaceChildren();
            this.ui.editorStatusEl.textContent = 'No file open';
            this.fs.saveOpenTabs(null);
            localStorage.removeItem('openTabs');
            return;
        }
        this.switchToTab(this.state.tabs[Math.min(idx, this.state.tabs.length - 1)].id);
    }

    async restoreOpenTabs(dirHandle, savedTabs) {
        if (!savedTabs) savedTabs = this.fs.loadOpenTabs();
        let restored = 0;
        let activeTabPath = null;

        for (const st of savedTabs) {
            try {
                const parts = st.path.split('/').filter(Boolean);
                let handle = dirHandle;
                for (let i = 0; i < parts.length - 1; i++) {
                    handle = await handle.getDirectoryHandle(parts[i]);
                }
                const fileHandle = await handle.getFileHandle(parts[parts.length - 1]);
                const file = await fileHandle.getFile();
                const content = await file.text();

                await this.createNewTab(fileHandle, st.name, content, st.path, st.type || 'text');
                if (st.active) activeTabPath = st.path;
                restored++;
            } catch { }
        }

        if (activeTabPath) {
            const activeTab = this.state.tabs.find(t => t.path === activeTabPath);
            if (activeTab) this.switchToTab(activeTab.id);
        } else if (this.state.tabs.length > 0) {
            this.switchToTab(this.state.tabs[0].id);
        }

        return restored;
    }
}

// ────────────────────────────────────────────────────────
// UIManager – DOM init, events & rendering
// ────────────────────────────────────────────────────────
class UIManager {
    #textarea = null;
    #gutter = null;
    #tabsContainer = null;
    #treeContainer = null;
    #activeDirNameEl = null;
    #rootDirNameEl = null;
    #sidebarHeaderActionsEl = null;
    #sidebarEl = null;
    #statusEl = null;
    #editorStatusEl = null;
    #contextMenu = null;
    #contextMenuTarget = null;
    #isMobile = false;
    #lastLineCount = 1;

    /** @param {ReactiveState} state @param {TabManager} tabs @param {TreeManager} tree @param {FileSystemManager} fs @param {ExtensionManager} extensions */
    constructor(state, tabs, tree, fs, extensions) {
        this.state = state;
        this.tabs = tabs;
        this.tree = tree;
        this.fs = fs;
        this.extensions = extensions;
        this.#isMobile = window.innerWidth <= 768;
    }

    get contextMenuTarget() { return this.#contextMenuTarget; }
    get isMobile() { return this.#isMobile; }
    get sidebarEl() { return this.#sidebarEl; }
    get textarea() { return this.#textarea; }
    get editorStatusEl() { return this.#editorStatusEl; }

    async init() {
        this.#textarea = document.getElementById('textarea');
        this.#gutter = document.getElementById('gutter');
        this.#tabsContainer = document.getElementById('tabs');
        this.#treeContainer = document.getElementById('tree-container');
        this.#sidebarEl = document.getElementById('sidebar');
        if (this.#isMobile) this.#sidebarEl.classList.add('hidden');
        this.#statusEl = document.getElementById('status');
        this.#editorStatusEl = document.getElementById('editor-status');
        this.#activeDirNameEl = document.getElementById('active-dir-name');
        this.#rootDirNameEl = document.getElementById('root-dir-name');
        this.#sidebarHeaderActionsEl = document.getElementById('sidebar-header-actions');

        // Wire DOM refs to dependent classes
        this.tabs.textarea = this.#textarea;
        this.tabs.gutter = this.#gutter;
        this.tabs.tabsContainer = this.#tabsContainer;
        this.tree.treeContainer = this.#treeContainer;
        this.tree.activeDirNameEl = this.#activeDirNameEl;
        this.tree.rootDirNameEl = this.#rootDirNameEl;
        this.tree.sidebarHeaderActionsEl = this.#sidebarHeaderActionsEl;

        const savedSidebarWidth = localStorage.getItem('sidebarWidth');
        if (savedSidebarWidth && !this.#sidebarEl.classList.contains('hidden')) this.#sidebarEl.style.width = savedSidebarWidth;

        this.bindEvents();

        // Restore settings
        const savedFontSize = parseInt(localStorage.getItem('editorFontSize'));
        if (savedFontSize) {
            this.#textarea.style.fontSize = savedFontSize + 'px';
            this.#gutter.style.fontSize = savedFontSize + 'px';
        }
        if (localStorage.getItem('sliderVisible') === 'false') {
            document.getElementById('line-width-slider').classList.add('hidden');
            document.getElementById('settings-toggle-slider').classList.remove('active');
        }
        if (localStorage.getItem('gutterVisible') === 'false') {
            this.#gutter.classList.add('hidden');
            document.getElementById('settings-toggle-gutter').classList.remove('active');
        }
        await this.fs.initDB();
        await this.extensions.loadAll();
        await this.fs.restoreSession();
    }

    showToast(message, duration = 2800) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = message;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), duration);
    }

    showActionToast(message, callback, duration = 8000) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = message;
        t.style.cssText += 'cursor:pointer;text-decoration:underline;';
        const timer = setTimeout(() => t.remove(), duration);
        t.addEventListener('click', () => { clearTimeout(timer); t.remove(); callback(); });
        document.body.appendChild(t);
    }

    showDialog({promptTitle, defaultValue = '', isConfirm = false, confirmMessage = '', danger = false} = {}) {
        return new Promise(resolve => {
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:10001;';
            const okBg = danger ? '#ef4444' : '#a1a1aa', okFg = danger ? '#fff' : '#09090b';
            modal.innerHTML = `<div style="background:#18181b;padding:24px;border-radius:8px;min-width:320px;border:1px solid #27272a;">` +
                `<div style="margin-bottom:12px;font-size:14px;"></div>` +
                (!isConfirm ? `<input type="text" style="width:100%;padding:10px;background:#27272a;border:1px solid #3f3f46;color:#e4e4e7;border-radius:4px;font-size:16px;">` : '') +
                `<div style="display:flex;gap:8px;margin-top:16px;">` +
                `<button style="flex:1;min-height:44px;background:${okBg};color:${okFg};border:none;border-radius:4px;">${isConfirm ? 'Confirm' : 'OK'}</button>` +
                `<button style="flex:1;min-height:44px;background:#27272a;color:#e4e4e7;border:none;border-radius:4px;">Cancel</button></div></div>`;
            // textContent assignment keeps user-supplied strings free of HTML injection
            modal.firstElementChild.firstElementChild.textContent = isConfirm ? confirmMessage : promptTitle;
            const input = modal.querySelector('input');
            const [okBtn, cancelBtn] = modal.querySelectorAll('button');
            if (input) input.value = defaultValue;
            document.body.appendChild(modal);
            const confirm = () => { resolve(isConfirm ? true : input.value); modal.remove(); };
            const cancel = () => { resolve(isConfirm ? false : null); modal.remove(); };
            if (input) {
                input.focus(); input.select();
                input.onkeydown = e => { if (e.key === 'Enter') confirm(); if (e.key === 'Escape') cancel(); };
            } else {
                okBtn.focus();
                okBtn.onkeydown = e => { if (e.key === 'Escape') cancel(); };
            }
            okBtn.onclick = confirm;
            cancelBtn.onclick = cancel;
            modal.onclick = e => { if (e.target === modal) cancel(); };
        });
    }

    toggleSidebar() {
        const isCurrentlyHidden = this.#sidebarEl.classList.contains('hidden');
        if (isCurrentlyHidden) {
            const savedWidth = localStorage.getItem('sidebarWidth');
            if (savedWidth) this.#sidebarEl.style.width = savedWidth;
            this.#sidebarEl.classList.remove('hidden');
        } else {
            this.#sidebarEl.style.width = '';
            this.#sidebarEl.classList.add('hidden');
        }
        const btn = document.getElementById('sidebar-toggle');
        btn.textContent = this.#sidebarEl.classList.contains('hidden') ? '›' : '‹';
    }

    showContextMenu(e, node) {
        e.preventDefault();
        this.closeContextMenu();
        this.#contextMenuTarget = node;
        this.#contextMenu = document.createElement('div');
        this.#contextMenu.className = 'context-menu';
        const addItem = (label, handler, cls = '') => {
            const item = document.createElement('div');
            item.className = 'context-menu-item' + (cls ? ' ' + cls : '');
            item.textContent = label;
            item.addEventListener('click', () => { handler(); this.closeContextMenu(); });
            this.#contextMenu.appendChild(item);
        };
        const addSeparator = () => {
            const sep = document.createElement('div');
            sep.className = 'context-menu-separator';
            this.#contextMenu.appendChild(sep);
        };
        if (!node) {
            addItem('New File', () => this.fs.newFile());
            addItem('New Folder', () => this.fs.newFolder());
            addSeparator();
            addItem('Open File', () => this.fs.openFile());
            addItem('Open Folder', () => this.fs.openFolder());
            addSeparator();
            addItem('Open legend.txt', () => {
                const existing = this.state.tabs.find(t => t.type === 'legend');
                if (existing) {
                    this.tabs.switchToTab(existing.id);
                } else {
                    this.tabs.createNewTab(null, 'legend.txt', window.LEGEND, null, 'legend');
                }
            });
            if (this.state.copiedNode) { addSeparator(); addItem('Paste', () => this.fs.copyEntry(this.state.copiedNode, this.state.activeDirectoryPath || '')); }
        } else if (node.kind === 'directory') {
            addItem('New File', () => this.fs.newFile());
            addItem('New Folder', () => this.fs.newFolder());
            addSeparator();
            addItem('Rename', () => this.fs.renameItem());
            addItem('Copy', () => { this.state.copiedNode = node; this.showToast(`"${node.name}" ready to paste`); });
            if (this.state.copiedNode) addItem('Paste', () => this.fs.copyEntry(this.state.copiedNode, node.path));
            addSeparator();
            addItem('Delete Folder', () => this.fs.deleteFolder(), 'danger');
        } else {
            addItem('Open', () => this.fs.openFileFromNode(this.#contextMenuTarget));
            addItem('Rename', () => this.fs.renameItem());
            addItem('Copy', () => { this.state.copiedNode = this.#contextMenuTarget; this.showToast(`"${this.#contextMenuTarget.name}" ready to paste`); });
            addSeparator();
            addItem('Delete File', () => this.fs.deleteFile(), 'danger');
        }
        this.#contextMenu.style.left = e.clientX + 'px';
        this.#contextMenu.style.top = e.clientY + 'px';
        document.body.appendChild(this.#contextMenu);
        const rect = this.#contextMenu.getBoundingClientRect();
        if (rect.right > window.innerWidth) this.#contextMenu.style.left = (window.innerWidth - rect.width - 8) + 'px';
        if (rect.bottom > window.innerHeight) this.#contextMenu.style.top = (window.innerHeight - rect.height - 8) + 'px';
    }

    closeContextMenu() {
        if (this.#contextMenu) {
            this.#contextMenu.remove();
            this.#contextMenu = null;
            this.#contextMenuTarget = null;
        }
    }

    /** @param {boolean} [force] - when true, always rerender even if line count unchanged */
    updateLineNumbers(force = false) {
        const lineCount = (this.#textarea.value.match(/\n/g) || []).length + 1;
        if (!force && lineCount === this.#lastLineCount) return;
        this.#lastLineCount = lineCount;
        this.#gutter.textContent = Array.from({length: lineCount}, (_, i) => i + 1).join('\n');
    }

    updateEditorStatus(tab) {
        const modified = tab.dirty ? ' • Modified' : '';
        if (tab.type === 'extension') {
            this.#statusEl.textContent = `${this.state.tabs.length} tab${this.state.tabs.length !== 1 ? 's' : ''}`;
        } else {
            const pos = this.#textarea.selectionStart || 0;
            const before = this.#textarea.value.substring(0, pos);
            const lines = before.split('\n');
            const line = lines.length;
            const col = lines[lines.length - 1].length + 1;
            this.#statusEl.textContent = `Ln ${line}, Col ${col} | ${this.state.tabs.length} tab${this.state.tabs.length !== 1 ? 's' : ''}`;
        }
        this.#editorStatusEl.textContent = tab.name + modified;
    }

    bindKeyboard() {
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                e.preventDefault();
                if (this.state.currentTabId) this.tabs.closeTab(this.state.currentTabId);
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                this.fs.saveCurrentFile();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                this.fs.newFile();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
                e.preventDefault();
                this.fs.openFolder();
            }
        });
    }

    bindTreeEvents() {
        document.getElementById('sidebar-toggle').addEventListener('click', () => this.toggleSidebar());
        document.getElementById('sidebar-root-row').addEventListener('click', e => {
            if (e.target.id === 'refresh-folder' || e.target.id === 'clear-folder') return;
            this.fs.openFolder();
        });
        document.getElementById('topbar-active-row').addEventListener('click', () => {
            this.state.activeDirectoryPath = null;
            this.tree.updateHeader();
        });
        // Sidebar resize
        const sidebarResizeHandle = document.getElementById('sidebar-resize');
        let sidebarResizing = false, sidebarResizeStartX = 0, sidebarResizeStartW = 0;
        sidebarResizeHandle.addEventListener('mousedown', e => {
            sidebarResizing = true;
            sidebarResizeStartX = e.clientX;
            sidebarResizeStartW = this.#sidebarEl.offsetWidth;
            this.#sidebarEl.style.transition = 'none';
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });
        document.addEventListener('mousemove', e => {
            if (!sidebarResizing) return;
            const w = Math.max(150, Math.min(600, sidebarResizeStartW + e.clientX - sidebarResizeStartX));
            this.#sidebarEl.style.width = w + 'px';
        });
        document.addEventListener('mouseup', () => {
            if (!sidebarResizing) return;
            sidebarResizing = false;
            this.#sidebarEl.style.transition = '';
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            localStorage.setItem('sidebarWidth', this.#sidebarEl.offsetWidth + 'px');
        });
        this.#treeContainer.addEventListener('dragover', e => {
            if (!e.dataTransfer.types.includes('application/x-tree-path')) return;
            if (e.target.closest('.folder-header')) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.#treeContainer.classList.add('drop-target');
        });
        this.#treeContainer.addEventListener('dragleave', () => this.#treeContainer.classList.remove('drop-target'));
        this.#treeContainer.addEventListener('drop', e => {
            this.#treeContainer.classList.remove('drop-target');
            if (e.target.closest('.folder-header')) return;
            e.preventDefault();
            const srcPath = e.dataTransfer.getData('application/x-tree-path');
            if (srcPath) this.fs.moveEntry(srcPath, '');
        });
        document.addEventListener('click', e => {
            if (e.target.id === 'clear-folder') { e.stopPropagation(); this.fs.clearSavedFolder(); return; }
            if (e.target.id === 'refresh-folder') {
                e.stopPropagation();
                if (this.state.currentDirHandle) this.fs.mutateAndRebuild();
                return;
            }
            if (!e.target.closest('.context-menu')) this.closeContextMenu();
        });
        this.#treeContainer.addEventListener('contextmenu', e => {
            const folder = e.target.closest('.folder-header');
            const file = e.target.closest('.file-item');
            if (folder) {
                const node = this.tree.getNode(folder.dataset.path);
                if (node) this.showContextMenu(e, node);
            } else if (file) {
                const node = this.tree.getNode(file.dataset.path);
                if (node) this.showContextMenu(e, node);
            } else {
                this.showContextMenu(e, null);
            }
        });
        let longPressTimer = null;
        let touchMoved = false;
        this.#treeContainer.addEventListener('touchstart', e => {
            this.tree.longPressTriggered = false;
            touchMoved = false;
            const touch = e.touches[0];
            const target = e.target;
            longPressTimer = setTimeout(() => {
                this.tree.longPressTriggered = true;
                const folder = target.closest('.folder-header');
                const file = target.closest('.file-item');
                const fakeEvent = { preventDefault() {}, clientX: touch.clientX, clientY: touch.clientY };
                if (folder) {
                    const node = this.tree.getNode(folder.dataset.path);
                    if (node) this.showContextMenu(fakeEvent, node);
                } else if (file) {
                    const node = this.tree.getNode(file.dataset.path);
                    if (node) this.showContextMenu(fakeEvent, node);
                } else {
                    this.showContextMenu(fakeEvent, null);
                }
            }, 600);
        }, { passive: true });
        this.#treeContainer.addEventListener('touchend', e => {
            clearTimeout(longPressTimer);
            if (this.tree.longPressTriggered) {
                e.preventDefault();
                return;
            }
            if (!touchMoved) {
                const target = e.target;
                const el = target.closest('.folder-header') || target.closest('.file-item');
                if (el) {
                    e.preventDefault();
                    el.click();
                }
            }
        });
        this.#treeContainer.addEventListener('touchmove', () => { clearTimeout(longPressTimer); touchMoved = true; }, { passive: true });
    }

    bindTabEvents() {
        // Allow dropping a tab past the last tab (append to end)
        this.#tabsContainer.addEventListener('dragover', e => {
            if (!e.dataTransfer.types.includes('text/plain')) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });
        this.#tabsContainer.addEventListener('drop', e => {
            e.preventDefault();
            const draggedId = parseInt(e.dataTransfer.getData('text/plain'), 10);
            if (isNaN(draggedId)) return;
            const fromIdx = this.state.tabs.findIndex(t => t.id === draggedId);
            if (fromIdx === -1) return;
            const movedTab = this.state.tabs[fromIdx];
            this.state.tabs.splice(fromIdx, 1);
            this.state.tabs.push(movedTab);
            this.#tabsContainer.appendChild(movedTab.element);
            this.fs.saveOpenTabs(this.state.currentTabId);
        });
        this.#textarea.addEventListener('input', () => {
            this.updateLineNumbers();
            if (this.state.currentTabId) {
                const tab = this.state.tabs.find(t => t.id === this.state.currentTabId);
                if (tab) {
                    if (TabManager.canTabBeDirty(tab.type)) {
                        tab.dirty = true;
                        if (tab.element) tab.element.querySelector('.dirty-indicator').style.display = '';
                        this.fs.scheduleSave();
                    }
                    this.updateEditorStatus(tab);
                }
            }
        });
        this.#textarea.addEventListener('scroll', () => this.#gutter.scrollTop = this.#textarea.scrollTop);
        this.#textarea.addEventListener('keydown', e => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.#textarea.selectionStart;
                const end = this.#textarea.selectionEnd;
                this.#textarea.value = this.#textarea.value.substring(0, start) + '\t' + this.#textarea.value.substring(end);
                this.#textarea.selectionStart = this.#textarea.selectionEnd = start + 1;
                this.#textarea.dispatchEvent(new Event('input'));
            }
        });
        const slider = document.getElementById('width-slider');
        const valueEl = document.getElementById('width-value');
        const MAX_CHARS = 200;
        slider.addEventListener('input', e => {
            const v = +e.target.value;
            valueEl.textContent = (v === MAX_CHARS) ? '∞' : `${v} char/line`;
            if (v === MAX_CHARS) {
                this.#textarea.style.maxWidth = 'none';
                this.#textarea.style.whiteSpace = 'pre';
                this.#textarea.style.wordWrap = 'normal';
            } else {
                this.#textarea.style.maxWidth = v + 'ch';
                this.#textarea.style.whiteSpace = 'pre-wrap';
                this.#textarea.style.wordWrap = 'break-word';
            }
        });
        slider.dispatchEvent(new Event('input'));
    }

    bindSettings() {
        // Settings popover toggle
        const settingsBtn = document.getElementById('tab-settings-btn');
        const popover = document.getElementById('tab-settings-popover');
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            popover.classList.toggle('hidden');
            if (!popover.classList.contains('hidden')) {
                const rect = settingsBtn.getBoundingClientRect();
                popover.style.top = rect.bottom + 'px';
                popover.style.left = rect.left + 'px';
            }
        });
        // Reposition popover on window resize
        window.addEventListener('resize', () => {
            if (!popover.classList.contains('hidden')) {
                const rect = settingsBtn.getBoundingClientRect();
                popover.style.top = rect.bottom + 'px';
                popover.style.left = rect.left + 'px';
            }
        });
        // Close popover when clicking outside
        document.addEventListener('click', (e) => {
            if (!popover.contains(e.target) && !settingsBtn.contains(e.target)) {
                popover.classList.add('hidden');
            }
        });
        // Toggle width slider
        document.getElementById('settings-toggle-slider').addEventListener('click', e => {
            const sliderEl = document.getElementById('line-width-slider');
            const nowHidden = sliderEl.classList.toggle('hidden');
            e.currentTarget.classList.toggle('active', !nowHidden);
            localStorage.setItem('sliderVisible', !nowHidden);
        });
        // Toggle gutter
        document.getElementById('settings-toggle-gutter').addEventListener('click', () => {
            const nowHidden = this.#gutter.classList.toggle('hidden');
            document.getElementById('settings-toggle-gutter').classList.toggle('active', !nowHidden);
            localStorage.setItem('gutterVisible', !nowHidden);
        });
        // Font size
        const MIN_FONT = 10, MAX_FONT = 24, DEFAULT_FONT_SIZE = 14;
        const applyFontSize = sz => {
            this.#textarea.style.fontSize = sz + 'px';
            this.#gutter.style.fontSize = sz + 'px';
        };
        document.getElementById('settings-font-decrease').addEventListener('click', () => {
