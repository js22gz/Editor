            const cur = parseInt(this.#textarea.style.fontSize) || DEFAULT_FONT_SIZE;
            if (cur > MIN_FONT) {
                const next = cur - 1;
                applyFontSize(next);
                localStorage.setItem('editorFontSize', next);
            }
        });
        document.getElementById('settings-font-increase').addEventListener('click', () => {
            const cur = parseInt(this.#textarea.style.fontSize) || DEFAULT_FONT_SIZE;
            if (cur < MAX_FONT) {
                const next = cur + 1;
                applyFontSize(next);
                localStorage.setItem('editorFontSize', next);
            }
        });
        document.getElementById('settings-font-reset').addEventListener('click', () => {
            applyFontSize(DEFAULT_FONT_SIZE);
            localStorage.setItem('editorFontSize', DEFAULT_FONT_SIZE);
        });
    }

    async #revalidatePermission() {
        if (!this.state.currentDirHandle) {
            await this.fs.restoreSession();
            return;
        }
        const perm = await this.fs.queryPermission(this.state.currentDirHandle);
        if (perm !== 'granted') {
            this.showActionToast('Tap to restore folder access', async () => {
                try { await this.state.currentDirHandle.requestPermission({ mode: 'readwrite' }); } catch { }
            });
        }
    }

    bindLifecycle() {
        // Restore session when page returns from bfcache (back/forward nav or wake from sleep)
        window.addEventListener('pageshow', async (e) => {
            if (e.persisted) await this.#revalidatePermission();
        });
        // Save + re-validate when page visibility changes (lock-screen / tab switch)
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState !== 'visible') {
                if (this.state.currentDirHandle) this.fs.saveOpenTabs(this.state.currentTabId);
                return;
            }
            await this.#revalidatePermission();
        });
        window.addEventListener('resize', () => {
            const wasMobile = this.#isMobile;
            this.#isMobile = window.innerWidth <= 768;
            if (this.#isMobile && !wasMobile) this.#sidebarEl.classList.add('hidden');
        });
        window.addEventListener('message', e => {
            if (!e.data || typeof e.data !== 'object') return;
            const tab = this.state.tabs.find(t => t.type === 'extension' && t.extFrame && t.extFrame.contentWindow === e.source);
            if (!tab) return;
            if (e.data.type === 'extension:save') {
                tab.content = e.data.content;
                tab.dirty = true;
                if (tab.element) tab.element.querySelector('.dirty-indicator').style.display = '';
                if (tab.id === this.state.currentTabId) {
                    this.fs.scheduleSave();
                } else {
                    this.fs.saveTab(tab);
                }
            } else if (e.data.type === 'extension:dirty') {
                tab.dirty = true;
                if (tab.element) tab.element.querySelector('.dirty-indicator').style.display = '';
            }
        });
        window.addEventListener('beforeunload', e => {
            if (this.state.currentDirHandle) this.fs.saveOpenTabs(this.state.currentTabId);
            if (this.state.tabs.some(t => t.dirty)) {
                this.fs.flushSave();
                e.preventDefault();
                return e.returnValue = 'Unsaved changes will be lost';
            }
        });
    }

    bindEvents() {
        this.bindKeyboard();
        this.bindTreeEvents();
        this.bindTabEvents();
        this.bindSettings();
        this.bindLifecycle();
    }
}

// ────────────────────────────────────────────────────────
// EditorApp – orchestrator
// ────────────────────────────────────────────────────────
class EditorApp {
    constructor() {
        this.state      = new ReactiveState();
        this.pathUtils  = new PathUtils();
        this.fs         = new FileSystemManager(this.state, this.pathUtils);
        this.tree       = new TreeManager(this.state, this.fs);
        this.extensions = new ExtensionManager(this.state, this.fs);
        this.tabs       = new TabManager(this.state, this.fs, this.extensions);
        this.ui         = new UIManager(this.state, this.tabs, this.tree, this.fs, this.extensions);
        // Resolve cross-references
        this.fs.tree = this.tree;
        this.fs.tabs = this.tabs;
        this.fs.ui = this.ui;
        this.extensions.ui = this.ui;
        this.tabs.ui = this.ui;
    }

    async init() { await this.ui.init(); }
}

// Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
// Launch
window.onload = async () => { window.editorApp = new EditorApp(); await window.editorApp.init(); };

</script>
