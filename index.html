'use strict';
// ──────────────────────────────────────────────
// MarkdownMini – tiny Markdown → HTML (zero dep)
// ──────────────────────────────────────────────
const MarkdownMini = (() => {
    function escapeHtml(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function parseInline(text) {
        if (!text) return '';
        return text
            .replace(/`([^`]+)`/g, (_, code) => `<code>${escapeHtml(code)}</code>`)
            .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) =>
                `<img src="${escapeHtml(url)}" alt="${escapeHtml(alt)}">`)
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, txt, url) =>
                `<a href="${escapeHtml(url)}">${parseInline(txt)}</a>`)
            .replace(/(?<!["'=>])(https?:\/\/[^\s<>"']+)(?!["'])/g, url =>
                `<a href="${escapeHtml(url)}">${escapeHtml(url)}</a>`)
            .replace(/~~(.+?)~~/g, (_, s) => `<del>${escapeHtml(s)}</del>`)
            .replace(/\*\*([^*]+?)\*\*/g, (_, s) => `<strong>${escapeHtml(s)}</strong>`)
            .replace(/__([^_]+?)__/g, (_, s) => `<strong>${escapeHtml(s)}</strong>`)
            .replace(/\*([^*]+?)\*/g, (_, s) => `<em>${escapeHtml(s)}</em>`)
            .replace(/_([^_]+?)_/g, (_, s) => `<em>${escapeHtml(s)}</em>`);
    }

    function parseBlockquote(lines, idx, html) {

                    updatedHandle = newHandle;
                } else {
                    // For directories, prefer handle.move if available, but fall back to
                    // copy-then-delete if it throws (e.g. cross-device or unsupported).
                    let atomicMoved = false;
                    if (srcNode.handle.move) {
                        try {
                            await srcNode.handle.move(destHandle, srcNode.name);
                            atomicMoved = true;
                        } catch (moveErr) {
                            console.warn('handle.move failed, falling back to copy+delete:', moveErr);
                        }
                    }
                    if (!atomicMoved) {
                        await this._copyDirectory(srcNode.handle, destHandle, srcNode.name);
                        await srcParent.removeEntry(srcNode.name, { recursive: true });
                    }
                    updatedHandle = await destHandle.getDirectoryHandle(srcNode.name);
                }

                const newPath = destFolderPath ? `${destFolderPath}/${srcNode.name}` : srcNode.name;
                this._updateTabPaths(srcPath, newPath, updatedHandle);
                if (destFolderPath) { expandedFolders.add(destFolderPath); this.saveExpandedState(); }
                await FSA.mutateAndRebuild();
                UI.showToast(`Moved "${srcNode.name}"`);
            } catch (e) {
                console.error('Move failed:', e);
                const msg = e.name === 'NotAllowedError' ? 'Move failed: permission denied – re-open the folder'
                    : e.name === 'QuotaExceededError' ? 'Move failed: not enough disk space'
                    : e.name === 'NotFoundError' ? `Move failed: file not found (${e.message})`
                    : `Move failed: ${e.message || e}`;
                UI.showToast(msg, 4000);
            }
            UI.closeContextMenu();
        },
        _updateTabPaths(oldPath, newPath, updatedHandle, newName = null) {
            for (const tab of tabs) {
                if (tab.path === oldPath) {
                    tab.path = newPath;
                    tab.handle = updatedHandle;
                    if (newName != null) {
                        tab.name = newName;
                        if (tab.element) tab.element.querySelector('.tab-name').textContent = newName;
                        if (tab.type === 'text' || tab.type === 'markdown') {
                            const newType = /\.(md|markdown)$/i.test(newName) ? 'markdown' : 'text';
                            if (newType !== tab.type) {
                                tab.type = newType;
                                tab.mdPreview = newType === 'markdown';
                                if (tab.element) {
                                    const existingToggle = tab.element.querySelector('.md-toggle');
                                    if (existingToggle) existingToggle.remove();
                                    if (newType === 'markdown') {
                                        const mdToggle = document.createElement('span');
                                        mdToggle.className = 'md-toggle active';
                                        mdToggle.title = 'Toggle Markdown preview';
                                        mdToggle.textContent = 'MD';
                                        mdToggle.onclick = e => {
                                            e.stopPropagation();
                                            tab.mdPreview = !tab.mdPreview;
                                            mdToggle.className = 'md-toggle' + (tab.mdPreview ? ' active' : ' inactive');
                                            if (currentTabId === tab.id) UI.updateMdPreview();
                                        };
                                        tab.element.insertBefore(mdToggle, tab.element.querySelector('.tab-name'));
                                    }
                                }
                                if (currentTabId === tab.id) UI.updateMdPreview();
                            }
                        }
                    }
                } else if (tab.path && tab.path.startsWith(oldPath + '/')) {
                    tab.path = newPath + tab.path.substring(oldPath.length);
                }
            }
            if (activeFilePath === oldPath) activeFilePath = newPath;
            else if (activeFilePath && activeFilePath.startsWith(oldPath + '/')) {
                activeFilePath = newPath + activeFilePath.substring(oldPath.length);
            }
        },
        async _copyDirectory(srcDirHandle, destParentHandle, name) {
            const newDirHandle = await destParentHandle.getDirectoryHandle(name, { create: true });
            try {
                for await (const [entryName, entryHandle] of srcDirHandle) {
                    if (entryHandle.kind === 'file') {
                        const file = await entryHandle.getFile();
                        const newHandle = await newDirHandle.getFileHandle(entryName, { create: true });
                        const writable = await newHandle.createWritable();
                        try {
                            await writable.write(file);
                            await writable.close();
                        } catch (writeErr) {
                            try { await writable.abort(); } catch (_) {}
                            throw new Error(`Failed to copy "${entryName}": ${writeErr.message}`);
                        }
                    } else {
                        await this._copyDirectory(entryHandle, newDirHandle, entryName);
                    }
                }
            } catch (e) {
                try { await destParentHandle.removeEntry(name, { recursive: true }); } catch (_) {}
                throw e;
            }
        },
        async copyEntry(srcNode, destFolderPath) {
            const destNode = TreeManager.getNode(destFolderPath || '/');
            if (!destNode) return UI.showToast('Destination folder not found');
            const destHandle = destNode.handle;
            try {
                await this.ensureRW(destHandle);
                let nameExists = false;
                try { await destHandle.getFileHandle(srcNode.name); nameExists = true; } catch (e) { if (e.name !== 'NotFoundError') throw e; }
                if (!nameExists) { try { await destHandle.getDirectoryHandle(srcNode.name); nameExists = true; } catch (e) { if (e.name !== 'NotFoundError') throw e; } }
                if (nameExists) { UI.showToast(`"${srcNode.name}" already exists in destination`); return; }
                if (srcNode.kind === 'file') {
                    const file = await srcNode.handle.getFile();
                    const newHandle = await destHandle.getFileHandle(srcNode.name, { create: true });
                    const writable = await newHandle.createWritable();
                    await writable.write(file);
                    await writable.close();
                } else {
                    await this._copyDirectory(srcNode.handle, destHandle, srcNode.name);
                }
                if (destFolderPath) { expandedFolders.add(destFolderPath); this.saveExpandedState(); }
                await FSA.mutateAndRebuild();
                UI.showToast(`Copied "${srcNode.name}"`);
            } catch (e) {
                console.error('Copy failed:', e);
                const msg = e.name === 'NotAllowedError' ? 'Copy failed: permission denied – re-open the folder'
                    : e.name === 'QuotaExceededError' ? 'Copy failed: not enough disk space'
                    : e.name === 'NotFoundError' ? `Copy failed: file not found (${e.message})`
                    : `Copy failed: ${e.message || e}`;
                UI.showToast(msg, 4000);
            }
            UI.closeContextMenu();
        },
    };
    // ──────────────────────────────────────────────
    // TREE MANAGER – owns data + DOM + updates
    // ──────────────────────────────────────────────
    const TreeManager = (() => {
        let fileTree = null;
        const nodeByPath = new Map();

        const _renderTreeItem = (node, parentEl, level = 0) => {
            if (node.kind === 'directory') {
                const folderDiv = document.createElement('div');
                const header = document.createElement('div');
                header.className = 'folder-header' + (level === 0 ? ' top-level' : '');
                header.dataset.path = node.path;
                header.style.paddingLeft = (level * 14) + 'px';
                header.tabIndex = 0;
                const toggle = document.createElement('span');
                toggle.className = 'toggle';
                toggle.textContent = expandedFolders.has(node.path) ? '▼' : '▶';
                header.append(toggle, document.createTextNode(' ' + node.name + '/'));
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children';
                childrenDiv.style.display = expandedFolders.has(node.path) ? 'block' : 'none';
                folderDiv.append(header, childrenDiv);
                parentEl.appendChild(folderDiv);

                header.onclick = async (e) => {
                    if (longPressTriggered) return;
                    const isExpanded = expandedFolders.has(node.path);
                    if (!isExpanded) {
                        await FSA.loadChildren(node);
                        childrenDiv.replaceChildren();
                        node.children.forEach(c => _renderTreeItem(c, childrenDiv, level + 1));
                    }
                    if (isExpanded) {
                        expandedFolders.delete(node.path);
                        childrenDiv.style.display = 'none';
                        toggle.textContent = '▶';
                    } else {
                        expandedFolders.add(node.path);
                        childrenDiv.style.display = 'block';
                        toggle.textContent = '▼';
                    }
                    FSA.saveExpandedState();
                    activeDirectoryPath = node.path;
                    TreeManager.highlightActive();
                    TreeManager.updateHeader();
                };
                header.onkeydown = e => { if (e.key === ' ') { e.preventDefault(); header.click(); } };

                header.draggable = true;
                header.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('application/x-tree-path', node.path);
                    e.dataTransfer.effectAllowed = 'move';
                    header.classList.add('dragging');
                });
                header.addEventListener('dragend', () => header.classList.remove('dragging'));
                header.addEventListener('dragover', e => {
                    if (!e.dataTransfer.types.includes('application/x-tree-path')) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    header.classList.add('drop-target');
                });
                header.addEventListener('dragleave', () => header.classList.remove('drop-target'));
                header.addEventListener('drop', e => {
                    e.preventDefault();
                    header.classList.remove('drop-target');
                    const srcPath = e.dataTransfer.getData('application/x-tree-path');
                    if (srcPath && srcPath !== node.path && !node.path.startsWith(srcPath + '/')) {
                        FSA.moveEntry(srcPath, node.path);
                    }
                });

                if (expandedFolders.has(node.path) && node.children.length) {
                    node.children.forEach(c => _renderTreeItem(c, childrenDiv, level + 1));
                }
            } else {
                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-item';
                fileDiv.dataset.path = node.path;
                fileDiv.style.paddingLeft = (level * 14 + 26) + 'px';
                fileDiv.textContent = node.name;
                fileDiv.tabIndex = 0;
                fileDiv.onclick = () => { if (!longPressTriggered) FSA.openFileFromNode(node); };
                fileDiv.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fileDiv.click(); } };

                fileDiv.draggable = true;
                fileDiv.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('application/x-tree-path', node.path);
                    e.dataTransfer.effectAllowed = 'move';
                    fileDiv.classList.add('dragging');
                });
                fileDiv.addEventListener('dragend', () => fileDiv.classList.remove('dragging'));

                parentEl.appendChild(fileDiv);
            }
        };

        return {
            get fileTree() { return fileTree; },
            set fileTree(v) { fileTree = v; },
            getNode(path) { return nodeByPath.get(path); },
            registerNode(path, node) { nodeByPath.set(path, node); },
            render() {
                treeContainer.replaceChildren();
                if (!fileTree) {
                    const msg = document.createElement('div');
                    msg.style.cssText = 'padding:20px;color:#52525b;text-align:center;font-size:12px';
                    msg.textContent = 'No folder open';
                    treeContainer.appendChild(msg);
                    return;
                }
                fileTree.children.forEach(child => _renderTreeItem(child, treeContainer, 0));
                this.highlightActive();
            },
            updateHeader() {
                if (!fileTree || !currentDirHandle) {
                    activeDirNameEl.textContent = '/';
                    rootDirNameEl.textContent = 'Click to open folder';
                    sidebarHeaderActionsEl.replaceChildren();
                    return;
                }
                const safeName = currentDirHandle.name;
                rootDirNameEl.textContent = safeName;
                activeDirNameEl.textContent = activeDirectoryPath ? safeName + '/' + activeDirectoryPath : safeName;
                const refreshSpan = document.createElement('span');
                refreshSpan.className = 'directory-clear';
                refreshSpan.id = 'refresh-folder';
                refreshSpan.title = 'Refresh tree';
                refreshSpan.textContent = '\u27F3';
                const clearSpan = document.createElement('span');
                clearSpan.className = 'directory-clear';
                clearSpan.id = 'clear-folder';
                clearSpan.textContent = '\u232B';
                sidebarHeaderActionsEl.replaceChildren(refreshSpan, clearSpan);
            },
            highlightActive() {
                treeContainer.querySelectorAll('.file-item.active,.folder-header.active,.folder-header.active-dir,.folder-header.active-ancestor').forEach(el => el.classList.remove('active','active-dir','active-ancestor'));
                if (activeFilePath) {
                    const el = treeContainer.querySelector(`.file-item[data-path="${activeFilePath.replace(/"/g, '\\"')}"]`);
                    if (el) el.classList.add('active');
                    const parts = activeFilePath.split('/');
                    for (let i = 1; i < parts.length; i++) {
                        const p = parts.slice(0, i).join('/');
                        const folderEl = treeContainer.querySelector(`.folder-header[data-path="${p.replace(/"/g, '\\"')}"]`);
                        if (folderEl) folderEl.classList.add('active');
                    }
                }
                if (activeDirectoryPath) {
                    const dirEl = treeContainer.querySelector(`.folder-header[data-path="${activeDirectoryPath.replace(/"/g, '\\"')}"]`);
                    if (dirEl) dirEl.classList.add('active-dir');
                    const parts = activeDirectoryPath.split('/');
                    for (let i = 1; i < parts.length; i++) {
                        const p = parts.slice(0, i).join('/');
                        const folderEl = treeContainer.querySelector(`.folder-header[data-path="${p.replace(/"/g, '\\"')}"]`);
                        if (folderEl) folderEl.classList.add('active-ancestor');
                    }
                }
            },
            clear() {
                fileTree = null;
                nodeByPath.clear();
                treeContainer.replaceChildren();
            }
        };
    })();
    // ──────────────────────────────────────────────
    // Tab type registry – add entries to extend
    // ──────────────────────────────────────────────
    const MD_PREVIEW_DEBOUNCE_DELAY = 3000; // ms of inactivity before showing Markdown preview
    const TAB_TYPES = {
        welcome:  { canSave: false, canDirty: false },
        legend:   { canSave: false, canDirty: false },
        text:     { canSave: true,  canDirty: true  },
        markdown: { canSave: true,  canDirty: true  }
    };
    // ──────────────────────────────────────────────
    // TabManager – tab creation, switching & closing
    // ──────────────────────────────────────────────
    const TabManager = {
        handleTabDrop(e, targetTabId) {
            e.preventDefault();
            e.stopPropagation();
            const targetEl = e.currentTarget;
            targetEl.classList.remove('drag-over');
            const draggedId = parseInt(e.dataTransfer.getData('text/plain'), 10);
            if (draggedId === targetTabId || isNaN(draggedId)) return;
            const fromIdx = tabs.findIndex(t => t.id === draggedId);
            const toIdx = tabs.findIndex(t => t.id === targetTabId);
            if (fromIdx === -1 || toIdx === -1) return;
            const rect = targetEl.getBoundingClientRect();
            const insertBefore = e.clientX < rect.left + rect.width / 2;
            const adjustedToIdx = fromIdx < toIdx ? toIdx - 1 : toIdx;
            Utils.moveArrayItem(tabs, fromIdx, insertBefore ? adjustedToIdx : adjustedToIdx + 1);
            tabs.forEach(tab => tabsContainer.appendChild(tab.element));
            FSA.saveOpenTabs(currentTabId);
        },
        async createNewTab(handle, name, content = '', path = null, type = 'text') {
            if (type === 'text' && /\.(md|markdown)$/i.test(name)) type = 'markdown';
            if (handle) {
                for (const t of tabs) {
                    if (t.handle && await FSA.isSameEntry(t.handle, handle)) {
                        this.switchToTab(t.id);
                        return;
                    }
                }
            }
            const id = nextTabId++;
            const tab = { id, name, handle, content, dirty: false, path, type, element: null, mdPreview: type === 'markdown' };
            tabs.push(tab);
            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.dataset.id = id;
            tabEl.draggable = true;
            const tabName = document.createElement('span');
            tabName.className = 'tab-name';
            tabName.textContent = name;
            const dirtyInd = document.createElement('span');
            dirtyInd.className = 'dirty-indicator';
            dirtyInd.style.display = 'none';
            dirtyInd.textContent = ' *';
            const closeBtn = document.createElement('span');
            closeBtn.className = 'close';
            closeBtn.textContent = '×';
            if (type === 'markdown') {
                const mdToggle = document.createElement('span');
                mdToggle.className = 'md-toggle active';
                mdToggle.title = 'Toggle Markdown preview';
                mdToggle.textContent = 'MD';
                mdToggle.onclick = e => {
                    e.stopPropagation();
                    tab.mdPreview = !tab.mdPreview;
                    mdToggle.className = 'md-toggle' + (tab.mdPreview ? ' active' : ' inactive');
                    if (currentTabId === tab.id) UI.updateMdPreview();
                };
                tabEl.append(mdToggle, tabName, dirtyInd, closeBtn);
            } else {
                tabEl.append(tabName, dirtyInd, closeBtn);
            }
            tabEl.onclick = () => this.switchToTab(id);
            closeBtn.onclick = e => { e.stopPropagation(); this.closeTab(id); };
            tabEl.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', String(id));
                e.dataTransfer.effectAllowed = 'move';
            });
            tabEl.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                tabEl.classList.add('drag-over');
            });
            tabEl.addEventListener('dragleave', () => tabEl.classList.remove('drag-over'));
            tabEl.addEventListener('mouseenter', () => {
                if (!tab.path) {
                    tabEl.title = tab.name;
                    return;
                }
                const prefix = activeDirectoryPath ? activeDirectoryPath + '/' : null;
                if (prefix && tab.path.startsWith(prefix)) {
                    tabEl.title = tab.path.slice(prefix.length);
                } else {
                    tabEl.title = tab.path;
                }
            });
            tabEl.addEventListener('drop', e => TabManager.handleTabDrop(e, id));
          tabsContainer.appendChild(tabEl);
            tab.element = tabEl;
            this.switchToTab(id);
            return tab;
        },
        switchToTab(id) {
            if (mdPreviewTimer) clearTimeout(mdPreviewTimer);
            if (currentTabId !== null) {
                const cur = tabs.find(t => t.id === currentTabId);
                if (cur) {
                    cur.content = textarea.value;
                    cur.scrollTop = textarea.scrollTop;
                    if (cur.dirty) FSA.saveTab(cur);
                }
            }
            currentTabId = id;
            const tab = tabs.find(t => t.id === id);
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.element.classList.add('active');
            textarea.value = tab.content || '';
            textarea.readOnly = !TAB_TYPES[tab.type]?.canDirty;
            lastLineCount = 0;
            UI.updateLineNumbers();
            if (tab.scrollTop !== undefined) {
                textarea.scrollTop = tab.scrollTop;
                gutter.scrollTop = tab.scrollTop;
            }
            UI.updateEditorStatus(tab);
            UI.updateMdPreview();
            if (tab.path) {
                activeFilePath = tab.path;
                TreeManager.highlightActive();
            }
            FSA.saveOpenTabs(id);
        },
        async closeTab(id) {
            if (mdPreviewTimer) clearTimeout(mdPreviewTimer);
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            const tab = tabs[idx];
            if (tab.dirty && !await UI.showDialog({isConfirm: true, confirmMessage: `"${tab.name}" has unsaved changes. Close anyway?`})) return;
            tabs.splice(idx, 1);
            tab.element.remove();
            if (tabs.length === 0) {
                currentTabId = null;
                textarea.value = '';
                gutter.replaceChildren();
                editorStatusEl.textContent = 'No file open';
                FSA.saveOpenTabs(null);
                localStorage.removeItem('openTabs');
                return;
            }
            this.switchToTab(tabs[Math.min(idx, tabs.length - 1)].id);
        }
    };
    // ──────────────────────────────────────────────
    // UI
    // ──────────────────────────────────────────────
    const UI = {
        showToast(message, duration = 2800) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = message;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), duration);
        },
        showActionToast(message, callback, duration = 8000) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = message;
            t.style.cssText += 'cursor:pointer;text-decoration:underline;';
            const timer = setTimeout(() => t.remove(), duration);
            t.addEventListener('click', () => { clearTimeout(timer); t.remove(); callback(); });
            document.body.appendChild(t);
        },
        showDialog({promptTitle, defaultValue = '', isConfirm = false, confirmMessage = '', danger = false} = {}) {
            return new Promise(resolve => {
                const modal = document.createElement('div');
                modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:10001;';
                const box = document.createElement('div');
                box.style.cssText = 'background:#18181b;padding:24px;border-radius:8px;min-width:320px;border:1px solid #27272a;';
                const titleDiv = document.createElement('div');
                titleDiv.style.cssText = 'margin-bottom:12px;font-size:14px;';
                titleDiv.textContent = isConfirm ? confirmMessage : promptTitle;
                let input;
                if (!isConfirm) {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.value = defaultValue;
                    input.style.cssText = 'width:100%;padding:10px;background:#27272a;border:1px solid #3f3f46;color:#e4e4e7;border-radius:4px;font-size:16px;';
                }
                const btnRow = document.createElement('div');
                btnRow.style.cssText = 'display:flex;gap:8px;margin-top:16px;';
                const okBtn = document.createElement('button');
                okBtn.style.cssText = `flex:1;min-height:44px;background:${danger ? '#ef4444' : '#a1a1aa'};color:${danger ? '#fff' : '#09090b'};border:none;border-radius:4px;`;
                okBtn.textContent = isConfirm ? 'Confirm' : 'OK';
                const cancelBtn = document.createElement('button');
                cancelBtn.style.cssText = 'flex:1;min-height:44px;background:#27272a;color:#e4e4e7;border:none;border-radius:4px;';
                cancelBtn.textContent = 'Cancel';
                btnRow.append(okBtn, cancelBtn);
                box.append(titleDiv, btnRow);
                if (!isConfirm) box.insertBefore(input, btnRow);
                modal.appendChild(box);
                document.body.appendChild(modal);
                const confirm = () => { resolve(isConfirm ? true : input.value); modal.remove(); };
                const cancel = () => { resolve(isConfirm ? false : null); modal.remove(); };
                if (!isConfirm) {
                    input.focus();
                    input.select();
                    input.onkeydown = e => {
                        if (e.key === 'Enter') confirm();
                        if (e.key === 'Escape') cancel();
                    };
                } else {
                    okBtn.focus();
                }
                okBtn.onclick = confirm;
                cancelBtn.onclick = cancel;
                modal.onclick = e => { if (e.target === modal) cancel(); };
            });
        },
        toggleSidebar() {
            const isCurrentlyHidden = sidebarEl.classList.contains('hidden');
            if (isCurrentlyHidden) {
                const savedWidth = localStorage.getItem('sidebarWidth');
                if (savedWidth) sidebarEl.style.width = savedWidth;
                sidebarEl.classList.remove('hidden');
            } else {
                sidebarEl.style.width = '';
                sidebarEl.classList.add('hidden');
            }
            const btn = document.getElementById('sidebar-toggle');
            btn.textContent = sidebarEl.classList.contains('hidden') ? '›' : '‹';
        },
        showContextMenu(e, node) {
            e.preventDefault();
            UI.closeContextMenu();
            contextMenuTarget = node;
            contextMenu = document.createElement('div');
            contextMenu.className = 'context-menu';
            const addItem = (label, handler, cls = '') => {
                const item = document.createElement('div');
                item.className = 'context-menu-item' + (cls ? ' ' + cls : '');
                item.textContent = label;
                item.addEventListener('click', () => { handler(); UI.closeContextMenu(); });
                contextMenu.appendChild(item);
            };
            const addSeparator = () => {
                const sep = document.createElement('div');
                sep.className = 'context-menu-separator';
                contextMenu.appendChild(sep);
            };
            if (!node) {
                addItem('New File', () => FSA.newFile());
                addItem('New Folder', () => FSA.newFolder());
                addSeparator();
                addItem('Open File', () => FSA.openFile());
                addItem('Open Folder', () => FSA.openFolder());
                addSeparator();
                addItem('Open legend.txt', () => {
                    const existing = tabs.find(t => t.type === 'legend');
                    if (existing) {
                        TabManager.switchToTab(existing.id);
                    } else {
                        TabManager.createNewTab(null, 'legend.txt', window.LEGEND, null, 'legend');
                    }
                });
                if (copiedNode) { addSeparator(); addItem('Paste', () => FSA.copyEntry(copiedNode, activeDirectoryPath || '')); }
            } else if (node.kind === 'directory') {
                addItem('New File', () => FSA.newFile());
                addItem('New Folder', () => FSA.newFolder());
                addSeparator();
                addItem('Rename', () => FSA.renameItem());
                addItem('Copy', () => { copiedNode = node; UI.showToast(`"${node.name}" ready to paste`); });
                if (copiedNode) addItem('Paste', () => FSA.copyEntry(copiedNode, node.path));
                addSeparator();
                addItem('Delete Folder', () => FSA.deleteFolder(), 'danger');
            } else {
                addItem('Open', () => FSA.openFileFromNode(contextMenuTarget));
                addItem('Rename', () => FSA.renameItem());
                addItem('Copy', () => { copiedNode = contextMenuTarget; UI.showToast(`"${contextMenuTarget.name}" ready to paste`); });
                addSeparator();
                addItem('Delete File', () => FSA.deleteFile(), 'danger');
            }
            contextMenu.style.left = e.clientX + 'px';
            contextMenu.style.top = e.clientY + 'px';
            document.body.appendChild(contextMenu);
            const rect = contextMenu.getBoundingClientRect();
            if (rect.right > window.innerWidth) contextMenu.style.left = (window.innerWidth - rect.width - 8) + 'px';
            if (rect.bottom > window.innerHeight) contextMenu.style.top = (window.innerHeight - rect.height - 8) + 'px';
        },
        closeContextMenu() {
            if (contextMenu) {
                contextMenu.remove();
                contextMenu = null;
                contextMenuTarget = null;
            }
        },
        updateLineNumbers() {
            const lineCount = (textarea.value.match(/\n/g) || []).length + 1;
            if (lineCount === lastLineCount) return;
            lastLineCount = lineCount;
            gutter.textContent = Array.from({length: lineCount}, (_, i) => i + 1).join('\n');
        },
        updateEditorStatus(tab) {
            const pos = textarea.selectionStart || 0;
            const before = textarea.value.substring(0, pos);
            const lines = before.split('\n');
            const line = lines.length;
            const col = lines[lines.length - 1].length + 1;
            const modified = tab.dirty ? ' • Modified' : '';
            statusEl.textContent = `Ln ${line}, Col ${col} | ${tabs.length} tab${tabs.length !== 1 ? 's' : ''}`;
            editorStatusEl.textContent = tab.name + modified;
        },
        updateMdPreview() {
            const previewEl = document.getElementById('md-preview');
            const tab = currentTabId !== null ? tabs.find(t => t.id === currentTabId) : null;
            if (!tab || tab.type !== 'markdown' || !tab.mdPreview) {
                previewEl.classList.add('hidden');
                textarea.classList.remove('md-active');
                return;
            }
            previewEl.classList.remove('hidden');
            previewEl.innerHTML = MarkdownMini.parse(textarea.value);
            textarea.classList.add('md-active');
        },
        bindEvents() {
            document.getElementById('sidebar-toggle').addEventListener('click', UI.toggleSidebar);
            document.getElementById('sidebar-root-row').addEventListener('click', e => {
                if (e.target.id === 'refresh-folder' || e.target.id === 'clear-folder') return;
                FSA.openFolder();
            });
            document.getElementById('topbar-active-row').addEventListener('click', () => {
                activeDirectoryPath = null;
                TreeManager.highlightActive();
                TreeManager.updateHeader();
            });
            // Settings toggle
            document.getElementById('settings-toggle').addEventListener('click', () => {
                const panel = document.getElementById('settings-panel');
                const btn = document.getElementById('settings-toggle');
                const isNowHidden = panel.classList.toggle('hidden');
                btn.textContent = isNowHidden ? '›' : '‹';
            });
            // Toggle width slider
            document.getElementById('settings-toggle-slider').addEventListener('click', function() {
                const sliderEl = document.getElementById('line-width-slider');
                const nowHidden = sliderEl.classList.toggle('hidden');
                this.classList.toggle('active', !nowHidden);
                localStorage.setItem('sliderVisible', !nowHidden);
            });
            // Toggle gutter
            document.getElementById('settings-toggle-gutter').addEventListener('click', function() {
                const nowHidden = gutter.classList.toggle('hidden');
                this.classList.toggle('active', !nowHidden);
                const previewEl = document.getElementById('md-preview');
                previewEl.style.left = nowHidden ? '0' : '60px';
                localStorage.setItem('gutterVisible', !nowHidden);
            });
            // Font size
            const MIN_FONT = 10, MAX_FONT = 24, DEFAULT_FONT_SIZE = 14;
            const applyFontSize = sz => {
                textarea.style.fontSize = sz + 'px';
                gutter.style.fontSize = sz + 'px';
                document.getElementById('md-preview').style.fontSize = sz + 'px';
            };
            document.getElementById('settings-font-decrease').addEventListener('click', () => {
                const cur = parseInt(textarea.style.fontSize) || DEFAULT_FONT_SIZE;
                if (cur > MIN_FONT) {
                    const next = cur - 1;
                    applyFontSize(next);
                    localStorage.setItem('editorFontSize', next);
                }
            });
            document.getElementById('settings-font-increase').addEventListener('click', () => {
                const cur = parseInt(textarea.style.fontSize) || DEFAULT_FONT_SIZE;
                if (cur < MAX_FONT) {
                    const next = cur + 1;
                    applyFontSize(next);
                    localStorage.setItem('editorFontSize', next);
                }
            });
            document.getElementById('settings-font-reset').addEventListener('click', () => {
                applyFontSize(DEFAULT_FONT_SIZE);
                localStorage.setItem('editorFontSize', DEFAULT_FONT_SIZE);
            });
            window.addEventListener('resize', () => {
                const wasMobile = isMobile;
                isMobile = window.innerWidth <= 768;
                if (isMobile && !wasMobile) sidebarEl.classList.add('hidden');
            });
            // Sidebar resize
            const sidebarResizeHandle = document.getElementById('sidebar-resize');
            let sidebarResizing = false, sidebarResizeStartX = 0, sidebarResizeStartW = 0;
            sidebarResizeHandle.addEventListener('mousedown', e => {
                sidebarResizing = true;
                sidebarResizeStartX = e.clientX;
                sidebarResizeStartW = sidebarEl.offsetWidth;
                sidebarEl.style.transition = 'none';
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });
            document.addEventListener('mousemove', e => {
                if (!sidebarResizing) return;
                const w = Math.max(150, Math.min(600, sidebarResizeStartW + e.clientX - sidebarResizeStartX));
                sidebarEl.style.width = w + 'px';
            });
            document.addEventListener('mouseup', () => {
                if (!sidebarResizing) return;
                sidebarResizing = false;
                sidebarEl.style.transition = '';
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                localStorage.setItem('sidebarWidth', sidebarEl.offsetWidth + 'px');
            });
            treeContainer.addEventListener('dragover', e => {
                if (!e.dataTransfer.types.includes('application/x-tree-path')) return;
                if (e.target.closest('.folder-header')) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                treeContainer.classList.add('drop-target');
            });
            treeContainer.addEventListener('dragleave', () => treeContainer.classList.remove('drop-target'));
            treeContainer.addEventListener('drop', e => {
                treeContainer.classList.remove('drop-target');
                if (e.target.closest('.folder-header')) return;
                e.preventDefault();
                const srcPath = e.dataTransfer.getData('application/x-tree-path');
                if (srcPath) FSA.moveEntry(srcPath, '');
            });
            document.addEventListener('click', e => {
                if (e.target.id === 'clear-folder') { e.stopPropagation(); FSA.clearSavedFolder(); return; }
                if (e.target.id === 'refresh-folder') {
                    e.stopPropagation();
                    if (currentDirHandle) FSA.mutateAndRebuild();
                    return;
                }
                if (!e.target.closest('.context-menu')) UI.closeContextMenu();
            });
            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                    e.preventDefault();
                    if (currentTabId) TabManager.closeTab(currentTabId);
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    FSA.saveCurrentFile();
                }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
                    e.preventDefault();
                    FSA.newFile();
                }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
                    e.preventDefault();
                    FSA.openFolder();
                }
            });
            treeContainer.addEventListener('contextmenu', e => {
                const folder = e.target.closest('.folder-header');
                const file = e.target.closest('.file-item');
                if (folder) {
                    const node = TreeManager.getNode(folder.dataset.path);
                    if (node) UI.showContextMenu(e, node);
                } else if (file) {
                    const node = TreeManager.getNode(file.dataset.path);
                    if (node) UI.showContextMenu(e, node);
                } else {
                    UI.showContextMenu(e, null);
                }
            });
            let longPressTimer = null;
            let touchMoved = false;
            treeContainer.addEventListener('touchstart', e => {
                longPressTriggered = false;
                touchMoved = false;
                const touch = e.touches[0];
                const target = e.target;
                longPressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    const folder = target.closest('.folder-header');
                    const file = target.closest('.file-item');
                    const fakeEvent = { preventDefault() {}, clientX: touch.clientX, clientY: touch.clientY };
                    if (folder) {
                        const node = TreeManager.getNode(folder.dataset.path);
                        if (node) UI.showContextMenu(fakeEvent, node);
                    } else if (file) {
                        const node = TreeManager.getNode(file.dataset.path);
                        if (node) UI.showContextMenu(fakeEvent, node);
                    } else {
                        UI.showContextMenu(fakeEvent, null);
                    }
                }, 600);
            }, { passive: true });
            treeContainer.addEventListener('touchend', e => {
                clearTimeout(longPressTimer);
                if (longPressTriggered) {
                    e.preventDefault();
                    return;
                }
                if (!touchMoved) {
                    const target = e.target;
                    const el = target.closest('.folder-header') || target.closest('.file-item');
                    if (el) {
                        e.preventDefault();
                        el.click();
                    }
                }
            });
            treeContainer.addEventListener('touchmove', () => { clearTimeout(longPressTimer); touchMoved = true; }, { passive: true });
            // Allow dropping a tab past the last tab (append to end)
            tabsContainer.addEventListener('dragover', e => {
                if (!e.dataTransfer.types.includes('text/plain')) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            });
            tabsContainer.addEventListener('drop', e => {
                e.preventDefault();
                const draggedId = parseInt(e.dataTransfer.getData('text/plain'), 10);
                if (isNaN(draggedId)) return;
                const fromIdx = tabs.findIndex(t => t.id === draggedId);
                if (fromIdx === -1) return;
                const movedTab = tabs[fromIdx];
                tabs.splice(fromIdx, 1);
                tabs.push(movedTab);
                tabsContainer.appendChild(movedTab.element);
                FSA.saveOpenTabs(currentTabId);
            });
            textarea.addEventListener('mousedown', () => {
                if (currentTabId) {
                    const tab = tabs.find(t => t.id === currentTabId);
                    if (tab) {
                        tabsContainer.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        tab.element.classList.add('active');
                        if (tab.type === 'markdown' && tab.mdPreview) {
                            clearTimeout(mdPreviewTimer);
                            document.getElementById('md-preview').classList.add('hidden');
                            textarea.classList.remove('md-active');
                        }
                    }
                }
            });
            textarea.addEventListener('input', () => {
                this.updateLineNumbers();
                if (currentTabId) {
                    const tab = tabs.find(t => t.id === currentTabId);
                    if (tab) {
                        if (TAB_TYPES[tab.type]?.canDirty) {
                            tab.dirty = true;
                            if (tab.element) tab.element.querySelector('.dirty-indicator').style.display = '';
                            FSA.scheduleSave();
                        }
                        this.updateEditorStatus(tab);
                        if (tab.type === 'markdown' && tab.mdPreview) {
                            clearTimeout(mdPreviewTimer);
                            document.getElementById('md-preview').classList.add('hidden');
                            textarea.classList.remove('md-active');
                            mdPreviewTimer = setTimeout(() => this.updateMdPreview(), MD_PREVIEW_DEBOUNCE_DELAY);
                        } else {
                            this.updateMdPreview();
                        }
                    }
                }
            });
            textarea.addEventListener('scroll', () => gutter.scrollTop = textarea.scrollTop);
            textarea.addEventListener('selectionchange', () => {
                if (currentTabId) {
                    const tab = tabs.find(t => t.id === currentTabId);
                    if (tab) this.updateEditorStatus(tab);
                }
            });
            textarea.addEventListener('keydown', e => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    const tab = currentTabId !== null ? tabs.find(t => t.id === currentTabId) : null;
                    if (tab && tab.type === 'markdown' && tab.mdPreview) {
                        clearTimeout(mdPreviewTimer);
                        document.getElementById('md-preview').classList.add('hidden');
                        textarea.classList.remove('md-active');
                        mdPreviewTimer = setTimeout(() => UI.updateMdPreview(), MD_PREVIEW_DEBOUNCE_DELAY);
                    }
                }
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    textarea.value = textarea.value.substring(0, start) + '\t' + textarea.value.substring(end);
                    textarea.selectionStart = textarea.selectionEnd = start + 1;
                    textarea.dispatchEvent(new Event('input'));
                }
            });
            
            const slider = document.getElementById('width-slider');
            const valueEl = document.getElementById('width-value');
            const MAX_CHARS = 200;
            slider.addEventListener('input', e => {
                const v = +e.target.value;
                const previewEl = document.getElementById('md-preview');
                valueEl.textContent = (v === MAX_CHARS) ? '∞' : `${v} char/line`;
                if (v === MAX_CHARS) {
                    textarea.style.maxWidth = 'none';
                    textarea.style.whiteSpace = 'pre';
                    textarea.style.wordWrap = 'normal';
                    previewEl.style.maxWidth = 'none';
                } else {
                    textarea.style.maxWidth = v + 'ch';
                    textarea.style.whiteSpace = 'pre-wrap';
                    textarea.style.wordWrap = 'break-word';
                    previewEl.style.maxWidth = v + 'ch';
                }
            });
            slider.dispatchEvent(new Event('input'));
           
            window.addEventListener('beforeunload', e => {
                if (tabs.some(t => t.dirty)) {
                    FSA.flushSave();
                    e.preventDefault();
                    return e.returnValue = 'Unsaved changes will be lost';
                }
            });
        },
        init: async () => {
            textarea = document.getElementById('textarea');
            gutter = document.getElementById('gutter');
            tabsContainer = document.getElementById('tabs');
            treeContainer = document.getElementById('tree-container');
            sidebarHeader = document.getElementById('sidebar-header');
            sidebarEl = document.getElementById('sidebar');
            statusEl = document.getElementById('status');
            editorStatusEl = document.getElementById('editor-status');
            activeDirNameEl = document.getElementById('active-dir-name');
            rootDirNameEl = document.getElementById('root-dir-name');
            sidebarHeaderActionsEl = document.getElementById('sidebar-header-actions');
            const savedSidebarWidth = localStorage.getItem('sidebarWidth');
            if (savedSidebarWidth) sidebarEl.style.width = savedSidebarWidth;
            UI.bindEvents();
            // Restore settings
            const savedFontSize = parseInt(localStorage.getItem('editorFontSize'));
            if (savedFontSize) {
                textarea.style.fontSize = savedFontSize + 'px';
                gutter.style.fontSize = savedFontSize + 'px';
                document.getElementById('md-preview').style.fontSize = savedFontSize + 'px';
            }
            if (localStorage.getItem('sliderVisible') === 'false') {
                document.getElementById('line-width-slider').classList.add('hidden');
                document.getElementById('settings-toggle-slider').classList.remove('active');
            }
            if (localStorage.getItem('gutterVisible') === 'false') {
                gutter.classList.add('hidden');
                document.getElementById('settings-toggle-gutter').classList.remove('active');
                document.getElementById('md-preview').style.left = '0';
            }
            await FSA.initDB();
            await FSA.restoreSession();
            if (isMobile) sidebarEl.classList.add('hidden');
            // Re-run restore when page returns from bfcache (back/forward nav or wake from sleep)
            window.addEventListener('pageshow', async (e) => {
                if (!e.persisted) return;
                if (!currentDirHandle) { await FSA.restoreSession(); return; }
                // Re-validate permission in case it lapsed while the page was cached
                const perm = await FSA.queryPermission(currentDirHandle);
                if (perm !== 'granted') {
                    UI.showActionToast('Tap to restore folder access', async () => {
                        try { await currentDirHandle.requestPermission({ mode: 'readwrite' }); } catch (err) { console.warn('requestPermission failed:', err); }
                    });
                }
            });
            // Re-run restore when page becomes visible after being hidden (lock-screen / tab switch)
            document.addEventListener('visibilitychange', async () => {
                if (document.visibilityState !== 'visible') return;
                if (!currentDirHandle) { await FSA.restoreSession(); return; }
                // Re-validate permission in case it lapsed during sleep
                const perm = await FSA.queryPermission(currentDirHandle);
                if (perm !== 'granted') {
                    UI.showActionToast('Tap to restore folder access', async () => {
                        try { await currentDirHandle.requestPermission({ mode: 'readwrite' }); } catch (err) { console.warn('requestPermission failed:', err); }
                    });
                }
            });
        }
    };
    return { init: UI.init };
})();
// Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
// Launch
window.onload = App.init;
</script>
</body>
</html>
