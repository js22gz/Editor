<style>
/* ────────────────────────────────────────────────────────
   1. VARIABLES & THEME
──────────────────────────────────────────────────────── */
:root {
  --bg-base: #09090b;
  --bg-surface: #18181b;

  --text-subtle: #c1c1cb;
  --text-secondary: #a1a1aa;

  --text-dim: #78787f;
  --danger: #ef4444;
  --danger-bg: #7f1d1d;
}

/* ────────────────────────────────────────────────────────
   2. BASE & LAYOUT
──────────────────────────────────────────────────────── */
* { box-sizing: border-box; }

body {
  margin: 0; height: 100vh; background: var(--bg-base); color: var(--text-primary);
  font-family: system-ui, -apple-system, sans-serif; overflow: hidden;
  display: flex; flex-direction: column;
}

main { flex: 1; display: flex; overflow: hidden; }

.editor-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ────────────────────────────────────────────────────────
   3. HEADER
──────────────────────────────────────────────────────── */
header {

}

}

/* ────────────────────────────────────────────────────────
   4. SIDEBAR & TREE (DUAL-PANE – DEDUPLICATED)
──────────────────────────────────────────────────────── */
#sidebar, #sidebar-right {
  width: 280px;

#tree-container, #tree-container-right {

/* ────────────────────────────────────────────────────────

/* ── Line width slider – reliable downward triangle thumb (Chrome-first) ── */
#line-width-slider {
    display: flex;
    align-items: center;

    background: var(--border-color);

    border-radius: 3px;

#line-width-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;

    width: 18px;
    height: 18px;

#width-value {

'use strict';
// ────────────────────────────────────────────────────────
// ReactiveState – observable state container
// ────────────────────────────────────────────────────────
class ReactiveState extends EventTarget {
    constructor() {
        super();
        this.currentDirHandle = null;
        this.tabs = [];
        this.currentTabId = null;
        this.expandedFolders = new Set();
        this.activeFilePath = null;
        this.activeDirectoryPath = null;
        this.copiedNode = null;
        return new Proxy(this, {
            get(target, prop) {
                const value = Reflect.get(target, prop);
                return typeof value === 'function' ? value.bind(target) : value;
            },
            set(target, prop, value) {
                if (target[prop] === value) return true;
                target[prop] = value;
                target.dispatchEvent(new CustomEvent(prop + 'Changed'));
                return true;
            }
        });
    }

    mutate(prop, fn) {
        fn(this[prop]);
        this.dispatchEvent(new CustomEvent(prop + 'Changed'));
    }
        notify(prop) {
        this.dispatchEvent(new CustomEvent(prop + 'Changed'));
    }
    getTab(id) { return this.tabs.find(t => t.id === id); }
    getActiveTab() { return this.currentTabId !== null ? this.getTab(this.currentTabId) : null; }
}
// ────────────────────────────────────────────────────────
// EventBus – namespaced internal event system
//   Namespaces: ui: tab: editor: extension: restore:
// ────────────────────────────────────────────────────────
const bus = (() => {
    const listeners = new Map();
    return Object.freeze({
        on(event, fn) {
            if (!listeners.has(event)) listeners.set(event, new Set());
            listeners.get(event).add(fn);
            return () => listeners.get(event)?.delete(fn);
        },
        emit(event, ...args) {
            let r; listeners.get(event)?.forEach(fn => { r = fn(...args); }); return r;
        }
    });
})();
// ────────────────────────────────────────────────────────
// FileSystemManager 
// ────────────────────────────────────────────────────────
class FileSystemManager {
    #INVALID_CHARS = /[<>:"|?*\x00-\x1F]/;
    #MAX_FILE_SIZE = 3 * 1024 * 1024; // 3 MB
    #NON_TEXT_EXT = new Set([
        'png','jpg','jpeg','gif','bmp','ico','webp','tif','tiff','psd','ai','eps','raw','cr2','nef','heic','heif','avif',
        'mp3','wav','ogg','flac','aac','wma','m4a','aiff','opus','mid','midi',
        'mp4','avi','mov','mkv','wmv','flv','webm','m4v','mpg','mpeg','3gp',
        'zip','rar','7z','tar','gz','bz2','xz','zst','iso','dmg','pkg','deb','rpm','cab','lz','lz4','lzma',
        'pdf','doc','docx','xls','xlsx','ppt','pptx','odt','ods','odp','pages','numbers','key',
        'exe','dll','so','dylib','bin','app','msi','apk','ipa','com','class','o','obj','pyc','pyo','wasm',
        'db','sqlite','sqlite3','mdb','accdb',
        'ttf','otf','woff','woff2','eot',
        'blend','fbx','glb','gltf','stl','3ds','dwg','dxf',
    ]);
    /** @param {ReactiveState} state */
    constructor(state) {
        this.state = state;
        this.db = null;
        /** @type {TreeManager} */ this.tree = null;
        /** @type {TabManager} */ this.tabs = null;
        this.scheduleSave = () => {
            if (!this.state.currentTabId) return;
            const tab = this.state.getTab(this.state.currentTabId);
            if (!tab) return;
            clearTimeout(tab._saveTimer);
            tab._saveTimer = setTimeout(() => {
                tab._saveTimer = null;
                if (tab.dirty) this.saveTab(tab);
            }, 750);
        };
    }
    get maxFileSize() { return this.#MAX_FILE_SIZE; }
    async #resolve(base, pathStr = '') {
        if (!base) throw new Error('No base handle');
        if (!pathStr || pathStr === '/') return { parent: base, name: base.name, path: '/' };
        const parts = pathStr.split('/').filter(Boolean);
        let parent = base;
        const name = parts[parts.length - 1];
        for (let i = 0; i < parts.length - 1; i++) {
            parent = await parent.getDirectoryHandle(parts[i]);

        return { parent, name, path: pathStr };

    /** Prompt the user before opening a file exceeding #MAX_FILE_SIZE. Returns true if the file is small enough or the user chose to proceed. */
    async #confirmLargeFile(file) {

        return bus.emit('ui:confirm', { confirmMessage: `This file is ${sizeMB} MB. Files over 3 MB may slow down or freeze the editor. Open anyway?`, danger: true });
    }
    /** Returns true if the filename has a known non-text extension. */
    #isNonText(name) {

    // ── Core helpers ───────────────────────────────────────
    async #guard(handle, action = 'operation') {

        perm = await handle.requestPermission({ mode: 'readwrite' });

        return handle;
    }
    async #write(handle, content) {
        const writable = await handle.createWritable();
        await writable.write(content);
        await writable.close();
    }
    #formatError(action, e) {
        if (e.name === 'NotAllowedError') return `${action} failed: permission denied – re-open folder`;
        if (e.name === 'QuotaExceededError') return `${action} failed: not enough disk space`;
        if (e.name === 'NotFoundError') return `${action} failed: file/folder not found`;
        return `${action} failed: ${e.message || e}`;
    }

            await dirHandle.getFileHandle(name);
            return true;
        } catch (e) { if (e.name !== 'NotFoundError') throw e; }
        try {
            await dirHandle.getDirectoryHandle(name);
            return true;
        } catch (e) { if (e.name !== 'NotFoundError') throw e; }
        return false;
    }
    // ── DB & persistence ───────────────────────────────────
    async initDB() {
        if (this.db) return;
        return new Promise(resolve => {
            const req = indexedDB.open('FileEditor', 2);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
                if (!db.objectStoreNames.contains('extensions')) db.createObjectStore('extensions');
            };
            req.onsuccess = e => { this.db = e.target.result; resolve(); };
            req.onerror = () => resolve();
        });
    }
    async queryPermission(handle) {
        if (!handle) return 'denied';
        try { return await handle.queryPermission({ mode: 'readwrite' }); } catch { return 'denied'; }
    }
    async saveFolderHandle(handle) {
        await this.initDB();
        const tx = this.db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(handle, 'main');
    }
    async loadSavedFolder() {
        await this.initDB();
        return new Promise(resolve => {
            const tx = this.db.transaction('handles');
            const req = tx.objectStore('handles').get('main');
            req.onsuccess = async () => {
                const handle = req.result;
                if (!handle) return resolve({ status: 'none' });
                const perm = await this.queryPermission(handle);
                if (perm === 'granted') return resolve({ status: 'granted', handle });
                try {
                    const granted = await handle.requestPermission({ mode: 'readwrite' });
                    resolve(granted === 'granted' ? { status: 'granted', handle } : { status: 'needs-auth', handle });
                } catch {
                    resolve({ status: 'needs-auth', handle });
                }
            };
            req.onerror = () => resolve({ status: 'none' });
        });
    }
    async clearSavedFolder() {
        if (this.db) {
            const tx = this.db.transaction('handles', 'readwrite');
            tx.objectStore('handles').delete('main');
        }
        this.state.currentDirHandle = null;
        this.state.activeDirectoryPath = null;
        this.state.expandedFolders.clear();
        localStorage.removeItem('expandedFolders');
        localStorage.removeItem('openTabs');
        this.tree.clear();
        this.tree.updateHeader();
    }
    // ── Tree & lazy loading ────────────────────────────────
    async loadChildren(dirNode) {
        if (dirNode.kind !== 'directory' || dirNode.childrenLoaded) return;
        dirNode.children = [];
        try {
            const entries = [];
            for await (const [name, handle] of dirNode.handle.entries()) {
                if (name.startsWith('.') || name === 'node_modules' || name === '__pycache__') continue;
                entries.push([name, handle]);
            }
            entries.sort(([aName, aH], [bName, bH]) =>
                (aH.kind !== bH.kind ? (aH.kind === 'directory' ? -1 : 1) : aName.localeCompare(bName, undefined, { numeric: true }))
            );
            for (const [name, handle] of entries) {
                const path = dirNode.path === '/' ? name : `${dirNode.path}/${name}`;
                const node = handle.kind === 'directory'
                    ? { name, kind: 'directory', handle, path, children: [], childrenLoaded: false }
                    : { name, kind: 'file', handle, path };
                this.tree.registerNode(path, node);
                dirNode.children.push(node);
            }
        } catch {}
        dirNode.childrenLoaded = true;
    }
    async build(rootHandle) {
        this.tree.clear();
        const root = {
            name: rootHandle.name,
            kind: 'directory',
            handle: rootHandle,
            path: '/',
            children: [],
            childrenLoaded: false
        };
        this.tree.registerNode('/', root);
        this.tree.fileTree = root;
        await this.loadChildren(root);
        return root;
    }
    async mutateAndRebuild() {
        if (!this.state.currentDirHandle) return;
        const perm = await this.queryPermission(this.state.currentDirHandle);
        if (perm !== 'granted') {
            try {
                const result = await this.state.currentDirHandle.requestPermission({ mode: 'readwrite' });
                if (result !== 'granted') {
                    bus.emit('ui:toast', 'Re-open folder to grant access', 4000);
                    return;
                }
            } catch {
                bus.emit('ui:toast', 'Re-open folder to grant access', 4000);
                return;
            }
        }
        if (this._rebuildInFlight) {
            this._rebuildQueued = true;
            return;
        }
        this._rebuildInFlight = true;
        try {
            do {
                this._rebuildQueued = false;
                const previouslyExpanded = new Set(this.state.expandedFolders);
                await this.build(this.state.currentDirHandle);
                for (const path of [...previouslyExpanded].sort((a, b) => a.split('/').length - b.split('/').length)) {
                    const node = this.tree.getNode(path);
                    if (node?.kind === 'directory') {
                        await this.loadChildren(node);
                        this.state.expandedFolders.add(path);
                    }
                }
                this.tree.render();
                this.tree.updateHeader();
            } while (this._rebuildQueued);
        } finally {
            this._rebuildInFlight = false;
        }
    }
    // ── Expanded tabs persistence ──────────────────────────
    loadExpandedState() {
        try {
            const saved = localStorage.getItem('expandedFolders');
            if (saved) this.state.expandedFolders = new Set(JSON.parse(saved));
        } catch {}
    }
    saveExpandedState() {
        try { localStorage.setItem('expandedFolders', JSON.stringify([...this.state.expandedFolders])); } catch {}
    }
    saveOpenTabs(currentId) {
        try {
            const data = this.state.tabs
                .filter(t => t.path)
                .map(t => ({ path: t.path, name: t.name, type: t.type, extensionMode: t.extensionMode || null, active: t.id === currentId }));

            // Clearing is handled explicitly by closeTab → localStorage.removeItem.

            }

    }
    loadOpenTabs() {
        try {
            const saved = localStorage.getItem('openTabs');

        } catch { return []; }
    }
    // ── Open folder/file ───────────────────────────────────
    async openFolder() {

}

async openFileFromNode(node) {

	async openInBrowser(node) {

    async moveEntry(srcPath, destFolderPath = '') {

            return bus.emit('ui:toast', 'Cannot move folder into itself');
        }
        try {
            const { parent: srcParent } = await this.#resolve(this.state.currentDirHandle, srcPath);
            const destNode = this.tree.getNode(destFolderPath || '/');
            if (!destNode) return bus.emit('ui:toast', 'Destination folder not found');
            await this.#guard(srcParent);
            await this.#guard(destNode.handle);
            if (srcNode.kind === 'directory') await this.#guard(srcNode.handle);
            if (await this.#entryExists(destNode.handle, srcNode.name)) {
                return bus.emit('ui:toast', `"${srcNode.name}" already exists in destination`);
            }
            await (srcNode.kind === 'directory'
                ? this.#moveDirectory(srcNode, destNode.handle, destFolderPath)
                : this.#moveFile(srcNode, srcParent, destNode.handle, destFolderPath));

                this.state.expandedFolders.add(destFolderPath);
                this.saveExpandedState();
            }
            await this.mutateAndRebuild();
            // Notify tab-related listeners of possible path changes
            this.state.notify('tabs');
            bus.emit('ui:toast', `Moved "${srcNode.name}"`);
        } catch (e) {
            bus.emit('ui:toast', this.#formatError('Move', e), 4000);
        }
        bus.emit('ui:close-context-menu');
    }
    async #moveFile(srcNode, srcParent, destHandle, destFolderPath) {
        if (srcNode.handle.move) {
            await srcNode.handle.move(destHandle, srcNode.name);
        } else {
            const file = await srcNode.handle.getFile();
            const newHandle = await destHandle.getFileHandle(srcNode.name, { create: true });
            await this.#write(newHandle, file);
            await srcParent.removeEntry(srcNode.name);
        }
        const newPath = destFolderPath ? `${destFolderPath}/${srcNode.name}` : srcNode.name;
        this.tabs.updateTabPaths(srcNode.path, newPath, srcNode.handle); // handle updated in place for move
    }
    async #moveDirectory(srcNode, destHandle, destFolderPath) {
        let moved = false;
        if (srcNode.handle.move) {
            try {
                await srcNode.handle.move(destHandle, srcNode.name);
                moved = true;
            } catch {}
        }
        if (!moved) {
            await this.#copyDirectory(srcNode.handle, destHandle, srcNode.name);
            await (await this.#resolve(this.state.currentDirHandle, srcNode.path)).parent.removeEntry(srcNode.name, { recursive: true });

    static #MAX_COPY_DEPTH = 100;
    async #copyDirectory(srcDirHandle, destParent, name) {
        const stack = [{ src: srcDirHandle, dest: destParent, name, depth: 0 }];
        try {
            while (stack.length > 0) {
                const { src, dest, name: dirName, depth } = stack.pop();
                if (depth >= FileSystemManager.#MAX_COPY_DEPTH) {
                    throw new Error(`Directory nesting too deep (>${FileSystemManager.#MAX_COPY_DEPTH} levels)`);
                }
                const newDir = await dest.getDirectoryHandle(dirName, { create: true });
                for await (const [entryName, entryHandle] of src.entries()) {

                        const file = await entryHandle.getFile();
                        const newHandle = await newDir.getFileHandle(entryName, { create: true });
                        await this.#write(newHandle, file);
                    } else {

            let copyName = srcNode.name;

        }

// DirectoryTreeView – reusable view for a directory tree pane

class DirectoryTreeView {
    #activeDirectoryPath = null;
    /** @param {string} containerId @param {ReactiveState} state @param {FileSystemManager} fs @param {string} paneName */
    constructor(containerId, state, fs, paneName = 'left') {
        this.container = document.getElementById(containerId);
        this.state = state;
        this.fs = fs;
        this.paneName = paneName;
        this.longPressTriggered = false;
        this.rootDirNameEl = null;
        this.sidebarHeaderActionsEl = null;
        this.treeManager = null; // set when added to TreeManager
        this.state.addEventListener('activeFilePathChanged', () => this.highlightActive());
    }

    get activeDirectoryPath() { return this.#activeDirectoryPath; }
    set activeDirectoryPath(v) { this.#activeDirectoryPath = v; this.highlightActive(); }
    /** Update both per-view and global active directory in one call */
    setActiveDirectory(path) {
        this.#activeDirectoryPath = path;
        this.state.activeDirectoryPath = path;
        this.highlightActive();
    }

    #renderTree(node, container, guides = [], isLast = true) {
        const isDir = node.kind === 'directory';
        const row = document.createElement('div');
        row.className = `tree-row ${isDir ? 'dir-row' : ''}`;
        row.dataset.path = node.path;

        const prefixEl = document.createElement('span');
        prefixEl.className = 'prefix';
        prefixEl.textContent = ' '.repeat((guides.length + 1) * 5);
        guides.forEach((hasLine, idx) => {
            if (hasLine) {
                const g = document.createElement('span');
                g.className = 'tree-vline';
                g.style.left = (idx * 5 + 0.5) + 'ch';
                prefixEl.appendChild(g);
            }
        });
        if (isDir) {
            const c = document.createElement('span');
            c.className = isLast ? 'tree-elbow' : 'tree-tee';
            c.style.left = (guides.length * 5 + 0.5) + 'ch';
            prefixEl.appendChild(c);
        }
        row.appendChild(prefixEl);

        if (!isDir) {
            const square = document.createElement('span');
            square.className = 'file-square';
            row.appendChild(square);
        }

        const nameEl = document.createElement('span');
        nameEl.className = isDir ? 'name dir' : 'name file-name';
        nameEl.textContent = node.name + (isDir ? '/' : '');
        row.appendChild(nameEl);

        container.appendChild(row);

        if (isDir) {
            const childrenDiv = document.createElement('div');
            childrenDiv.className = 'children';
            childrenDiv.style.display = this.state.expandedFolders.has(node.path) ? 'block' : 'none';
            container.appendChild(childrenDiv);

            row.onclick = async (e) => {
                if (this.longPressTriggered) return;
                const wasExpanded = this.state.expandedFolders.has(node.path);
                if (!wasExpanded) {
                    await this.fs.loadChildren(node);
                    childrenDiv.replaceChildren();
                    const kids = node.children || [];
                    const lastDirIdx = kids.reduce((acc, c, i) => c.kind === 'directory' ? i : acc, -1);
                    kids.forEach((child, i) => {
                        this.#renderTree(child, childrenDiv, [...guides, !isLast], lastDirIdx < 0 || i >= lastDirIdx);
                    });
                }
                if (wasExpanded) {
                    this.state.mutate('expandedFolders', s => s.delete(node.path));
                    childrenDiv.style.display = 'none';
                } else {
                    this.state.mutate('expandedFolders', s => s.add(node.path));
                    childrenDiv.style.display = 'block';
                }
                this.fs.saveExpandedState();
                this.setActiveDirectory(node.path);
                this.updateHeader();
            };

            row.draggable = true;
            row.addEventListener('dragstart', e => {
                e.dataTransfer.setData('application/x-tree-path', node.path);
                row.classList.add('dragging');
            });
            row.addEventListener('dragend', () => row.classList.remove('dragging'));
            row.addEventListener('dragover', e => {
                if (!e.dataTransfer.types.includes('application/x-tree-path')) return;
                e.preventDefault();
                row.classList.add('drop-target');
            });
            row.addEventListener('dragleave', () => row.classList.remove('drop-target'));
            row.addEventListener('drop', e => {
                e.preventDefault();
                row.classList.remove('drop-target');
                const srcPath = e.dataTransfer.getData('application/x-tree-path');
                if (srcPath && srcPath !== node.path && !node.path.startsWith(srcPath + '/')) {
                    this.fs.moveEntry(srcPath, node.path);
                }
            });

            if (this.state.expandedFolders.has(node.path) && node.children?.length) {
                const kids = node.children;
                const lastDirIdx = kids.reduce((acc, c, i) => c.kind === 'directory' ? i : acc, -1);
                kids.forEach((child, i) => {
                    this.#renderTree(child, childrenDiv, [...guides, !isLast], lastDirIdx < 0 || i >= lastDirIdx);
                });
            }
        } else {
            row.onclick = () => { if (!this.longPressTriggered) this.fs.openFileFromNode(node); };
            row.draggable = true;
            row.addEventListener('dragstart', e => {
                e.dataTransfer.setData('application/x-tree-path', node.path);
                row.classList.add('dragging');
            });
            row.addEventListener('dragend', () => row.classList.remove('dragging'));
        }
    }

    render() {
        this.container.replaceChildren();
        const fileTree = this.treeManager ? this.treeManager.fileTree : null;
        if (!fileTree) {
            const msg = document.createElement('div');
            msg.style.cssText = 'padding:20px;color:#52525b;text-align:center;font-size:12px';
            msg.textContent = 'No folder open';
            this.container.appendChild(msg);
            return;
        }
        const children = fileTree.children || [];
        const lastDirIdx = children.reduce((acc, c, i) => c.kind === 'directory' ? i : acc, -1);
        children.forEach((child, i) => {
            this.#renderTree(child, this.container, [], lastDirIdx < 0 || i >= lastDirIdx);
        });
        this.highlightActive();
    }
    updateHeader() {
        if (!this.rootDirNameEl) return;
        const fileTree = this.treeManager ? this.treeManager.fileTree : null;
        if (!fileTree || !this.state.currentDirHandle) {
            this.rootDirNameEl.textContent = this.paneName === 'left' ? 'Click to open folder' : '';
            if (this.sidebarHeaderActionsEl) this.sidebarHeaderActionsEl.replaceChildren();
            return;
        }
        this.rootDirNameEl.textContent = this.state.currentDirHandle.name;
        if (this.sidebarHeaderActionsEl) {
            this.sidebarHeaderActionsEl.innerHTML =
                '<span class="directory-clear" data-action="refresh-folder" title="Refresh tree">⟳</span>' +
                '<span class="directory-clear" data-action="clear-folder">⌫</span>';
        }
    }
    highlightActive() {
        if (!this.container) return;
        this.container.querySelectorAll('.tree-row.active,.tree-row.active-dir').forEach(el => el.classList.remove('active','active-dir'));
        if (this.state.activeFilePath) {
            const el = this.container.querySelector(`.tree-row[data-path="${CSS.escape(this.state.activeFilePath)}"]`);
            if (el) el.classList.add('active');
        }
        if (this.#activeDirectoryPath) {
            const dirEl = this.container.querySelector(`.tree-row[data-path="${CSS.escape(this.#activeDirectoryPath)}"]`);
            if (dirEl) dirEl.classList.add('active-dir');
        }
    }
    clear() {
        if (this.container) this.container.replaceChildren();
    }

    bindContainerEvents(callbacks) {
        const { showContextMenu, parentDirPath } = callbacks;
        this.container.addEventListener('click', e => {
            if (!e.target.closest('.tree-row')) {
                this.setActiveDirectory(null);
            }
        });
        this.container.addEventListener('dragover', e => {
            if (!e.dataTransfer.types.includes('application/x-tree-path')) return;
            if (e.target.closest('.tree-row')) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.container.classList.add('drop-target');
        });
        this.container.addEventListener('dragleave', () => this.container.classList.remove('drop-target'));
        this.container.addEventListener('drop', e => {
            this.container.classList.remove('drop-target');
            if (e.target.closest('.tree-row')) return;
            e.preventDefault();
            const srcPath = e.dataTransfer.getData('application/x-tree-path');
            if (srcPath) this.fs.moveEntry(srcPath, '');
        });
        this.container.addEventListener('contextmenu', e => {
            const row = e.target.closest('.tree-row');
            if (row && row.dataset.path) {
                const node = this.treeManager.getNode(row.dataset.path);
                if (node) {
                    this.setActiveDirectory(parentDirPath(node));
                    showContextMenu(e, node);
                }
            } else {
                this.setActiveDirectory(null);
                showContextMenu(e, null);
            }
        });
        let longPressTimer = null;
        let touchMoved = false;
        this.container.addEventListener('touchstart', e => {
            this.longPressTriggered = false;
            touchMoved = false;
            const touch = e.touches[0];
            const target = e.target;
            longPressTimer = setTimeout(() => {
                this.longPressTriggered = true;
                const fakeEvent = { preventDefault() {}, clientX: touch.clientX, clientY: touch.clientY };
                const row = target.closest('.tree-row');
                if (row && row.dataset.path) {
                    const node = this.treeManager.getNode(row.dataset.path);
                    if (node) {
                        this.setActiveDirectory(parentDirPath(node));
                        showContextMenu(fakeEvent, node);
                    }
                } else {
                    this.setActiveDirectory(null);
                    showContextMenu(fakeEvent, null);
                }
            }, 600);
        }, { passive: true });
        this.container.addEventListener('touchend', e => {
            clearTimeout(longPressTimer);
            if (this.longPressTriggered) {
                e.preventDefault();
                return;
            }
            if (!touchMoved) {
                const target = e.target;
                const el = target.closest('.tree-row');
                if (el) {
                    e.preventDefault();
                    el.click();
                }
            }
        });
        this.container.addEventListener('touchmove', () => { clearTimeout(longPressTimer); touchMoved = true; }, { passive: true });
    }
}

// TreeManager – file tree data layer + view orchestrator
// ────────────────────────────────────────────────────────
class TreeManager {
    #fileTree = null;
    #nodeByPath = new Map();
    #views = [];
    /** @param {ReactiveState} state @param {FileSystemManager} fs */
    constructor(state, fs) {
        this.state = state;
        this.fs = fs;
    }
    get fileTree() { return this.#fileTree; }
    set fileTree(v) { this.#fileTree = v; }
    getNode(path) { return this.#nodeByPath.get(path); }
    registerNode(path, node) { this.#nodeByPath.set(path, node); }

    addView(view) {
        view.treeManager = this;
        this.#views.push(view);
        return view;
    }
    removeView(view) {
        const idx = this.#views.indexOf(view);
        if (idx >= 0) this.#views.splice(idx, 1);
    }
    get views() { return this.#views; }
    get primaryView() { return this.#views[0] || null; }

    render() { this.#views.forEach(v => v.render()); }
    updateHeader() { this.#views.forEach(v => v.updateHeader()); }
    highlightActive() { this.#views.forEach(v => v.highlightActive()); }
    clear() {
        this.#fileTree = null;
        this.#nodeByPath.clear();
        this.#views.forEach(v => v.clear());
    }
}

                            this.extensions.push({ key: keys[i], name: meta.name, types: meta.types, mode: meta.mode, handle, html });

        const before = textarea ? textarea.value.substring(0, pos) : '';
        const lines = before.split('\n');

        const atMax = slider ? +slider.value >= +slider.max : true;

        if (tab._splitHandle) { tab._splitHandle.remove(); tab._splitHandle = null; }

    #setupSplitLayout(tab, iframe) {
        const wrapper = document.querySelector('.editor-wrapper');
        wrapper.classList.add('split-mode');

        const handle = document.createElement('div');
        handle.className = 'split-handle';
        wrapper.appendChild(handle);

        const rightPane = document.createElement('div');
        rightPane.className = 'split-right';
        rightPane.appendChild(iframe);
        wrapper.appendChild(rightPane);

        tab._splitHandle = handle;
        tab._splitRight = rightPane;

        this.#bindSplitDrag(handle, wrapper);

    #applySplitRatio(wrapper) {
        const textarea = document.getElementById('textarea');
        const gutter = document.getElementById('gutter');
        const gutterW = gutter.offsetWidth || 0;
        const totalW = wrapper.clientWidth;
        const savedRatio = parseFloat(localStorage.getItem('splitPaneRatio'));
        const ratio = (!isNaN(savedRatio) && savedRatio > 0.15 && savedRatio < 0.85) ? savedRatio : 0.5;
        const textareaW = Math.max(100, Math.round(ratio * totalW) - gutterW);

    #bindSplitDrag(handle, wrapper) {
        let dragging = false;
        handle.addEventListener('pointerdown', e => {
            e.preventDefault();

            handle.classList.add('dragging');
            handle.setPointerCapture(e.pointerId);
        });
        handle.addEventListener('pointermove', e => {
            if (!dragging) return;
            const rect = wrapper.getBoundingClientRect();
            const ratio = Math.min(0.85, Math.max(0.15, (e.clientX - rect.left) / rect.width));
            localStorage.setItem('splitPaneRatio', ratio.toString());
            this.#applySplitRatio(wrapper);

        handle.addEventListener('pointerup', stop);
        handle.addEventListener('lostpointercapture', stop);
    }
    /** Send updated editor:state to the active extension iframe */
    sendStateToExtension(tab) {

        try {
            tab.extFrame.contentWindow.postMessage(this.#buildStatePayload(tab), '*');
        } catch (e) {}
    }
}

// TabManager – tab creation, switching & closing

class TabManager {

        legend: { canSave: false, canDirty: false },
        settings: { canSave: false, canDirty: false },
        text: { canSave: true, canDirty: true },
        extension: { canSave: true, canDirty: true }

                extToggle.className = 'ext-toggle inactive';
                if (tab.extFrame) tab.extFrame.classList.add('hidden');
                document.getElementById('extension-overlay').classList.add('hidden');
                tab._pendingTypeSwitch = true;
                this.switchToTab(tab.id);

            extToggle.title = 'Toggle extension: ' + ext.name;
            extToggle.textContent = ext.name;

            let longPressTriggered = false;
            extToggle.addEventListener('pointerdown', () => {
                longPressTriggered = false;

                    longPressTriggered = true;

                    await this.extensions.uninstall(ext.name);

                    let currentTabWasExtension = false;

                            t.extension = null;
                            t.extensionMode = null;

                    extToggle.title = 'Toggle extension: ' + newExt.name;

	#replaceExtToggle(tab) {

  		const oldToggle = tab.element.querySelector('.ext-toggle');
  		if (!oldToggle) return;

    updateTabPaths(oldPath, newPath, updatedHandle, newName = null) {

                tab.path = newPath;
                tab.handle = updatedHandle;
                if (newName != null) {
                    tab.name = newName;
                    if (tab.element) tab.element.querySelector('.tab-name').textContent = newName;
                    if (tab.type === 'text' || tab.type === 'extension') {
                        const ext = this.extensions.getForFile(newName);
                        const newType = ext ? 'extension' : 'text';
                        if (newType !== tab.type) {
                            tab.type = newType;
                            tab.extension = ext || null;
                            tab.extensionMode = ext ? (ext.mode || 'full') : null;
                            if (tab.extFrame && newType === 'text') {

                                tab.extFrame = null;
                            }

                            }
                            if (tab._splitRight && newType === 'text') {
                                tab._splitRight.remove(); tab._splitRight = null;

                                if (existingToggle) existingToggle.remove();

                let handle = dirHandle;
                for (let i = 0; i < parts.length - 1; i++) {
                    handle = await handle.getDirectoryHandle(parts[i]);
                }
                const fileHandle = await handle.getFileHandle(parts[parts.length - 1]);
                const file = await fileHandle.getFile();
                if (file.size > this.fs.maxFileSize) { continue; }
                const content = await file.text();
                await this.createNewTab(fileHandle, st.name, content, st.path, st.type || 'text');

	async restoreOpenTabs(dirHandle, savedTabs) {

	  const { restored, activeTabPath } = await this.#tryOpenSavedTabs(dirHandle, savedTabs);

	  if (activeTabPath) {
	    const activeTab = this.state.tabs.find(t => t.path === activeTabPath);
	    if (activeTab) this.switchToTab(activeTab.id);

    /**

     * type 'extension'; tabs whose extension was uninstalled are
     * demoted to 'text'.
     */
    reattachExtensions() {
        for (const tab of this.state.tabs) {
            const ext = this.extensions.getForFile(tab.name);
            if (ext) {
                tab.extension = ext;
                tab.extensionMode = ext.mode || 'full';
                if (tab.type !== 'extension') {
                    tab.type = 'extension';
                }
                this.#replaceExtToggle(tab);
            } else if (tab.type === 'extension') {
                // Extension no longer available — fall back to text
                tab.extension = null;
                tab.extensionMode = null;
                tab.type = 'text';
                if (tab.extFrame) { tab.extFrame.remove(); tab.extFrame = null; }
                this.#replaceExtToggle(tab);
            }

        const active = this.state.getActiveTab();
        if (active) this.switchToTab(active.id);

const DEBUG_RESTORE = localStorage.getItem('DEBUG_RESTORE') === '1';
function logRestore(...args) { if (DEBUG_RESTORE) console.log('[restore]', ...args); }

// ────────────────────────────────────────────────────────
// PermissionCoordinator – single place for FS permission flow
// ────────────────────────────────────────────────────────
class PermissionCoordinator {
    #fs; #state;
    constructor(fs, state) { this.#fs = fs; this.#state = state; }

    /** Returns true if the current dir handle has readwrite permission. */
    async hasPermission() {
        if (!this.#state.currentDirHandle) return false;
        const perm = await this.#fs.queryPermission(this.#state.currentDirHandle);
        return perm === 'granted';
    }

    /**
     * Emits the permission-needed event and shows an action-toast.
     * When the user taps, calls onGranted() after a successful requestPermission.
     * @param {() => Promise<void>} onGranted
     */
    handleLostPermission(onGranted) {
        bus.emit('restore:permission-needed');
        bus.emit('ui:action-toast', 'Tap to restore folder access', async () => {
            try {
                const result = await this.#state.currentDirHandle.requestPermission({ mode: 'readwrite' });
                if (result === 'granted') {
                    await onGranted();
                    bus.emit('ui:toast', 'Folder access restored ✓');
                } else {
                    bus.emit('ui:toast', 'Access was not granted');
                }
            } catch {
                bus.emit('ui:toast', 'Failed to restore access');
            }
        });
    }
}

// ────────────────────────────────────────────────────────
// StateRestoreManager – wake / restore / snapshot lifecycle
//   State machine: idle → snapshotting (on hide/blur/freeze)
//                  idle → restoring   (on any wake signal)
// ────────────────────────────────────────────────────────
class StateRestoreManager {
    // ── State machine ─────────────────────────────────────
    #state = 'idle';           // 'idle' | 'snapshotting' | 'restoring'
    #lastSnapshotAt = 0;
    #restoreInProgress = null; // Promise | null — ensures re-entrant calls queue safely

    // ── Helpers ───────────────────────────────────────────
    #permCoord;

    /** @param {ReactiveState} state @param {FileSystemManager} fs @param {TabManager} tabs @param {TreeManager} tree @param {ExtensionManager} extensions */
    constructor(state, fs, tabs, tree, extensions) {
        this.state = state;
        this.fs = fs;
        this.tabs = tabs;
        this.tree = tree;
        this.extensions = extensions;
        this.#permCoord = new PermissionCoordinator(fs, state);
    }

    // ── State machine ──────────────────────────────────────
    #transition(to) {
        logRestore(`${this.#state} → ${to}`);
        this.#state = to;
    }

    // ── Public API (single entry point) ───────────────────
    /**
     * Single public entry point for ALL wake and cold-start restore signals.
     * Calling this while a restore is already in progress returns the same
     * in-flight promise — making every caller re-entrant-safe.
     * @param {string} [reason]
     */
    async ensureRestored(reason = 'unknown') {
        if (this.#restoreInProgress) {
            logRestore(`ensureRestored(${reason}) — queued behind in-progress restore`);
            return this.#restoreInProgress;
        }
        logRestore(`ensureRestored(${reason}) — begin`);
        this.#transition('restoring');
        bus.emit('restore:started', reason);
        this.#restoreInProgress = this.#doRestore(reason)
            .finally(() => {
                this.#restoreInProgress = null;
                this.#transition('idle');
                bus.emit('restore:completed', reason);
                logRestore(`ensureRestored(${reason}) — completed`);
            });
        return this.#restoreInProgress;
    }

    /** Bind all lifecycle event listeners — called once from UIManager.bindEvents() */
    bindLifecycle() {
        window.addEventListener('pageshow', async (e) => {
            if (e.persisted || document.wasDiscarded) await this.ensureRestored('pageshow');
        });
        document.addEventListener('freeze', () => {
            this.#snapshotState();
        });
        document.addEventListener('resume', () => this.ensureRestored('resume'));
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                await this.ensureRestored('visibility');
            } else {
                this.#snapshotState();
            }
        });
        window.addEventListener('blur', () => {
            this.#snapshotState();
        });
        window.addEventListener('focus', async () => {
            await this.ensureRestored('focus');
        });
        window.addEventListener('beforeunload', e => {
            // Snapshot only — never start a restore from beforeunload
            this.#snapshotState();
            if (this.state.tabs.some(t => t.dirty)) {
                e.preventDefault();
                return e.returnValue = 'Unsaved changes will be lost';
            }
        });
    }

    // ── Core restore sequence ─────────────────────────────
    async #doRestore(reason) {
        // Small fixed delay only for page-discard: the FS API needs a moment
        // to re-initialize handles after the browser discards the page.
        if (document.wasDiscarded) await new Promise(r => setTimeout(r, 300));

        // Step 1: Load extensions (always, regardless of folder state)
        await this.extensions.loadAll();

        // No dir handle — attempt cold-start restore from the persisted folder
        if (!this.state.currentDirHandle) {
            const saved = await this.fs.loadSavedFolder();
            if (saved.status === 'granted') {
                this.state.currentDirHandle = saved.handle;
                await this.#rebuildTree(saved.handle);
                await this.#restoreTabs(saved.handle);
            } else if (saved.status === 'needs-auth') {
                this.#handlePendingAuth(saved.handle);
                return;
            }
            if (!this.state.tabs.length) {
                await this.tabs.createNewTab(null, 'welcome.txt', window.WELCOME, null, 'welcome');
            }
            return;
        }

        // Dir handle exists — re-validate permission before doing any FS work
        const permOk = await this.#permCoord.hasPermission();
        if (!permOk) {
            // handleLostPermission() shows a toast and returns synchronously.
            // #doRestore() returns immediately after via the `return` below, then
            // the finally block in ensureRestored() clears #restoreInProgress and
            // transitions back to 'idle'. When the user taps the toast, calling
            // ensureRestored() again is always safe — either it starts a fresh
            // restore (if idle) or queues behind any concurrent restore in progress.
            this.#permCoord.handleLostPermission(() => this.ensureRestored('manual-permission-grant'));
            return;
        }

        // Permission confirmed — rebuild tree and sync open tabs
        await this.#rebuildAndSync();
    }

    // ── Tree rebuild helpers ───────────────────────────────
    async #rebuildTree(handle) {
        await this.fs.build(handle);
        this.fs.loadExpandedState(); // Must be called before expanding saved paths
        await this.#expandSavedFolders();
        this.tree.render();
        this.tree.updateHeader();
    }

    async #rebuildAndSync() {
        await this.fs.mutateAndRebuild();
        this.tree.highlightActive();

        if (!this.state.tabs.length) {
            await this.#restoreTabs(this.state.currentDirHandle);
            return;
        }

        // Re-attach extensions for all open tabs
        this.tabs.reattachExtensions();

        // Sync active tab content from disk (if clean)
        const textarea = document.getElementById('textarea');
        const activeTab = this.state.getActiveTab();
        if (activeTab?.handle && activeTab.type !== 'extension' && !activeTab.dirty && textarea) {
            try {
                const file = await activeTab.handle.getFile();
                activeTab.content = await file.text();
                if (this.state.currentTabId === activeTab.id) {
                    textarea.value = activeTab.content;
                    bus.emit('editor:lines-changed', true);
                }
            } catch (e) { logRestore('wake tab refresh failed', e); }
        }
    }

    async #restoreTabs(handle) {
        const restored = await this.tabs.restoreOpenTabs(handle);
        if (restored) bus.emit('ui:toast', `Restored ${restored} tab${restored > 1 ? 's' : ''}`);
        if (!this.state.tabs.length) {
            await this.tabs.createNewTab(null, 'welcome.txt', window.WELCOME, null, 'welcome');
        }
    }

    // ── Snapshot (pre-suspend) ─────────────────────────────
    #snapshotState() {
        // Never interrupt an ongoing restore
        if (this.#state === 'restoring') return;
        this.#transition('snapshotting');
        bus.emit('restore:snapshot');
        this.#lastSnapshotAt = Date.now();
        const textarea = document.getElementById('textarea');
        const activeTab = this.state.getActiveTab();
        if (activeTab && activeTab.type !== 'extension' && textarea) {
            activeTab.content = textarea.value;
            activeTab.scrollTop = textarea.scrollTop;
        }
        if (this.state.currentDirHandle) {
            this.fs.saveOpenTabs(this.state.currentTabId);
        }
        this.fs.flushSave().catch(e => logRestore('flush during snapshot failed', e));
        this.#transition('idle');
    }

    // ── Pending auth handler (cold-start, folder not yet authorized) ──
    #handlePendingAuth(handle) {
        const pendingTabs = this.fs.loadOpenTabs();
        bus.emit('ui:action-toast', 'Tap to restore folder access', async () => {
            try {
                if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted') {
                    bus.emit('ui:toast', 'Access was not granted');
                    return;
                }
                this.state.currentDirHandle = handle;
                await this.#rebuildTree(handle);
                const welcomeIdx = this.state.tabs.findIndex(t => t.type === 'welcome');
                if (welcomeIdx !== -1) {
                    this.state.tabs[welcomeIdx].element.remove();
                    this.state.tabs.splice(welcomeIdx, 1);
                }
                const restored = await this.tabs.restoreOpenTabs(handle, pendingTabs);
                if (restored) bus.emit('ui:toast', `Restored ${restored} tab${restored > 1 ? 's' : ''}`);
                else if (!this.state.tabs.length) {
                    await this.tabs.createNewTab(null, 'welcome.txt', window.WELCOME, null, 'welcome');
                }
                bus.emit('ui:toast', 'Folder access restored ✓');
            } catch {
                bus.emit('ui:toast', 'Failed to restore access');
            }
        }, 15000);
    }

    // ── Expand previously saved folder paths ──────────────
    async #expandSavedFolders() {
        for (const path of [...this.state.expandedFolders].sort((a, b) => a.split('/').length - b.split('/').length)) {
            const node = this.tree.getNode(path);
            if (node?.kind === 'directory') await this.fs.loadChildren(node);
        }
    }
}
// ────────────────────────────────────────────────────────
// UIManager – DOM init, events & rendering
// ────────────────────────────────────────────────────────
class UIManager {

    showToast(message, duration = 2800) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = message;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), duration);
    }
    showActionToast(message, callback, duration = 8000) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = message;
        t.style.cssText += 'cursor:pointer;text-decoration:underline;';
        const timer = setTimeout(() => t.remove(), duration);
        t.addEventListener('click', () => { clearTimeout(timer); t.remove(); callback(); });
        document.body.appendChild(t);
    }
    showDialog({promptTitle, subtitle = '', defaultValue = '', isConfirm = false, confirmMessage = '', danger = false} = {}) {
        return new Promise(resolve => {
            const modal = document.createElement('div');
            modal.className = 'dialog-overlay';
            modal.innerHTML = `<div class="dialog-box">` +
                `<div class="dialog-title"></div>` +
                `<div class="dialog-subtitle"></div>` +
                (!isConfirm ? `<input type="text" class="dialog-input">` : '') +
                `<div class="dialog-actions">` +
                `<button class="dialog-btn dialog-btn-ok${danger ? ' danger' : ''}">${isConfirm ? 'Confirm' : 'OK'}</button>` +
                `<button class="dialog-btn">Cancel</button></div></div>`;
            // textContent assignment keeps user-supplied strings free of HTML injection
            modal.firstElementChild.firstElementChild.textContent = isConfirm ? confirmMessage : promptTitle;
            const subtitleEl = modal.firstElementChild.children[1];
            if (subtitle) { subtitleEl.textContent = subtitle; } else { subtitleEl.style.display = 'none'; }
            const input = modal.querySelector('input');
            const [okBtn, cancelBtn] = modal.querySelectorAll('button');
            if (input) input.value = defaultValue;
            document.body.appendChild(modal);
            const confirm = () => { resolve(isConfirm ? true : input.value); modal.remove(); };
            const cancel = () => { resolve(isConfirm ? false : null); modal.remove(); };
            if (input) {
                input.focus(); input.select();
                input.onkeydown = e => { if (e.key === 'Enter') confirm(); if (e.key === 'Escape') cancel(); };
            } else {
                okBtn.focus();
                okBtn.onkeydown = e => { if (e.key === 'Escape') cancel(); };
            }
            okBtn.onclick = confirm;
            cancelBtn.onclick = cancel;
            modal.onclick = e => { if (e.target === modal) cancel(); };
        });
    }
    toggleSidebar() {
        const isCurrentlyHidden = this.#sidebarEl.classList.contains('hidden');
        if (isCurrentlyHidden) {
            const savedWidth = localStorage.getItem('sidebarWidth');
            if (savedWidth) this.#sidebarEl.style.width = savedWidth;
            this.#sidebarEl.classList.remove('hidden');
        } else {
            this.#sidebarEl.style.width = '';
            this.#sidebarEl.classList.add('hidden');
            const rightSidebar = document.getElementById('sidebar-right');
            if (!rightSidebar.classList.contains('hidden')) this.toggleDuplicateSidebar();
        }
        const btn = document.getElementById('sidebar-toggle');
        btn.textContent = this.#sidebarEl.classList.contains('hidden') ? '›' : '‹';
    }
    showContextMenu(e, node) {
        e.preventDefault();
        this.closeContextMenu();
        this.#contextMenuTarget = node;
        this.#contextMenu = document.createElement('div');
        this.#contextMenu.className = 'context-menu';
        const addItem = (label, handler, cls = '') => {
            const item = document.createElement('div');
            item.className = 'context-menu-item' + (cls ? ' ' + cls : '');
            item.textContent = label;
            item.addEventListener('click', () => { handler(); this.closeContextMenu(); });
            this.#contextMenu.appendChild(item);
        };
        const addSeparator = () => {
            const sep = document.createElement('div');
            sep.className = 'context-menu-separator';
            this.#contextMenu.appendChild(sep);
        };
        if (!node) {
            addItem('New File', () => this.fs.newFile());
            addItem('New Folder', () => this.fs.newFolder());
            addSeparator();
            addItem('Open File', () => this.fs.openFile());
            addItem('Open Folder', () => this.fs.openFolder());
            addSeparator();
            addItem('Open legend.txt', () => {
                const existing = this.state.tabs.find(t => t.type === 'legend');
                if (existing) {
                    this.tabs.switchToTab(existing.id);
                } else {
                    this.tabs.createNewTab(null, 'legend.txt', window.LEGEND, null, 'legend');
                }
            });
            if (this.state.copiedNode) { addSeparator(); addItem('Paste', () => this.fs.copyEntry(this.state.copiedNode, this.state.activeDirectoryPath || '')); }
        } else if (node.kind === 'directory') {
            addItem('New File', () => this.fs.newFile(undefined, node));
            addItem('New Folder', () => this.fs.newFolder(undefined, node));
            addSeparator();
            addItem('Rename', () => this.fs.renameItem(node));
            addItem('Copy', () => { this.state.copiedNode = node; this.showToast(`"${node.name}" ready to paste`); });
            if (this.state.copiedNode) addItem('Paste', () => this.fs.copyEntry(this.state.copiedNode, node.path));
            addSeparator();
            addItem('Delete Folder', () => this.fs.deleteFolder(node), 'danger');
        } else {
            addItem('Open', () => this.fs.openFileFromNode(node));
            addItem('Open in browser', () => this.fs.openInBrowser(node));
            addItem('Rename', () => this.fs.renameItem(node));
            addItem('Copy', () => { this.state.copiedNode = node; this.showToast(`"${node.name}" ready to paste`); });
            addSeparator();
            addItem('Delete File', () => this.fs.deleteFile(node), 'danger');
        }
        this.#contextMenu.style.left = e.clientX + 'px';
        this.#contextMenu.style.top = e.clientY + 'px';
        document.body.appendChild(this.#contextMenu);
        const rect = this.#contextMenu.getBoundingClientRect();
        if (rect.right > window.innerWidth) this.#contextMenu.style.left = (window.innerWidth - rect.width - 8) + 'px';
        if (rect.bottom > window.innerHeight) this.#contextMenu.style.top = (window.innerHeight - rect.height - 8) + 'px';
    }
    closeContextMenu() {
        if (this.#contextMenu) {
            this.#contextMenu.remove();
            this.#contextMenu = null;
            this.#contextMenuTarget = null;
        }
    }
    /** @param {boolean} [force] - when true, always rerender even if line count unchanged */
    updateLineNumbers(force = false) {
        if (this.state.getActiveTab()?.type === 'settings') {
            this.#gutter.textContent = '';
            return;
        }
        if (force) {
            // Synchronous update when explicitly forced (e.g. tab switch)
            cancelAnimationFrame(this.#lineNumberRafId);
            this.#lineNumberRafId = null;
            const lineCount = (this.#textarea.value.match(/\n/g) || []).length + 1;
            this.#lastLineCount = lineCount;
            this.#gutter.textContent = Array.from({length: lineCount}, (_, i) => i + 1).join('\n');
            return;
        }
        // Batch rapid keystroke updates into a single animation frame
        if (this.#lineNumberRafId) return;
        this.#lineNumberRafId = requestAnimationFrame(() => {
            this.#lineNumberRafId = null;
            const lineCount = (this.#textarea.value.match(/\n/g) || []).length + 1;
            if (lineCount === this.#lastLineCount) return;
            this.#lastLineCount = lineCount;
            this.#gutter.textContent = Array.from({length: lineCount}, (_, i) => i + 1).join('\n');
        });
    }
    updateEditorStatus(tab) {
        const modified = tab.dirty ? ' • Modified' : '';
        if (tab.type === 'settings') {
            this.#statusEl.textContent = `${this.state.tabs.length} tab${this.state.tabs.length !== 1 ? 's' : ''}`;
            this.#editorStatusEl.textContent = '';
            return;
        }
        if (tab.type === 'extension' && tab.extensionMode === 'full') {
            this.#statusEl.textContent = `${this.state.tabs.length} tab${this.state.tabs.length !== 1 ? 's' : ''}`;
        } else {
            const pos = this.#textarea.selectionStart || 0;
            const before = this.#textarea.value.substring(0, pos);
            const lines = before.split('\n');
            const line = lines.length;
            const col = lines[lines.length - 1].length + 1;
            const trimmed = this.#textarea.value.trim();
            const words = trimmed ? trimmed.split(/\s+/).length : 0;
            this.#statusEl.textContent = `Ln ${line}, Col ${col} | ${words} word${words !== 1 ? 's' : ''} | ${this.state.tabs.length} tab${this.state.tabs.length !== 1 ? 's' : ''}`;
        }
        this.#editorStatusEl.textContent = tab.dirty ? '• Modified' : '';
    }
    #showCreateItemDialog() {

    #refreshSettingsExtList() {
        const listEl = document.getElementById('settings-ext-list');
        if (!listEl) return;
        listEl.replaceChildren();
        if (!this.extensions.extensions.length) {
            const empty = document.createElement('div');

            listEl.appendChild(empty);

        }
        for (const ext of this.extensions.extensions) {
            const row = document.createElement('div');
            row.className = 'settings-ext-row';
            const info = document.createElement('div');
            info.className = 'settings-ext-info';
            const name = document.createElement('span');
            name.className = 'settings-ext-name';
            name.textContent = ext.name;
            const types = document.createElement('span');
            types.className = 'settings-ext-types';
            types.textContent = ext.types.join(', ');
            const btn = document.createElement('button');
            btn.className = 'settings-ext-uninstall';
            btn.textContent = 'remove';
            btn.addEventListener('click', async () => {
                if (!await bus.emit('ui:confirm', { confirmMessage: `Uninstall "${ext.name}"?`, danger: true })) return;
                await this.extensions.uninstall(ext.name);
                bus.emit('extension:changed');
                this.#refreshSettingsExtList();
            });
            info.append(name, types);
            row.append(info, btn);
            listEl.appendChild(row);
        }
    }
    bindKeyboard() {
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                e.preventDefault();
                if (this.state.currentTabId) this.tabs.closeTab(this.state.currentTabId);
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                this.fs.saveCurrentFile();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                this.fs.newFile();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
                e.preventDefault();
                this.fs.openFolder();
            }
        });
    }
    #bindViewEvents(view) {
        view.bindContainerEvents({
            showContextMenu: (e, node) => this.showContextMenu(e, node),
            parentDirPath: (node) => this.#parentDirPath(node),
        });
    }

	toggleDuplicateSidebar() {
  const rightSidebar = document.getElementById('sidebar-right');
  const rightResize = document.getElementById('sidebar-right-resize');
  const toggle = document.getElementById('sidebar-dupe-toggle');
  const isCurrentlyHidden = rightSidebar.classList.contains('hidden');

  if (isCurrentlyHidden) {
    // SHOW
    rightSidebar.classList.remove('hidden');
    rightResize.style.display = '';
    toggle.classList.add('active');

    const savedWidth = localStorage.getItem('sidebarRightWidth');
    rightSidebar.style.width = savedWidth || '280px';

    if (!this.#rightView) {
      this.#rightView = new DirectoryTreeView('tree-container-right', this.state, this.fs, 'right');
      this.#rightView.rootDirNameEl = document.getElementById('root-dir-name-right');
      this.#rightView.sidebarHeaderActionsEl = document.getElementById('sidebar-header-actions-right');
      this.tree.addView(this.#rightView);
      this.#bindViewEvents(this.#rightView);
    }
    this.#rightView.render();
    this.#rightView.updateHeader();
  } else {
    rightSidebar.classList.add('hidden');
    rightSidebar.style.width = '';      
    rightResize.style.display = 'none';
    toggle.classList.remove('active');
  }
}
	
    bindTreeEvents() {
        document.getElementById('sidebar-toggle').addEventListener('click', () => this.toggleSidebar());
        document.getElementById('sidebar-root-row').addEventListener('click', e => {
            if (e.target.dataset.action === 'refresh-folder' || e.target.dataset.action === 'clear-folder' || e.target.id === 'sidebar-add-btn') return;
            this.fs.openFolder();
        });
        document.getElementById('sidebar-add-btn').addEventListener('click', e => {
            e.stopPropagation();
            this.#showCreateItemDialog();
        });
        document.getElementById('sidebar-dupe-toggle').addEventListener('click', () => this.toggleDuplicateSidebar());

// ── Unified sidebar resizing (left + right) ──
let resizingSidebar = null; // 'left' | 'right' | null
let resizeStartX = 0, resizeStartW = 0, resizeEl = null;

const startResize = (side, e) => {
  resizingSidebar = side;
  resizeStartX = e.clientX;
  resizeEl = side === 'left' 
    ? this.#sidebarEl 
    : document.getElementById('sidebar-right');
  
  resizeStartW = resizeEl.offsetWidth;
  resizeEl.style.transition = 'none';
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
};

const handleResizeMove = (e) => {
  if (!resizingSidebar || !resizeEl) return;
  const delta = e.clientX - resizeStartX;
  const newWidth = Math.max(150, Math.min(600, resizeStartW + delta));
  resizeEl.style.width = `${newWidth}px`;
};

const handleResizeEnd = () => {
  if (!resizingSidebar) return;
  const wasLeft = resizingSidebar === 'left';
  
  if (resizeEl) resizeEl.style.transition = '';
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  
  const widthKey = wasLeft ? 'sidebarWidth' : 'sidebarRightWidth';
  localStorage.setItem(widthKey, (resizeEl?.offsetWidth || 280) + 'px');
  
  resizingSidebar = null;
  resizeEl = null;
};

// Attach handlers once
document.getElementById('sidebar-resize').addEventListener('mousedown', e => startResize('left', e));
document.getElementById('sidebar-right-resize').addEventListener('mousedown', e => startResize('right', e));

document.addEventListener('mousemove', handleResizeMove);
document.addEventListener('mouseup', handleResizeEnd);

		
        // Bind container events via DirectoryTreeView
        this.#bindViewEvents(this.#leftView);
        document.addEventListener('click', e => {
            if (e.target.dataset.action === 'clear-folder') { e.stopPropagation(); this.fs.clearSavedFolder(); return; }
            if (e.target.dataset.action === 'refresh-folder') {
                e.stopPropagation();
                if (this.state.currentDirHandle) this.fs.mutateAndRebuild();
                return;
            }
            if (!e.target.closest('.context-menu')) this.closeContextMenu();
        });
    }
    bindTabEvents() {
        // Allow dropping a tab past the last tab (append to end)
        this.#tabsContainer.addEventListener('dragover', e => {
            if (!e.dataTransfer.types.includes('text/plain')) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });
        this.#tabsContainer.addEventListener('drop', e => {
            e.preventDefault();
            const draggedId = parseInt(e.dataTransfer.getData('text/plain'), 10);
            if (isNaN(draggedId)) return;
            const fromIdx = this.state.tabs.findIndex(t => t.id === draggedId);
            if (fromIdx === -1) return;
            const movedTab = this.state.tabs[fromIdx];
            this.state.tabs.splice(fromIdx, 1);
            this.state.tabs.push(movedTab);
            this.#tabsContainer.appendChild(movedTab.element);
            this.fs.saveOpenTabs(this.state.currentTabId);
        });
        this.#textarea.addEventListener('input', () => {
            bus.emit('editor:lines-changed');
            if (this.state.currentTabId) {
                const tab = this.state.tabs.find(t => t.id === this.state.currentTabId);
                if (tab) {
                    if (TabManager.canTabBeDirty(tab.type)) {
                        tab.dirty = true;
                        if (tab.element) tab.element.querySelector('.dirty-indicator').style.visibility = 'visible';
                        this.fs.scheduleSave();
                    }
                    bus.emit('tab:status-update', tab);
                    // Send updated state to overlay/split extensions on every input
                    if (tab.type === 'extension' && (tab.extensionMode === 'overlay' || tab.extensionMode === 'split')) {
                        tab.content = this.#textarea.value;
                        this.extensions.sendStateToExtension(tab);
                    }
                }
			if (tab?.type === 'extension' || this.#textarea.style.display === 'none') return;	
            } else if (this.state.currentDirHandle && this.#textarea.value && !this.#creatingUntitled) {
                this.#creatingUntitled = true;
                const typed = this.#textarea.value;
                const cursor = this.#textarea.selectionStart;
                this.fs.createUntitledFile().then(tab => {
                    this.#creatingUntitled = false;
                    if (tab) {
                        this.#textarea.value = typed;
                        tab.content = typed;
                        tab.dirty = true;
                        const ind = tab.element?.querySelector('.dirty-indicator');
                        if (ind) ind.style.visibility = 'visible';
                        this.#textarea.selectionStart = this.#textarea.selectionEnd = cursor;
                        this.fs.scheduleSave();
                        bus.emit('tab:status-update', tab);
                        bus.emit('editor:lines-changed');
                    }
                }).catch(() => { this.#creatingUntitled = false; });
            }
        });
        this.#textarea.addEventListener('paste', () => {
            setTimeout(() => bus.emit('editor:lines-changed'), 0);
        });
        const overlayEl = document.getElementById('extension-overlay');
        this.#textarea.addEventListener('scroll', () => {
            this.#gutter.scrollTop = this.#textarea.scrollTop;
            // Sync overlay extension scroll
            if (!overlayEl.classList.contains('hidden')) {
                overlayEl.scrollTop = this.#textarea.scrollTop;
            }
        });
        // Send state to overlay/split extension on cursor position changes
        const sendOverlayState = () => {
            const tab = this.state.getActiveTab();
            if (tab?.type === 'extension' && (tab.extensionMode === 'overlay' || tab.extensionMode === 'split')) {
                this.extensions.sendStateToExtension(tab);
            }
        };
        this.#textarea.addEventListener('keyup', sendOverlayState);
        this.#textarea.addEventListener('click', sendOverlayState);
        this.#textarea.addEventListener('keydown', e => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.#textarea.selectionStart;
                const end = this.#textarea.selectionEnd;
                this.#textarea.value = this.#textarea.value.substring(0, start) + '\t' + this.#textarea.value.substring(end);
                this.#textarea.selectionStart = this.#textarea.selectionEnd = start + 1;
                this.#textarea.dispatchEvent(new Event('input'));
            }
        });
        const slider = document.getElementById('width-slider');
        const valueEl = document.getElementById('width-value');
        const MIN_CHARS = 24, MAX_CHARS = 200, MOBILE_SLIDER_MAX = 100;
        /* On mobile, map slider 0-100 through a quadratic curve so the narrow
           end of the range gets more travel and the slider feels responsive
           across its full width instead of only moving something at the far edge. */
        const isMobile = () => window.matchMedia('(max-width: 768px)').matches;
        const sliderToChars = v => {
            if (!isMobile()) return v;
            /* quadratic: 0→24ch, 50→68ch, 100→200ch(∞) */
            return Math.round(MIN_CHARS + (MAX_CHARS - MIN_CHARS) * Math.pow(v / MOBILE_SLIDER_MAX, 2));
        };
        if (isMobile()) { slider.min = 0; slider.max = MOBILE_SLIDER_MAX; slider.value = MOBILE_SLIDER_MAX; }
        slider.addEventListener('input', e => {
            const v = sliderToChars(+e.target.value);
            const atMax = isMobile() ? +e.target.value === MOBILE_SLIDER_MAX : +e.target.value === MAX_CHARS;
            valueEl.textContent = atMax ? '∞' : `${v} ch`;
            if (atMax) {
                this.#textarea.style.maxWidth = 'none';
                this.#textarea.style.minWidth = 'auto';
                this.#textarea.style.whiteSpace = 'pre';
                this.#textarea.style.wordWrap = 'normal';
            } else {
                const chWidth = v + 'ch';
                this.#textarea.style.maxWidth = chWidth;
                this.#textarea.style.minWidth = chWidth; /* forces the wrap to move at every value */
                this.#textarea.style.whiteSpace = 'pre-wrap';
                this.#textarea.style.wordWrap = 'break-word';
            }
            // Notify overlay/split extension of line-width change
            const tab = this.state.getActiveTab();
            if (tab?.type === 'extension' && (tab.extensionMode === 'overlay' || tab.extensionMode === 'split')) {
                this.extensions.sendStateToExtension(tab);
            }
        });
      slider.dispatchEvent(new Event('input'));
    }
    bindSettings() {
        // Open settings tab (or focus it if already open)
        document.getElementById('tab-settings-btn').addEventListener('click', () => {
            const existing = this.state.tabs.find(t => t.type === 'settings');
            if (existing) { this.tabs.switchToTab(existing.id); return; }
            this.tabs.createNewTab(null, 'settings', '', null, 'settings');
        });
        // Toggle width slider
        document.getElementById('settings-toggle-slider').addEventListener('click', e => {
            const sliderEl = document.getElementById('line-width-slider');
            const nowHidden = sliderEl.classList.toggle('hidden');
            e.currentTarget.classList.toggle('active', !nowHidden);
            localStorage.setItem('sliderVisible', !nowHidden);
        });
        // Toggle gutter
        document.getElementById('settings-toggle-gutter').addEventListener('click', () => {
            const nowHidden = this.#gutter.classList.toggle('hidden');
            document.getElementById('settings-toggle-gutter').classList.toggle('active', !nowHidden);
            localStorage.setItem('gutterVisible', !nowHidden);
        });
        // Toggle ext-toggle visibility
        document.getElementById('settings-toggle-ext').addEventListener('click', e => {
            const nowHidden = this.#tabsContainer.classList.toggle('hide-ext');
            e.currentTarget.classList.toggle('active', !nowHidden);
            localStorage.setItem('extToggleVisible', !nowHidden);
        });
        // Font size
        const MIN_FONT = 10, MAX_FONT = 24, DEFAULT_FONT_SIZE = 14;
        const applyFontSize = sz => {
            this.#textarea.style.fontSize = sz + 'px';
            this.#gutter.style.fontSize = sz + 'px';
            document.getElementById('settings-font-val').textContent = sz;
            document.getElementById('settings-font-lbl').style.fontSize = sz + 'px';
        };
        document.getElementById('settings-font-decrease').addEventListener('click', () => {
            const cur = parseInt(this.#textarea.style.fontSize) || DEFAULT_FONT_SIZE;
            if (cur > MIN_FONT) {
                const next = cur - 1;
                applyFontSize(next);
                localStorage.setItem('editorFontSize', next);
            }
        });
        document.getElementById('settings-font-increase').addEventListener('click', () => {
            const cur = parseInt(this.#textarea.style.fontSize) || DEFAULT_FONT_SIZE;
            if (cur < MAX_FONT) {
                const next = cur + 1;
                applyFontSize(next);
                localStorage.setItem('editorFontSize', next);
            }
        });
        document.getElementById('settings-font-reset').addEventListener('click', () => {
            applyFontSize(DEFAULT_FONT_SIZE);
            localStorage.setItem('editorFontSize', DEFAULT_FONT_SIZE);
        });
        // Layout alignment
        document.querySelectorAll('input[name="layout-align"]').forEach(r => {
            r.addEventListener('change', e => {
                document.querySelector('.editor-wrapper').classList.toggle('centered', e.target.value === 'center');
                localStorage.setItem('layoutAlign', e.target.value);
            });
        });
    }
bindEvents() {
    // Bus listeners — central nervous system for cross-component messages
    bus.on('ui:toast', (msg, dur) => this.showToast(msg, dur));
    bus.on('ui:action-toast', (msg, cb, dur) => this.showActionToast(msg, cb, dur));
    bus.on('ui:close-context-menu', () => this.closeContextMenu());
    bus.on('ui:sidebar-auto-close', () => {
        if (this.#isMobile && !this.#sidebarEl.classList.contains('hidden')) this.toggleSidebar();
    });
    bus.on('tab:status-update', tab => {
        if (tab) this.updateEditorStatus(tab);
        else this.#editorStatusEl.textContent = 'No file open';
        if (tab?.type === 'settings') this.#refreshSettingsExtList();
    });
    bus.on('editor:lines-changed', force => this.updateLineNumbers(force));
    bus.on('ui:confirm', opts => this.showDialog({ ...opts, isConfirm: true }));
    bus.on('ui:prompt', opts => this.showDialog(opts));

    this.bindKeyboard();
    this.bindTreeEvents();
    this.bindTabEvents();
    this.bindSettings();
    this.restoreManager.bindLifecycle();

window.addEventListener('message', async e => {
  if (!e.data || typeof e.data !== 'object') return;
  const activeTab = this.state.getActiveTab();
  if (!activeTab || activeTab.type !== 'extension') return;

  if (e.data.type === 'extension:updated') {
    const newContent = e.data.content ?? '';
    // Only mark dirty if content actually changed
    if (newContent !== activeTab.content) {
      // For overlay/split mode, sync textarea first so state is consistent
      if ((activeTab.extensionMode === 'overlay' || activeTab.extensionMode === 'split') && this.#textarea) {
        this.#textarea.value = newContent;
        bus.emit('editor:lines-changed');
      }

      activeTab.content = newContent;
      activeTab.dirty = true;

      if (activeTab.element) {
        const ind = activeTab.element.querySelector('.dirty-indicator');
        if (ind) ind.style.visibility = 'visible';
      }

      this.fs.scheduleSave();
    }

    // Update cursor position for overlay/split mode if provided
    if ((activeTab.extensionMode === 'overlay' || activeTab.extensionMode === 'split') && this.#textarea) {
      if (e.data.cursorLine != null && e.data.cursorCol != null && e.data.cursorLine > 0) {
        const lines = newContent.split('\n');
        let pos = 0;
        for (let i = 0; i < Math.min(e.data.cursorLine - 1, lines.length); i++) {
          pos += lines[i].length + 1;
        }
        pos += Math.min(Math.max(e.data.cursorCol - 1, 0), (lines[e.data.cursorLine - 1] || '').length);
        this.#textarea.selectionStart = this.#textarea.selectionEnd = pos;
      }
    }

    bus.emit('tab:status-update', activeTab);
  }
  // Silently ignore old extension:save messages for backward compatibility
});
}
}	
// ────────────────────────────────────────────────────────
// EditorApp – orchestrator
// ────────────────────────────────────────────────────────
class EditorApp {
    constructor() {
        this.state = new ReactiveState();
        this.fs = new FileSystemManager(this.state);
        this.tree = new TreeManager(this.state, this.fs);
        this.extensions = new ExtensionManager(this.state, this.fs);
        this.tabs = new TabManager(this.state, this.fs, this.extensions);
        this.restore = new StateRestoreManager(this.state, this.fs, this.tabs, this.tree, this.extensions);
        this.ui = new UIManager(this.state, this.tabs, this.tree, this.fs, this.extensions, this.restore);
        // Wire cross-references (reduced via EventBus)
        this.fs.tree = this.tree;
        this.fs.tabs = this.tabs;
    }
    async init() { await this.ui.init(); }
}
// Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}

window.onload = async () => { window.editorApp = new EditorApp(); await window.editorApp.init(); };
