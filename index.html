<script>
'use strict';
const App = (() => {
    // ──────────────────────────────────────────────
    // STATE
    // ──────────────────────────────────────────────
    let currentDirHandle = null;
    let tabs = [];
    let currentTabId = null;
    let nextTabId = 1;
    let expandedFolders = new Set();
    let contextMenu = null;
    let contextMenuTarget = null;
    let saveTimer = null;
    let saveInProgress = false;
    let isMobile = window.innerWidth <= 768;
    let lastLineCount = 1;
    let longPressTriggered = false;
    let activeFilePath = null;
    let activeDirectoryPath = null;
    // DOM references
    let textarea, gutter, tabsContainer, treeContainer, sidebarHeader, sidebarEl, statusEl, editorStatusEl, activeDirNameEl, rootDirNameEl, sidebarHeaderActionsEl;
    const TEXT_FILE_EXTENSIONS = /\.(txt|md|js|ts|html|css|json|py|go|rs|jsx|tsx|vue|xml|yaml|yml|toml|sh|bash|sql)$/i;
    const INVALID_FILENAME_CHARS = /[<>:"|?*\x00-\x1F]/;
    // ──────────────────────────────────────────────
    // FSA – file system, IndexedDB & all file operations
    // ──────────────────────────────────────────────
    const FSA = {
        db: null,
        async initDB() {
            if (this.db) return;
            return new Promise(resolve => {
                const req = indexedDB.open('FileEditor', 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore('handles');
                req.onsuccess = e => { this.db = e.target.result; resolve(); };
                req.onerror = () => resolve();
            });
        },
        async queryPermission(handle) {
            if (!handle) return 'denied';
            try { return await handle.queryPermission({ mode: 'readwrite' }); } catch { return 'denied'; }
        },
        async ensureRW(handle) {
            if (!handle) throw new Error('No handle');
            let state = await this.queryPermission(handle);
            if (state === 'granted') return handle;
            state = await handle.requestPermission({ mode: 'readwrite' });
            if (state !== 'granted') throw new Error('Write permission denied');
            return handle;
        },
        async reauthorize(handle) {
            await this.ensureRW(handle);
            currentDirHandle = handle;
            return handle;
        },
        async saveFolderHandle(handle) {
            await this.initDB();
            const tx = this.db.transaction('handles', 'readwrite');
            tx.objectStore('handles').put(handle, 'main');
        },
        async loadSavedFolder() {
            await this.initDB();
            return new Promise(resolve => {
                const tx = this.db.transaction('handles');
                const req = tx.objectStore('handles').get('main');
                req.onsuccess = async () => {
                    const handle = req.result;
                    if (!handle) return resolve({ status: 'none' });
                    const perm = await this.queryPermission(handle);
                    resolve(perm === 'granted' ? { status: 'granted', handle } : { status: 'needs-auth', handle });
                };
                req.onerror = () => resolve({ status: 'none' });
            });
        },
        async clearSavedFolder() {
            if (this.db) {
                const tx = this.db.transaction('handles', 'readwrite');
                tx.objectStore('handles').delete('main');
            }
            currentDirHandle = null;
            activeDirectoryPath = null;
            expandedFolders.clear();
            localStorage.removeItem('expandedFolders');
            localStorage.removeItem('openTabs');
            TreeManager.clear();
            TreeManager.updateHeader();
        },
        async isSameEntry(h1, h2) {
            if (!h1 || !h2) return false;
            if (h1.isSameEntry) return await h1.isSameEntry(h2);
            try {
                if (h1.kind === 'file' && h2.kind === 'file') {
                    const [f1, f2] = await Promise.all([h1.getFile(), h2.getFile()]);
                    return f1.name === f2.name && f1.size === f2.size && f1.lastModified === f2.lastModified;
                }
                return h1.name === h2.name && h1.kind === h2.kind;
            } catch { return false; }
        },
        async writeFile(handle, content) {
            const writable = await handle.createWritable();
            await writable.write(content);
            await writable.close();
        },
        async resolvePath(baseHandle, pathStr = '') {
            if (!baseHandle) throw new Error('No base handle');
            if (!pathStr || pathStr === '/') {
                return { handle: baseHandle, parent: baseHandle, name: baseHandle.name, path: '/' };
            }
            const parts = pathStr.split('/').filter(Boolean);
            let current = baseHandle;
            let parent = baseHandle;
            const name = parts[parts.length - 1];
            for (let i = 0; i < parts.length - 1; i++) {
                current = await current.getDirectoryHandle(parts[i]);
                parent = current;
            }
            return { handle: current, parent, name, path: pathStr };
        },
        // ── LAZY TREE LOADING (new core) ──
        async loadChildren(dirNode) {
            if (dirNode.kind !== 'directory' || dirNode.childrenLoaded) return;
            dirNode.children = [];
            try {
                const entries = [];
                for await (const [name, handle] of dirNode.handle.entries()) {
                    if (name.startsWith('.') || name === 'node_modules' || name === '__pycache__') continue;
                    entries.push([name, handle]);
                }
                entries.sort(([aName, aHandle], [bName, bHandle]) => {
                    if (aHandle.kind !== bHandle.kind) return aHandle.kind === 'directory' ? -1 : 1;
                    return aName.localeCompare(bName, undefined, { numeric: true });
                });
                for (const [name, handle] of entries) {
                    const childPath = dirNode.path === '/' ? name : `${dirNode.path}/${name}`;
                    const childNode = handle.kind === 'directory' ?
                        { name, kind: 'directory', handle, path: childPath, children: [], childrenLoaded: false } :
                        { name, kind: 'file', handle, path: childPath };
                    TreeManager.registerNode(childPath, childNode);
                    dirNode.children.push(childNode);
                }
            } catch (e) {
                console.error(`loadChildren failed for ${dirNode.path}:`, e);
            }
            dirNode.childrenLoaded = true;
        },

        async build(rootHandle) {
            TreeManager.clear();
            const rootNode = {
                name: rootHandle.name,
                kind: 'directory',
                handle: rootHandle,
                path: '/',
                children: [],
                childrenLoaded: false
            };
            TreeManager.registerNode('/', rootNode);
            TreeManager.fileTree = rootNode;
            await this.loadChildren(rootNode);
            return rootNode;
        },

        async mutateAndRebuild() {
            if (!currentDirHandle) return;
            const previouslyExpanded = new Set(expandedFolders);
            await this.build(currentDirHandle);
            for (const path of previouslyExpanded) {
                const node = TreeManager.getNode(path);
                if (node && node.kind === 'directory') {
                    await this.loadChildren(node);
                    expandedFolders.add(path);
                }
            }
            TreeManager.render();
            TreeManager.highlightActive();
            TreeManager.updateHeader();
        },
        loadExpandedState() {
            try {
                const saved = localStorage.getItem('expandedFolders');
                if (saved) expandedFolders = new Set(JSON.parse(saved));
            } catch {}
        },
        saveExpandedState() {
            try { localStorage.setItem('expandedFolders', JSON.stringify([...expandedFolders])); } catch {}
        },
        saveOpenTabs(currentId) {
            try {
                const data = tabs.filter(t => t.path).map(t => ({
                    path: t.path,
                    name: t.name,
                    active: t.id === currentId
                }));
                localStorage.setItem('openTabs', JSON.stringify(data));
            } catch {}
        },
        loadOpenTabs() {
            try {
                const saved = localStorage.getItem('openTabs');
                return saved ? JSON.parse(saved) : [];
            } catch { return []; }
        },
        async openFolder() {
            try {
                currentDirHandle = await window.showDirectoryPicker();
                await this.saveFolderHandle(currentDirHandle);
                expandedFolders.clear();
                activeDirectoryPath = null;
                await TreeManager.build(currentDirHandle);
                TreeManager.render();
                TreeManager.updateHeader();
                UI.showToast('Folder opened successfully');
            } catch (e) { if (e.name !== 'AbortError') UI.showToast('Open folder cancelled or failed'); }
        },
        async openFile() {
            try {
                const [fileHandle] = await window.showOpenFilePicker();
                const file = await fileHandle.getFile();
                if (!file.type.startsWith('text/') && !TEXT_FILE_EXTENSIONS.test(file.name)) {
                    if (!confirm('Binary file detected. Open anyway?')) return;
                }
                const content = await file.text();
                await TabManager.createNewTab(fileHandle, file.name, content);
            } catch (e) { if (e.name !== 'AbortError') UI.showToast('Open file cancelled or failed'); }
        },
        async openFileFromNode(node) {
            try {
                const file = await node.handle.getFile();
                if (!file.type.startsWith('text/') && !TEXT_FILE_EXTENSIONS.test(file.name)) {
                    if (!confirm('Binary file detected. Open anyway?')) return;
                }
                const content = await file.text();
                await TabManager.createNewTab(node.handle, node.name, content, node.path);
                if (isMobile) {
                    sidebarEl.classList.add('hidden');
                    document.getElementById('sidebar-toggle').textContent = '>';
                }
            } catch (e) {
                UI.showToast(e.message.includes('permission') ? 'Re-open folder to grant write access' : 'Failed to open file');
            }
        },
        async newFile() {
            if (!currentDirHandle) return UI.showToast('Open a folder first');
            const name = await UI.showInputDialog('New file name:');
            if (!name?.trim()) return;
            const trimmed = name.trim();
            if (INVALID_FILENAME_CHARS.test(trimmed) || /[\/\\]/.test(trimmed)) return UI.showToast('Invalid filename');
            let targetPath = contextMenuTarget && contextMenuTarget.kind === 'directory' ? contextMenuTarget.path : (activeDirectoryPath || '');
            const { parent: dirParent, name: dirName } = await this.resolvePath(currentDirHandle, targetPath);
            const parent = targetPath ? await dirParent.getDirectoryHandle(dirName) : dirParent;
            await this.ensureRW(parent);
            const fileHandle = await parent.getFileHandle(trimmed, { create: true });
            await this.writeFile(fileHandle, '');
            if (targetPath) { expandedFolders.add(targetPath); this.saveExpandedState(); }
            await FSA.mutateAndRebuild();
            await TabManager.createNewTab(fileHandle, trimmed, '', targetPath ? `${targetPath}/${trimmed}` : trimmed);
            UI.closeContextMenu();
        },
        async newFolder() {
            if (!currentDirHandle) return UI.showToast('Open a folder first');
            const name = await UI.showInputDialog('New folder name:');
            if (!name?.trim()) return;
            const trimmed = name.trim();
            if (INVALID_FILENAME_CHARS.test(trimmed) || /[\/\\]/.test(trimmed)) return UI.showToast('Invalid folder name');
            let targetPath = contextMenuTarget && contextMenuTarget.kind === 'directory' ? contextMenuTarget.path : (activeDirectoryPath || '');
            const { parent: dirParent, name: dirName } = await this.resolvePath(currentDirHandle, targetPath);
            const parent = targetPath ? await dirParent.getDirectoryHandle(dirName) : dirParent;
            await this.ensureRW(parent);
            await parent.getDirectoryHandle(trimmed, { create: true });
            if (targetPath) { expandedFolders.add(targetPath); this.saveExpandedState(); }
            await FSA.mutateAndRebuild();
            UI.showToast('Folder created');
            UI.closeContextMenu();
        },
        async saveTab(tab) {
            if (!tab || !tab.handle || !tab.dirty) return;
            try {
                const content = (currentTabId === tab.id) ? textarea.value : tab.content;
                await this.writeFile(tab.handle, content);
                tab.content = content;
                tab.dirty = false;
                if (tab.element) {
                    const ind = tab.element.querySelector('.dirty-indicator');
                    if (ind) ind.style.display = 'none';
                }
                UI.updateEditorStatus(tab);
                UI.showToast('Saved', 1200);
            } catch (err) {
                UI.showToast(err.message.includes('permission') ? 'Re-authorize folder' : 'Save failed');
            }
        },
        saveCurrentFile() {
            if (currentTabId === null) return;
            const tab = tabs.find(t => t.id === currentTabId);
            if (tab) this.saveTab(tab);
        },
        scheduleSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                if (saveInProgress || !currentTabId) return;
                const tab = tabs.find(t => t.id === currentTabId);
                if (tab?.dirty) this.saveTab(tab);
            }, 750);
        },
        async flushSave() {
            if (saveInProgress) return;
            saveInProgress = true;
            try {
                await Promise.allSettled(tabs.filter(t => t.dirty).map(t => this.saveTab(t)));
            } finally { saveInProgress = false; }
        },
        async deleteFile() {
            const target = contextMenuTarget;
            if (!target || target.kind !== 'file') return;
            if (!confirm(`Delete "${target.name}"?`)) { UI.closeContextMenu(); return; }
            try {
                for (let i = 0; i < tabs.length; i++) {
                    if (tabs[i].handle && await this.isSameEntry(tabs[i].handle, target.handle)) {
                        TabManager.closeTab(tabs[i].id);
                        break;
                    }
                }
                const { parent, name } = await this.resolvePath(currentDirHandle, target.path);
                await this.ensureRW(parent);
                await parent.removeEntry(name);
                await FSA.mutateAndRebuild();
                UI.showToast('File deleted');
            } catch (e) { UI.showToast('Delete failed'); }
            UI.closeContextMenu();
        },
        async deleteFolder() {
            const target = contextMenuTarget;
            if (!target || target.kind !== 'directory') return;
            if (target.children && target.children.length) {
                UI.showToast('Cannot delete non-empty folder');
                UI.closeContextMenu();
                return;
            }
            if (!confirm(`Delete folder "${target.name}"?`)) { UI.closeContextMenu(); return; }
            try {
                const { parent, name } = await this.resolvePath(currentDirHandle, target.path);
                await this.ensureRW(parent);
                await parent.removeEntry(name);
                expandedFolders.delete(target.path);
                this.saveExpandedState();
                await FSA.mutateAndRebuild();
                UI.showToast('Folder deleted');
            } catch (e) { UI.showToast('Delete failed'); }
            UI.closeContextMenu();
        },
                async renameItem() {
            const target = contextMenuTarget;
            if (!target) return;
            const oldName = target.name;
            const isFolder = target.kind === 'directory';
            const newName = await UI.showInputDialog(`Rename ${isFolder ? 'folder' : 'file'}:`, oldName);
            if (!newName || !newName.trim() || newName === oldName) {
                UI.closeContextMenu(); return;
            }
            const trimmed = newName.trim();
            if (INVALID_FILENAME_CHARS.test(trimmed) || /[\/\\]/.test(trimmed)) {
                UI.showToast('Invalid name'); UI.closeContextMenu(); return;
            }
            try {
                const oldPath = target.path;
                const { parent } = await this.resolvePath(currentDirHandle, oldPath);
                await this.ensureRW(parent);
                const oldHandle = target.handle;
                let updatedHandle = oldHandle;

                if (isFolder) {
                    if (oldHandle.move) {
                        await oldHandle.move(parent, trimmed);
                        updatedHandle = oldHandle;  // move updates handle in place
                    } else {
                        UI.showToast('Folder rename needs latest Chrome/Edge'); UI.closeContextMenu(); return;
                    }
                } else {
                    const file = await oldHandle.getFile();
                    const content = await file.text();
                    updatedHandle = await parent.getFileHandle(trimmed, { create: true });
                    await this.writeFile(updatedHandle, content);
                    await parent.removeEntry(oldName);
                }

                const newPath = oldPath.substring(0, oldPath.lastIndexOf('/') + 1) + trimmed || trimmed;
                for (const tab of tabs) {
                    if (tab.path === oldPath) {
                        tab.name = trimmed;
                        tab.path = newPath;
                        tab.handle = updatedHandle;
                        if (tab.element) tab.element.querySelector('.tab-name').textContent = trimmed;
                    }
                    if (isFolder && tab.path && tab.path.startsWith(oldPath + '/')) {
                        tab.path = newPath + tab.path.substring(oldPath.length);
                    }
                }
                if (activeFilePath === oldPath) activeFilePath = newPath;
                else if (isFolder && activeFilePath && activeFilePath.startsWith(oldPath + '/')) {
                    activeFilePath = newPath + activeFilePath.substring(oldPath.length);
                }

                await FSA.mutateAndRebuild();
                UI.showToast(`Renamed to ${trimmed}`);
            } catch (e) {
                console.error(e);
                UI.showToast('Rename failed');
            }
            UI.closeContextMenu();
        },
      
        async moveEntry(srcPath, destFolderPath) {
            const srcNode = TreeManager.getNode(srcPath);
            if (!srcNode) return;
            if (srcNode.kind === 'directory' && destFolderPath.startsWith(srcPath + '/')) return UI.showToast('Cannot move folder into itself');
            const { parent: srcParent } = await this.resolvePath(currentDirHandle, srcPath);
            const destNode = TreeManager.getNode(destFolderPath || '/');
            if (!destNode) return UI.showToast('Destination folder not found');
            const destHandle = destNode.handle;
            if (await this.isSameEntry(srcParent, destHandle)) return;
            try {
                await this.ensureRW(srcParent);
                await this.ensureRW(destHandle);
                let nameExists = false;
                try { await destHandle.getFileHandle(srcNode.name); nameExists = true; } catch (e) { if (e.name !== 'NotFoundError') throw e; }
                if (!nameExists) { try { await destHandle.getDirectoryHandle(srcNode.name); nameExists = true; } catch (e) { if (e.name !== 'NotFoundError') throw e; } }
                if (nameExists) { UI.showToast(`"${srcNode.name}" already exists in destination`); return; }

                let updatedHandle = srcNode.handle;
                if (srcNode.handle.move) {
                    await srcNode.handle.move(destHandle, srcNode.name);
                    updatedHandle = srcNode.handle;
                } else if (srcNode.kind === 'file') {
                    const file = await srcNode.handle.getFile();
                    const newHandle = await destHandle.getFileHandle(srcNode.name, { create: true });
                    const writable = await newHandle.createWritable();
                    await writable.write(file);
                    await writable.close();
                    await srcParent.removeEntry(srcNode.name);
                    updatedHandle = newHandle;
                } else {
                    throw new Error('Moving folders requires Chrome/Edge 122+ or another browser with FileSystemHandle.move() support');
                }

                const newPath = destFolderPath ? `${destFolderPath}/${srcNode.name}` : srcNode.name;
                for (const tab of tabs) {
                    if (tab.path === srcPath) {
                        tab.path = newPath;
                        tab.handle = updatedHandle;
                    } else if (tab.path && tab.path.startsWith(srcPath + '/')) {
                        tab.path = newPath + tab.path.substring(srcPath.length);
                    }
                }
                if (activeFilePath === srcPath) activeFilePath = newPath;
                else if (activeFilePath && activeFilePath.startsWith(srcPath + '/')) {
                    activeFilePath = newPath + activeFilePath.substring(srcPath.length);
                }
                if (destFolderPath) { expandedFolders.add(destFolderPath); this.saveExpandedState(); }
                await FSA.mutateAndRebuild();
                UI.showToast(`Moved "${srcNode.name}"`);
            } catch (e) { UI.showToast('Move failed'); }
            UI.closeContextMenu();
        },
    // ──────────────────────────────────────────────
    // TREE MANAGER – owns data + DOM + updates
    // ──────────────────────────────────────────────
    const TreeManager = (() => {
        let fileTree = null;
        const nodeByPath = new Map();

        const _renderTreeItem = (node, parentEl, level = 0) => {
            if (node.kind === 'directory') {
                const folderDiv = document.createElement('div');
                const header = document.createElement('div');
                header.className = 'folder-header' + (level === 0 ? ' top-level' : '');
                header.dataset.path = node.path;
                header.style.paddingLeft = (level * 14) + 'px';
                header.tabIndex = 0;
                const toggle = document.createElement('span');
                toggle.className = 'toggle';
                toggle.textContent = expandedFolders.has(node.path) ? '▼' : '▶';
                header.append(toggle, document.createTextNode(' ' + node.name + '/'));
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children';
                childrenDiv.style.display = expandedFolders.has(node.path) ? 'block' : 'none';
                folderDiv.append(header, childrenDiv);
                parentEl.appendChild(folderDiv);

                header.onclick = async (e) => {
                    if (longPressTriggered) return;
                    const isExpanded = expandedFolders.has(node.path);
                    if (!isExpanded) {
                        await FSA.loadChildren(node);
                        childrenDiv.replaceChildren();
                        node.children.forEach(c => _renderTreeItem(c, childrenDiv, level + 1));
                    }
                    if (isExpanded) {
                        expandedFolders.delete(node.path);
                        childrenDiv.style.display = 'none';
                        toggle.textContent = '▶';
                    } else {
                        expandedFolders.add(node.path);
                        childrenDiv.style.display = 'block';
                        toggle.textContent = '▼';
                    }
                    FSA.saveExpandedState();
                    activeDirectoryPath = node.path;
                    TreeManager.highlightActive();
                    TreeManager.updateHeader();
                };
                header.onkeydown = e => { if (e.key === ' ') { e.preventDefault(); header.click(); } };

                header.draggable = true;
                header.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('application/x-tree-path', node.path);
                    e.dataTransfer.effectAllowed = 'move';
                    header.classList.add('dragging');
                });
                header.addEventListener('dragend', () => header.classList.remove('dragging'));
                header.addEventListener('dragover', e => {
                    if (!e.dataTransfer.types.includes('application/x-tree-path')) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    header.classList.add('drop-target');
                });
                header.addEventListener('dragleave', () => header.classList.remove('drop-target'));
                header.addEventListener('drop', e => {
                    e.preventDefault();
                    header.classList.remove('drop-target');
                    const srcPath = e.dataTransfer.getData('application/x-tree-path');
                    if (srcPath && srcPath !== node.path && !node.path.startsWith(srcPath + '/')) {
                        FSA.moveEntry(srcPath, node.path);
                    }
                });

                if (expandedFolders.has(node.path) && node.children.length) {
                    node.children.forEach(c => _renderTreeItem(c, childrenDiv, level + 1));
                }
            } else {
                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-item';
                fileDiv.dataset.path = node.path;
                fileDiv.style.paddingLeft = (level * 14 + 26) + 'px';
                fileDiv.textContent = node.name;
                fileDiv.tabIndex = 0;
                fileDiv.onclick = () => { if (!longPressTriggered) FSA.openFileFromNode(node); };
                fileDiv.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fileDiv.click(); } };

                fileDiv.draggable = true;
                fileDiv.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('application/x-tree-path', node.path);
                    e.dataTransfer.effectAllowed = 'move';
                    fileDiv.classList.add('dragging');
                });
                fileDiv.addEventListener('dragend', () => fileDiv.classList.remove('dragging'));

                parentEl.appendChild(fileDiv);
            }
        };

        return {
            get fileTree() { return fileTree; },
            set fileTree(v) { fileTree = v; },
            getNode(path) { return nodeByPath.get(path); },
            registerNode(path, node) { nodeByPath.set(path, node); },
            async build(rootHandle) {
                return FSA.build(rootHandle);
            },
            render() {
                treeContainer.replaceChildren();
                if (!fileTree) {
                    const msg = document.createElement('div');
                    msg.style.cssText = 'padding:20px;color:#52525b;text-align:center;font-size:12px';
                    msg.textContent = 'No folder open';
                    treeContainer.appendChild(msg);
                    return;
                }
                fileTree.children.forEach(child => _renderTreeItem(child, treeContainer, 0));
                this.highlightActive();
            },
            updateHeader() {
                if (!fileTree || !currentDirHandle) {
                    activeDirNameEl.textContent = '/';
                    rootDirNameEl.textContent = 'Click to open folder';
                    sidebarHeaderActionsEl.replaceChildren();
                    return;
                }
                const safeName = currentDirHandle.name;
                rootDirNameEl.textContent = safeName;
                activeDirNameEl.textContent = activeDirectoryPath ? safeName + '/' + activeDirectoryPath : safeName;
                const refreshSpan = document.createElement('span');
                refreshSpan.className = 'directory-clear';
                refreshSpan.id = 'refresh-folder';
                refreshSpan.title = 'Refresh tree';
                refreshSpan.textContent = '\u27F3';
                const clearSpan = document.createElement('span');
                clearSpan.className = 'directory-clear';
                clearSpan.id = 'clear-folder';
                clearSpan.textContent = '\u232B';
                sidebarHeaderActionsEl.replaceChildren(refreshSpan, clearSpan);
            },
            highlightActive() {
                treeContainer.querySelectorAll('.file-item.active,.folder-header.active,.folder-header.active-dir,.folder-header.active-ancestor').forEach(el => el.classList.remove('active','active-dir','active-ancestor'));
                if (activeFilePath) {
                    const el = treeContainer.querySelector(`.file-item[data-path="${activeFilePath.replace(/"/g, '\\"')}"]`);
                    if (el) el.classList.add('active');
                    const parts = activeFilePath.split('/');
                    for (let i = 1; i < parts.length; i++) {
                        const p = parts.slice(0, i).join('/');
                        const folderEl = treeContainer.querySelector(`.folder-header[data-path="${p.replace(/"/g, '\\"')}"]`);
                        if (folderEl) folderEl.classList.add('active');
                    }
                }
                if (activeDirectoryPath) {
                    const dirEl = treeContainer.querySelector(`.folder-header[data-path="${activeDirectoryPath.replace(/"/g, '\\"')}"]`);
                    if (dirEl) dirEl.classList.add('active-dir');
                    const parts = activeDirectoryPath.split('/');
                    for (let i = 1; i < parts.length; i++) {
                        const p = parts.slice(0, i).join('/');
                        const folderEl = treeContainer.querySelector(`.folder-header[data-path="${p.replace(/"/g, '\\"')}"]`);
                        if (folderEl) folderEl.classList.add('active-ancestor');
                    }
                }
            },
            clear() {
                fileTree = null;
                nodeByPath.clear();
                treeContainer.replaceChildren();
            }
        };
    })();
    // ──────────────────────────────────────────────
    // TabManager – tab creation, switching & closing
    // ──────────────────────────────────────────────
    const TabManager = {
        async createNewTab(handle, name, content = '', path = null) {
            if (handle) {
                for (const t of tabs) {
                    if (t.handle && await FSA.isSameEntry(t.handle, handle)) {
                        this.switchToTab(t.id);
                        return;
                    }
                }
            }
            const id = nextTabId++;
            const tab = { id, name, handle, content, dirty: false, path, element: null };
            tabs.push(tab);
            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.dataset.id = id;
            tabEl.draggable = true;
            const tabName = document.createElement('span');
            tabName.className = 'tab-name';
            tabName.textContent = name;
            const dirtyInd = document.createElement('span');
            dirtyInd.className = 'dirty-indicator';
            dirtyInd.style.display = 'none';
            dirtyInd.textContent = ' *';
            const closeBtn = document.createElement('span');
            closeBtn.className = 'close';
            closeBtn.textContent = '×';
            tabEl.append(tabName, dirtyInd, closeBtn);
            tabEl.onclick = () => this.switchToTab(id);
            closeBtn.onclick = e => { e.stopPropagation(); this.closeTab(id); };
            tabEl.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', String(id));
                e.dataTransfer.effectAllowed = 'move';
            });
            tabEl.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                tabEl.classList.add('drag-over');
            });
            tabEl.addEventListener('dragleave', () => tabEl.classList.remove('drag-over'));
            tabEl.addEventListener('drop', e => {
                e.preventDefault();
                tabEl.classList.remove('drag-over');
                const draggedId = parseInt(e.dataTransfer.getData('text/plain'), 10);
                if (draggedId === id) return;
                const fromIdx = tabs.findIndex(t => t.id === draggedId);
                const toIdx = tabs.findIndex(t => t.id === id);
                if (fromIdx === -1 || toIdx === -1) return;
                const [moved] = tabs.splice(fromIdx, 1);
                const rect = tabEl.getBoundingClientRect();
                const insertAfter = e.clientX > rect.left + rect.width / 2;
                const adjustedToIdx = fromIdx < toIdx ? toIdx - 1 : toIdx;
                tabs.splice(insertAfter ? adjustedToIdx + 1 : adjustedToIdx, 0, moved);
                tabsContainer.append(...tabs.map(t => t.element));
                FSA.saveOpenTabs(currentTabId);
            });
            tabsContainer.appendChild(tabEl);
            tab.element = tabEl;
            this.switchToTab(id);
            return tab;
        },
        switchToTab(id) {
            if (currentTabId !== null) {
                const cur = tabs.find(t => t.id === currentTabId);
                if (cur) {
                    cur.content = textarea.value;
                    cur.scrollTop = textarea.scrollTop;
                }
            }
            currentTabId = id;
            const tab = tabs.find(t => t.id === id);
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.element.classList.add('active');
            textarea.value = tab.content || '';
            lastLineCount = 0;
            UI.updateLineNumbers();
            if (tab.scrollTop !== undefined) {
                textarea.scrollTop = tab.scrollTop;
                gutter.scrollTop = tab.scrollTop;
            }
            UI.updateEditorStatus(tab);
            if (tab.path) {
                activeFilePath = tab.path;
                TreeManager.highlightActive();
            }
            FSA.saveOpenTabs(id);
        },
        closeTab(id) {
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            const tab = tabs[idx];
            if (tab.dirty && !confirm(`"${tab.name}" has unsaved changes. Close anyway?`)) return;
            tabs.splice(idx, 1);
            tab.element.remove();
            if (tabs.length === 0) {
                currentTabId = null;
                textarea.value = '';
                gutter.replaceChildren();
                editorStatusEl.textContent = 'No file open';
                FSA.saveOpenTabs(null);
                localStorage.removeItem('openTabs');
                return;
            }
            this.switchToTab(tabs[Math.min(idx, tabs.length - 1)].id);
        }
    };
    // ──────────────────────────────────────────────
    // UI
    // ──────────────────────────────────────────────
    const UI = {
        showToast(message, duration = 2800) {

            setTimeout(() => t.remove(), duration);
        },
        showInputDialog(title, defaultValue = '') {
            return new Promise(resolve => {

                box.style.cssText = 'background:#18181b;padding:24px;border-radius:8px;min-width:320px;border:1px solid #27272a;';
                const titleDiv = document.createElement('div');

                titleDiv.textContent = title;
                const input = document.createElement('input');
                input.type = 'text';
                input.value = defaultValue;
                input.style.cssText = 'width:100%;padding:10px;background:#27272a;border:1px solid #3f3f46;color:#e4e4e7;border-radius:4px;font-size:16px;';
                const btnRow = document.createElement('div');
                btnRow.style.cssText = 'display:flex;gap:8px;margin-top:16px;';
                const okBtn = document.createElement('button');
                okBtn.style.cssText = 'flex:1;min-height:44px;background:#a1a1aa;color:#09090b;border:none;border-radius:4px;';
                okBtn.textContent = 'OK';
                const cancelBtn = document.createElement('button');
                cancelBtn.style.cssText = 'flex:1;min-height:44px;background:#27272a;color:#e4e4e7;border:none;border-radius:4px;';
                cancelBtn.textContent = 'Cancel';
                btnRow.append(okBtn, cancelBtn);
                box.append(titleDiv, input, btnRow);
                modal.appendChild(box);
                document.body.appendChild(modal);
                input.focus();
                input.select();
                okBtn.onclick = () => { resolve(input.value); modal.remove(); };
                cancelBtn.onclick = () => { resolve(null); modal.remove(); };
                input.onkeydown = e => {
                    if (e.key === 'Enter') { resolve(input.value); modal.remove(); }
                    if (e.key === 'Escape') { resolve(null); modal.remove(); }
                };
                modal.onclick = e => { if (e.target === modal) { resolve(null); modal.remove(); } };
            });
        },
        toggleSidebar() {
            sidebarEl.classList.toggle('hidden');
            const btn = document.getElementById('sidebar-toggle');
            btn.textContent = sidebarEl.classList.contains('hidden') ? '›' : '‹';
        },
        showContextMenu(e, node) {
            e.preventDefault();
            UI.closeContextMenu();
            contextMenuTarget = node;
            contextMenu = document.createElement('div');
            contextMenu.className = 'context-menu';
            const addItem = (label, handler, cls = '') => {
                const item = document.createElement('div');
                item.className = 'context-menu-item' + (cls ? ' ' + cls : '');
                item.textContent = label;
                item.addEventListener('click', () => { handler(); UI.closeContextMenu(); });
                contextMenu.appendChild(item);
            };
            const addSeparator = () => {
                const sep = document.createElement('div');
                sep.className = 'context-menu-separator';
                contextMenu.appendChild(sep);

            if (!node) {
                addItem('New File', () => FSA.newFile());
                addItem('New Folder', () => FSA.newFolder());
                addSeparator();
                addItem('Open File', () => FSA.openFile());
                addItem('Open Folder', () => FSA.openFolder());
            } else if (node.kind === 'directory') {
                addItem('New File', () => FSA.newFile());
                addItem('New Folder', () => FSA.newFolder());
                addSeparator();
                addItem('Rename', () => FSA.renameItem());
                addSeparator();
                addItem('Delete Folder', () => FSA.deleteFolder(), 'danger');
            } else {
                addItem('Open', () => FSA.openFileFromNode(contextMenuTarget));
                addItem('Rename', () => FSA.renameItem());
                addSeparator();
                addItem('Delete File', () => FSA.deleteFile(), 'danger');
            }
            contextMenu.style.left = e.clientX + 'px';
            contextMenu.style.top = e.clientY + 'px';
            document.body.appendChild(contextMenu);
            const rect = contextMenu.getBoundingClientRect();
            if (rect.right > window.innerWidth) contextMenu.style.left = (window.innerWidth - rect.width - 8) + 'px';
            if (rect.bottom > window.innerHeight) contextMenu.style.top = (window.innerHeight - rect.height - 8) + 'px';
        },
        closeContextMenu() {
            if (contextMenu) {
                contextMenu.remove();
                contextMenu = null;
                contextMenuTarget = null;
            }
        },
        updateLineNumbers() {
            const lineCount = (textarea.value.match(/\n/g) || []).length + 1;
            if (lineCount === lastLineCount) return;
            lastLineCount = lineCount;
            gutter.textContent = Array.from({ length: lineCount }, (_, i) => i + 1).join('\n');
        },
        updateEditorStatus(tab) {
            const pos = textarea.selectionStart || 0;
            const before = textarea.value.substring(0, pos);
            const lines = before.split('\n');
            const line = lines.length;
            const col = lines[lines.length - 1].length + 1;
            const modified = tab.dirty ? ' • Modified' : '';
            statusEl.textContent = `Ln ${line}, Col ${col} | ${tabs.length} tab${tabs.length !== 1 ? 's' : ''}`;
            editorStatusEl.textContent = tab.name + modified;
        },
        bindEvents() {
            document.getElementById('sidebar-toggle').addEventListener('click', UI.toggleSidebar);
            document.getElementById('sidebar-root-row').addEventListener('click', () => FSA.openFolder());
            document.getElementById('topbar-active-row').addEventListener('click', () => {
                activeDirectoryPath = null;
                TreeManager.highlightActive();
                TreeManager.updateHeader();
            });
            window.addEventListener('resize', () => {
                const wasMobile = isMobile;
                isMobile = window.innerWidth <= 768;
                if (isMobile && !wasMobile) sidebarEl.classList.add('hidden');
            });
            treeContainer.addEventListener('dragover', e => {
                if (!e.dataTransfer.types.includes('application/x-tree-path')) return;
                if (e.target.closest('.folder-header')) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                treeContainer.classList.add('drop-target');
            });
            treeContainer.addEventListener('dragleave', () => treeContainer.classList.remove('drop-target'));
            treeContainer.addEventListener('drop', e => {
                treeContainer.classList.remove('drop-target');
                if (e.target.closest('.folder-header')) return;
                e.preventDefault();
                const srcPath = e.dataTransfer.getData('application/x-tree-path');
                if (srcPath) FSA.moveEntry(srcPath, '');
            });
            document.addEventListener('click', e => {
                if (e.target.id === 'clear-folder') { e.stopPropagation(); FSA.clearSavedFolder(); return; }
                if (e.target.id === 'refresh-folder') {
                    e.stopPropagation();
                    if (currentDirHandle) FSA.mutateAndRebuild();
                    return;
                }
                if (!e.target.closest('.context-menu')) UI.closeContextMenu();
            });
            treeContainer.addEventListener('contextmenu', e => {
                const folder = e.target.closest('.folder-header');
                const file = e.target.closest('.file-item');
                if (folder) {
                    const node = TreeManager.getNode(folder.dataset.path);
                    if (node) UI.showContextMenu(e, node);
                } else if (file) {
                    const node = TreeManager.getNode(file.dataset.path);
                    if (node) UI.showContextMenu(e, node);
                } else {
                    UI.showContextMenu(e, null);
                }
            });
            let longPressTimer = null;
            let touchMoved = false;
            treeContainer.addEventListener('touchstart', e => {
                longPressTriggered = false;
                touchMoved = false;
                const touch = e.touches[0];
                const target = e.target;
                longPressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    const folder = target.closest('.folder-header');
                    const file = target.closest('.file-item');
                    const fakeEvent = { preventDefault() {}, clientX: touch.clientX, clientY: touch.clientY };
                    if (folder) {
                        const node = TreeManager.getNode(folder.dataset.path);
                        if (node) UI.showContextMenu(fakeEvent, node);
                    } else if (file) {
                        const node = TreeManager.getNode(file.dataset.path);
                        if (node) UI.showContextMenu(fakeEvent, node);
                    } else {
                        UI.showContextMenu(fakeEvent, null);
                    }
                }, 600);
            }, { passive: true });
            treeContainer.addEventListener('touchend', e => {
                clearTimeout(longPressTimer);
                if (longPressTriggered) {
                    e.preventDefault();
                    return;
                }
                if (!touchMoved) {
                    const target = e.target;
                    const el = target.closest('.folder-header') || target.closest('.file-item');
                    if (el) {
                        e.preventDefault();
                        el.click();
                    }
                }
            });
            treeContainer.addEventListener('touchmove', () => { clearTimeout(longPressTimer); touchMoved = true; }, { passive: true });
            textarea.addEventListener('input', () => {
                this.updateLineNumbers();
                if (currentTabId) {
                    const tab = tabs.find(t => t.id === currentTabId);
                    if (tab) {
                        tab.dirty = true;
                        if (tab.element) tab.element.querySelector('.dirty-indicator').style.display = '';
                        this.updateEditorStatus(tab);
                        FSA.scheduleSave();
                    }
                }
            });
            textarea.addEventListener('scroll', () => gutter.scrollTop = textarea.scrollTop);
            textarea.addEventListener('selectionchange', () => {
                if (currentTabId) {
                    const tab = tabs.find(t => t.id === currentTabId);
                    if (tab) this.updateEditorStatus(tab);
                }
            });
            textarea.addEventListener('keydown', e => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    const indent = '\t';
                    textarea.value = textarea.value.substring(0, start) + indent + textarea.value.substring(end);
                    textarea.selectionStart = textarea.selectionEnd = start + indent.length;
                    textarea.dispatchEvent(new Event('input'));
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    FSA.saveCurrentFile();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                    e.preventDefault();
                    if (currentTabId) TabManager.closeTab(currentTabId);
                }
               if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
                    e.preventDefault();
                    FSA.newFile();
               }
               if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
               e.preventDefault();
               FSA.openFolder();   // or openFile() — your call
}
            });
           
const slider = document.getElementById('width-slider');
            const valueEl = document.getElementById('width-value');
            const MAX_CHARS = 200;
            slider.addEventListener('input', e => {
                const v = +e.target.value;
                valueEl.textContent = (v === MAX_CHARS) ? '∞' : `${v} char/line`;
                if (v === MAX_CHARS) {
                    textarea.style.maxWidth = 'none';
                    textarea.style.whiteSpace = 'pre';
                    textarea.style.wordWrap = 'normal';
                } else {
                    textarea.style.maxWidth = v + 'ch';
                    textarea.style.whiteSpace = 'pre-wrap';
                    textarea.style.wordWrap = 'break-word';
                }
            });
            slider.dispatchEvent(new Event('input'));
           
            window.addEventListener('beforeunload', e => {
                if (tabs.some(t => t.dirty)) {
                    FSA.flushSave();
                    e.preventDefault();
                    return e.returnValue = 'Unsaved changes will be lost';
                }
            });
        },
        init: async () => {
            textarea = document.getElementById('textarea');
            gutter = document.getElementById('gutter');
            tabsContainer = document.getElementById('tabs');
            treeContainer = document.getElementById('tree-container');
            sidebarHeader = document.getElementById('sidebar-header');
            sidebarEl = document.getElementById('sidebar');
            statusEl = document.getElementById('status');
            editorStatusEl = document.getElementById('editor-status');
            activeDirNameEl = document.getElementById('active-dir-name');
            rootDirNameEl = document.getElementById('root-dir-name');
            sidebarHeaderActionsEl = document.getElementById('sidebar-header-actions');
            UI.bindEvents();
            await FSA.initDB();
            FSA.loadExpandedState();
            const saved = await FSA.loadSavedFolder();
            let hadSavedTabs = false;
            if (saved.status === 'granted') {
                currentDirHandle = saved.handle;
                await TreeManager.build(currentDirHandle);
                TreeManager.render();
                TreeManager.updateHeader();
                const savedTabs = FSA.loadOpenTabs();
                hadSavedTabs = savedTabs.length > 0;
                let activeTabPath = null;
                for (const st of savedTabs) {
                    try {
                        const parts = st.path.split('/');
                        let handle = currentDirHandle;
                        for (let i = 0; i < parts.length - 1; i++) {
                            handle = await handle.getDirectoryHandle(parts[i]);
                        }
                        const fileHandle = await handle.getFileHandle(parts[parts.length - 1]);
                        const file = await fileHandle.getFile();
                        const content = await file.text();
                        await TabManager.createNewTab(fileHandle, st.name, content, st.path);
                        if (st.active) activeTabPath = st.path;
                    } catch {}
                }
                if (activeTabPath) {
                    const activeTab = tabs.find(t => t.path === activeTabPath);
                    if (activeTab) TabManager.switchToTab(activeTab.id);
                } else if (tabs.length > 0) {
                    TabManager.switchToTab(tabs[0].id);
                }
                if (savedTabs.length > 0) UI.showToast(`Restored ${savedTabs.length} tab${savedTabs.length > 1 ? 's' : ''}`);
            } else if (saved.status === 'needs-auth') {
                await FSA.clearSavedFolder();
                UI.showToast('Saved folder access expired – open folder again', 4000);
            }
            if (isMobile) sidebarEl.classList.add('hidden');
            if (!hadSavedTabs && tabs.length === 0) {
                await TabManager.createNewTab(null, 'welcome.txt', window.LEGEND);
            }
        }
    };
    return { init: UI.init };
})();
// Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
// Launch
window.onload = App.init;
</script>
</body>
</html>
